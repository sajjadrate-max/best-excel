// Sabka/Today/Total/Jamah/Jamah/Bqaya block all live-updated as the person
// types, without a full re-render.
function kataWireLiveFormulas(prevTotal, prevItemData){
  prevTotal = prevTotal || {t:0, price:0};
  prevItemData = prevItemData || {};

  // خانے مواد (نمبر/الفاظ) کے سائز کے مطابق خودکار چھوٹے بڑے ہوں — ہر ان پٹ کی
  // چوڑائی اس کے اپنے موجودہ متن کے مطابق مقرر کی جاتی ہے، فکسڈ 100% کی بجائے۔
  function kataAutoSizeInput(input){
    (window.measureAndSizeInput || function(inp){
      if(!inp) return;
      const len = (inp.value || inp.placeholder || '0').toString().length;
      inp.style.width = Math.max(len + 1.5, 3) + 'ch';
    })(input);
  }
  function kataAutoSizeAll(){
    document.querySelectorAll('#kataDetailView .cell-input').forEach(kataAutoSizeInput);
  }
  kataAutoSizeAll();
  document.querySelectorAll('#kataDetailView .cell-input').forEach(input=>{
    input.addEventListener('input', ()=> kataAutoSizeInput(input));
  });

  const showDiscount = kataShowDiscount();
  function recomputeTotalsBlock(){
    let todayT = 0, todayRate = 0, todayDiscount = 0, todayProfit = 0, todayWeightGrams = 0;
    KATA_ITEMS.forEach(item=>{
      const tI = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="t"]`);
      const t = Number((tI && tI.value) || 0) || 0;
      // Z Net Bill (znet1/znet2) اصل سٹاک نہیں — نیٹ بل کی رقم ہے، اس لیے
      // اس کی تعداد Total CTN باکس یا Sabka/Today/Total کے CTN کالم میں کہیں
      // شامل نہیں ہوتی (صارف کی واضح ہدایت، 2026-08-22)۔ Total Rate/Profit/
      // Discount پر البتہ پہلے کی طرح اثر رہتا ہے — صرف CTN گنتی سے خارج۔
      const isZNet = item.key === 'znet1' || item.key === 'znet2';
      if(!isZNet) todayT += t;
      todayRate += item.rate * t;
      todayProfit += item.prift * t;
      if(showDiscount){
        const dI = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="discount"]`);
        const d = Number((dI && dI.value) || 0) || 0;
        todayDiscount += d * t;
      }
      // کل وزن — فی پیس Weight (خانے میں لکھی موجودہ قدر) × ریٹ لسٹ کے Pcs
      // (فی کارٹن تعداد) × T CTN = اس آئٹم کی آج کی کل وزن (گرام میں)۔ Z
      // Net Bill کو یہاں سے بھی خارج رکھا ہے (وہ اصل سٹاک نہیں)۔ پہلے یہاں
      // item.pcsPerCtn (sync کے دوران محفوظ شدہ) پر انحصار تھا جو 0 دکھا
      // رہا تھا — اب براہِ راست ریٹ لسٹ (packs) سے اسی لمحے تازہ نکالتے
      // ہیں، کسی cached قدر پر انحصار نہیں (2026-08-23)۔
      if(!isZNet){
        const wI = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="weight"]`);
        const weightPerPiece = kataParseWeightGrams((wI && wI.value) != null ? wI.value : item.weight);
        const pW = kataFindPack(item.key);
        const pcsPerCtn = pW ? (Number(pW.ctn) || 0) : (item.pcsPerCtn || 0);
        todayWeightGrams += weightPerPiece * pcsPerCtn * t;
      }
    });
    const sumTEl = document.querySelector('[data-kata-sum-t]');
    if(sumTEl) sumTEl.textContent = kataIndianNumberFormat(todayT);
    const sumWeightEl = document.querySelector('[data-kata-sum-weight]');
    if(sumWeightEl) sumWeightEl.textContent = (todayWeightGrams / 1000).toFixed(2);
    // کل وزن (من) — 1 من = 40 کلوگرام (صارف کا بتایا ہوا تبادلہ)۔
    const sumWeightMannEl = document.querySelector('[data-kata-sum-weight-mann]');
    if(sumWeightMannEl) sumWeightMannEl.textContent = (todayWeightGrams / 1000 / 40).toFixed(2);
    // Agency کھاتہ — صارف کی درخواست پر (2026-08-27): "کرایہ" اب دستی نہیں،
    // ہر آئٹم کی "ٹوٹل کرایہ" (فی کارٹن کرایہ × T CTN) کا مجموعہ خودکار
    // بنتا ہے، اور Price میں پہلے کی طرح شامل ہوتا ہے۔
    let kharch;
    if(kataInstance === 'agency'){
      kharch = 0;
      KATA_ITEMS.forEach(item=>{
        const krI = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="krayaRate"]`);
        const tI2 = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="t"]`);
        const kr = Number((krI && krI.value) || 0) || 0;
        const t2 = Number((tI2 && tI2.value) || 0) || 0;
        kharch += kr * t2;
      });
      const sumKharchEl = document.querySelector('[data-kata-sum-kharch]');
      if(sumKharchEl) sumKharchEl.textContent = kataIndianNumberFormat(kharch);
      // کمیشن — Price/کرایہ سے بالکل الگ اپنا مستقل چلنے والا مجموعہ (صارف
      // کی درخواست پر 2026-08-30): کہیں بھی Price/Profit میں شامل نہیں
      // ہوتا، صرف اپنا "کل کمیشن" باکس اپڈیٹ ہوتا رہتا ہے۔
      let todayCommissionLive = 0;
      KATA_ITEMS.forEach(item=>{
        const cmI = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="commissionRate"]`);
        const tI3 = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="t"]`);
        const cm = Number((cmI && cmI.value) || 0) || 0;
        const t3 = Number((tI3 && tI3.value) || 0) || 0;
        todayCommissionLive += cm * t3;
      });
      const sumCommissionEl = document.querySelector('[data-kata-sum-commission]');
      if(sumCommissionEl) sumCommissionEl.textContent = kataIndianNumberFormat((prevTotal.commission||0) + todayCommissionLive);
    } else {
      const kharchInput = document.querySelector('[data-kata-field="kharch"]');
      kharch = Number((kharchInput && kharchInput.value) || 0) || 0;
    }
    // ربنواز کھاتہ — صارف کی درخواست پر (2026-08-22): "کرایہ" کو "خرچہ" کر
    // دیا اور ایک نیا "Less" خانہ بھی شامل کیا — یہ دونوں اب Price میں شامل
    // ہونے کی بجائے سیدھا Profit سے منفی ہوتے ہیں۔ Agency میں پرانا انداز
    // (کرایہ، Price میں شامل) ہی برقرار ہے۔
    const lessInput = document.querySelector('[data-kata-field="less"]');
    const less = Number((lessInput && lessInput.value) || 0) || 0;
    const isRibnawaz = kataInstance === 'ribnawaz';
    const todayPrice = isRibnawaz ? todayRate : (todayRate + kharch);
    if(isRibnawaz) todayProfit = todayProfit - kharch - less;
    // Total Profit/Total Price باکسز — سیلزمین/ربنواز کھاتہ (ms/ماہانہ ریکارڈ
    // کے 3 باکس والے انداز جیسے)، Agency میں یہ باکس سرے سے موجود ہی نہیں۔
    const sumProfitEl = document.querySelector('[data-kata-sum-profit]');
    if(sumProfitEl) sumProfitEl.textContent = kataIndianNumberFormat(todayProfit);
    const sumPriceEl = document.querySelector('[data-kata-sum-price]');
    if(sumPriceEl) sumPriceEl.textContent = kataIndianNumberFormat(todayPrice);
    // پہلی انٹری میں "سابقہ" خود لکھی جا سکتی ہے — تب اسی خانے سے پڑھیں،
    // ورنہ ہمیشہ کی طرح پچھلی انٹری کی قدر (prevTotal) استعمال ہو۔
    const sabkaTI = document.querySelector('[data-kata-sabka="t"]');
    const sabkaPI = document.querySelector('[data-kata-sabka="price"]');
    const sabkaBase = (sabkaTI || sabkaPI) ? {
      t: Number((sabkaTI && sabkaTI.value) || 0) || 0,
      price: Number((sabkaPI && sabkaPI.value) || (prevTotal.price||0)) || 0,
      profit: Number((document.querySelector('[data-kata-sabka="profit"]')||{}).value || prevTotal.profit || 0) || 0,
      discount: Number((document.querySelector('[data-kata-sabka="discount"]')||{}).value || prevTotal.discount || 0) || 0,
    } : prevTotal;
    const totT = sabkaBase.t + todayT, totPrice = sabkaBase.price + todayPrice;
    const totProfit = (sabkaBase.profit||0) + todayProfit;
    const set = (sel, val)=>{ const el = document.querySelector(sel); if(el) el.textContent = kataIndianNumberFormat(val); };
    set('[data-kata-today-t]', todayT);
    set('[data-kata-today-price]', todayPrice);
    set('[data-kata-tot-t]', totT);
    set('[data-kata-tot-price]', totPrice);
    set('[data-kata-today-profit]', todayProfit);
    set('[data-kata-tot-profit]', totProfit);
    if(showDiscount){
      const totDiscount = (sabkaBase.discount||0) + todayDiscount;
      set('[data-kata-today-discount]', todayDiscount);
      set('[data-kata-tot-discount]', totDiscount);
    }
    const j = (sel)=>{ const el = document.querySelector(sel); return el ? kataParseNum(el.value) : 0; };
    const jamahPrice = j('[data-jamah="price0"]') + j('[data-jamah="price1"]');
    set('[data-kata-bqaya-price]', totPrice - jamahPrice);
    const jamahProfit = j('[data-jamah="profit0"]') + j('[data-jamah="profit1"]');
    set('[data-kata-bqaya-profit]', totProfit - jamahProfit);
    if(showDiscount){
      const totDiscount = (sabkaBase.discount||0) + todayDiscount;
      const jamahDiscount = j('[data-jamah="discount0"]') + j('[data-jamah="discount1"]');
      set('[data-kata-bqaya-discount]', totDiscount - jamahDiscount);
    }
  }
  window.kataRecomputeTotalsBlock = recomputeTotalsBlock; // ریٹ لسٹ B میں تبدیلی پر فوری تازہ کاری کے لیے (syncKataItemsFromRateList)
  document.querySelectorAll('[data-kata-sabka]').forEach(input=>{
    input.addEventListener('input', recomputeTotalsBlock);
  });

  KATA_ITEMS.forEach((item, idx)=>{
    const tInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="t"]`);
    const nameInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="name"]`);
    const weightInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="weight"]`);
    const discountInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="discount"]`);
    const krayaRateInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="krayaRate"]`);
    const commissionRateInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="commissionRate"]`);
    const totalRateCell = document.querySelector(`[data-kata-totalrate="${item.key}"]`);
    const totalPriftCell = document.querySelector(`[data-kata-totalprift="${item.key}"]`);
    const discountTotalCell = document.querySelector(`[data-kata-discounttotal="${item.key}"]`);
    const krayaTotalCell = document.querySelector(`[data-kata-krayatotal="${item.key}"]`);
    const commissionTotalCell = document.querySelector(`[data-kata-commissiontotal="${item.key}"]`);
    const totalCtnCell = document.querySelector(`[data-kata-totalctn="${item.key}"]`);
    const isZNetItem = item.key === 'znet1' || item.key === 'znet2';
    const sabkaCtnForItem = isZNetItem ? 0 : ((prevItemData[item.key] && prevItemData[item.key].totalT) || 0);

    const getT = ()=> Number((tInput && tInput.value)||0)||0;
    const refreshRow = ()=>{
      if(totalRateCell) totalRateCell.textContent = kataIndianNumberFormat(item.rate * getT());
      if(totalPriftCell) totalPriftCell.textContent = kataIndianNumberFormat(item.prift * getT());
      if(discountTotalCell){
        const d = Number((discountInput && discountInput.value)||0)||0;
        discountTotalCell.textContent = kataIndianNumberFormat(d * getT());
      }
      if(krayaTotalCell){
        const kr = Number((krayaRateInput && krayaRateInput.value)||0)||0;
        krayaTotalCell.textContent = kataIndianNumberFormat(kr * getT());
      }
      if(commissionTotalCell){
        const cm = Number((commissionRateInput && commissionRateInput.value)||0)||0;
        commissionTotalCell.textContent = kataIndianNumberFormat(cm * getT());
      }
      if(totalCtnCell) totalCtnCell.textContent = kataIndianNumberFormat(isZNetItem ? 0 : (sabkaCtnForItem + getT()));
      recomputeTotalsBlock();
    };

    if(nameInput) nameInput.addEventListener('input', ()=>{ item.name = nameInput.value; item.nameManual = true; });
    if(weightInput) weightInput.addEventListener('input', ()=>{ item.weight = weightInput.value; });
    if(tInput) tInput.addEventListener('input', refreshRow);
    if(discountInput) discountInput.addEventListener('input', refreshRow);
    if(krayaRateInput) krayaRateInput.addEventListener('input', refreshRow);
    if(commissionRateInput) commissionRateInput.addEventListener('input', refreshRow);
    // Z Net Bill — Rate/Profit یہاں دستی ٹائپ کیے جا سکتے ہیں (باقی
    // آئٹمز کے برعکس)، اس لیے ان کی تبدیلی پر بھی قطار/کل خودکار تازہ ہو۔
    if(item.key === 'znet1' || item.key === 'znet2'){
      const rateInput = document.querySelector(`[data-kata-rate="${item.key}"]`);
      const priftInput = document.querySelector(`[data-kata-prift="${item.key}"]`);
      if(rateInput) rateInput.addEventListener('input', ()=>{
        item.rate = Math.round((parseFloat(rateInput.value) || 0) * 100) / 100;
        refreshRow();
      });
      if(priftInput) priftInput.addEventListener('input', ()=>{
        item.prift = Math.round((parseFloat(priftInput.value) || 0) * 100) / 100;
        refreshRow();
      });
    }
  });
  document.querySelectorAll('[data-jamah]').forEach(input=>{
    input.addEventListener('input', recomputeTotalsBlock);
    kataWireJamahFormatting(input);
  });
  ['kharch', 'less'].forEach(field=>{
    const input = document.querySelector(`[data-kata-field="${field}"]`);
    if(input) input.addEventListener('input', recomputeTotalsBlock);
  });

  function applyKataColLock(field){
    const locked = kataColLocked[field];
    document.querySelectorAll(`[data-kata-field="${field}"]`).forEach(input=>{
      // Z Net Bill (znet1/znet2) کوئی ریٹ لسٹ آئٹم نہیں — مکمل طور پر
      // دستی/آزاد قطاریں ہیں، اس لیے یہ عام "#" تالے سے کبھی متاثر نہیں
      // ہوتیں، ہمیشہ کھلی رہتی ہیں۔
      if(input.dataset.kataItem === 'znet1' || input.dataset.kataItem === 'znet2') return;
      input.disabled = locked;
    });
  }
  // Items/Weight — دونوں اب ایک ہی مشترکہ تالے سے کنٹرول ہوتے ہیں، "#" کے
  // ساتھ اوپر بائیں جانب۔ خودکار ریٹ لسٹ B سے آنا جاری رہے گا، مگر ضرورت
  // ہو تو دونوں ایک ساتھ کھول کر دستی بھی لکھ سکیں۔ T CTN ہر روز نئے سرے
  // سے لکھا جاتا ہے، اس لیے وہ ہمیشہ کھلا رہتا ہے، اس تالے میں شامل نہیں۔
  function applyKataAll3Lock(){
    ['name','weight'].forEach(applyKataColLock);
    const btn = document.querySelector('[data-kata-lockbtn="all3"]');
    const locked = kataColLocked.name;
    if(btn){
      btn.className = 'row-lock-btn ' + (locked ? 'is-locked' : 'is-unlocked');
      btn.textContent = locked ? '🔒' : '🔓';
      btn.title = locked ? 'Items/Weight ترمیم کے لیے کھولیں' : 'Items/Weight لاک کریں';
    }
  }
  applyKataAll3Lock();
  const kataAll3Btn = document.querySelector('[data-kata-lockbtn="all3"]');
  if(kataAll3Btn) kataAll3Btn.addEventListener('click', ()=>{
    const newState = !kataColLocked.name;
    kataColLocked.name = kataColLocked.weight = newState;
    applyKataAll3Lock();
  });
  ['name','weight'].forEach(field=>{
    document.querySelectorAll(`[data-kata-field="${field}"]`).forEach(input=>{
      input.addEventListener('change', ()=>{
        // یہاں تالا کھول کر جتنی چاہیں تبدیلیاں کی جا سکتی ہیں — تالا خود
        // بخود صرف اس وقت دوبارہ لگتا ہے جب صارف اس کھاتے سے واپس فہرست
        // میں چلا جائے (دیکھیں kataShowList)، ہر انفرادی تبدیلی پر نہیں۔
        if(typeof scheduleSiteDataSave === 'function') scheduleSiteDataSave();
      });
    });
  });

  // ---------- UNDO (↩ / Ctrl+Z) ----------
  // One undo entry per finished edit (captured on focus, pushed on
  // change/blur) rather than per keystroke — so pressing undo once
  // reverts a whole edit, not one character. Covers every editable
  // کھاتے cell: name/weight/t/rate/prift/d/salesman, both Jamah pairs,
  // and every Sale Mahana "Today" quantity.
  function kataTrackUndo(input){
    input.addEventListener('focus', ()=>{ input.dataset.kataPrevValue = input.value; });
    input.addEventListener('change', ()=>{
      if(kataUndoRestoring) return;
      if(input.dataset.kataPrevValue !== undefined && input.dataset.kataPrevValue !== input.value){
        kataUndoStack.push({input, oldValue: input.dataset.kataPrevValue});
        if(kataUndoStack.length > 50) kataUndoStack.shift();
      }
      input.dataset.kataPrevValue = input.value;
    });
  }
  document.querySelectorAll('#kataDetailView .cell-input').forEach(kataTrackUndo);

  function kataUndo(){
    let entry = kataUndoStack.pop();
    while(entry && !document.body.contains(entry.input)) entry = kataUndoStack.pop(); // skip entries from rows no longer in the DOM (e.g. after a save re-render)
    if(!entry) return;
    kataUndoRestoring = true;
    entry.input.value = entry.oldValue;
    entry.input.dataset.kataPrevValue = entry.oldValue;
    entry.input.dispatchEvent(new Event('input', {bubbles:true}));
    kataUndoRestoring = false;
  }
  window.kataUndo = kataUndo; // سائٹ کے مشترکہ ↩ بٹن سے بھی رسائی کے لیے

  const undoBtn = document.getElementById('kataUndoBtn');
  if(undoBtn) undoBtn.addEventListener('click', kataUndo);
  if(!window._kataUndoKeyListenerAttached){
    window._kataUndoKeyListenerAttached = true;
    document.addEventListener('keydown', (e)=>{
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && document.getElementById('kataDetailView')){
        e.preventDefault();
        kataUndo();
      }
    });
  }
}

async function kataSaveEntry(prevTotal, prevSaleMahana, prevItemData){
  prevItemData = prevItemData || {};
  const showDiscount = kataShowDiscount();
  const showKraya = kataShowKraya();
  // تاریخ کا خانہ خالی ہو تو ہمیشہ کی طرح "ابھی" کا وقت — بھرا ہو تو وہی
  // تاریخ استعمال ہوتی ہے (دوپہر 12 بجے، تاکہ ٹائم زون کی وجہ سے دن آگے
  // پیچھے نہ ہو) — بند/تالے والے کھاتے میں پرانی تاریخ کی انٹری شامل کرنے
  // کے لیے (2026-09-01، صارف کی درخواست پر)۔
  const dateInputEl = document.getElementById('kataEntryDateInput');
  const customDateStr = dateInputEl && dateInputEl.value ? dateInputEl.value : '';
  const customDate = customDateStr ? new Date(customDateStr + 'T12:00:00') : null;
  const items = {};
  let todayT = 0, todayRate = 0, todayDiscount = 0, todayProfit = 0, todayWeightGrams = 0, todayKrayaSum = 0, todayCommission = 0;
  KATA_ITEMS.forEach(item=>{
    const p = kataFindPack(item.key);
    const isZNet = item.key === 'znet1' || item.key === 'znet2';
    const liveName = item.name;
    // فارم میں جو Weight اصل میں لکھا ہوا نظر آ رہا ہے وہی محفوظ ہو — پہلے
    // یہ دوبارہ سے ریٹ لسٹ/item.weight سے حساب لگاتا تھا جو (in-memory
    // mutation ضائع ہونے کی صورت میں) غلط ہو سکتا تھا (2026-08-23)۔
    const weightInputEl = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="weight"]`);
    const liveWeight = weightInputEl ? weightInputEl.value : (p ? p.tpcs : item.weight);
    // سیلزمین کھاتہ — # کالم کی قدر (اگر صارف نے تبدیل کی ہو) بھی محفوظ
    // ہوتی ہے تاکہ محفوظ شدہ انٹری میں بھی وہی نظر آئے (2026-08-23)۔
    const idxInputEl = kataInstance === 'salesman' ? document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="idx"]`) : null;
    const liveIdx = idxInputEl ? idxInputEl.value : null;
    const rateInputEl = document.querySelector(`[data-kata-rate="${item.key}"]`);
    const liveRate = isZNet ? (Number((rateInputEl && rateInputEl.value) || 0) || 0) : (p ? (Number(p.agencyB) || 0) : item.rate);
    const t = Number(document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="t"]`).value) || 0;
    // صارف کی درخواست (2026-08-26): Weight کے ساتھ ایک بہت چھوٹا سا خانہ —
    // صرف نوٹ کے لیے کہ اس مجموعی تعداد میں کتنا حصہ پرانا (سابقہ) ہے۔ یہ
    // حساب میں کہیں استعمال نہیں ہوتا، صرف محفوظ ہو کر دوبارہ دکھایا جاتا
    // ہے۔ سیلزمین/ربنواز/Agency تینوں میں — باقی سب ویسے کا ویسا ہے۔
    const sabkaNoteInputEl = kataInstance === 'salesman' ? document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="sabkaNote"]`) : null;
    const sabkaNote = sabkaNoteInputEl ? sabkaNoteInputEl.value : '';
    const price = liveRate * t;
    const priftInputEl = document.querySelector(`[data-kata-prift="${item.key}"]`);
    const livePrift = isZNet ? (Number((priftInputEl && priftInputEl.value) || 0) || 0) : item.prift;
    const priftTotal = livePrift * t;
    items[item.key] = {t, price, rate: liveRate, name: liveName, weight: liveWeight, prift: livePrift, priftTotal};
    if(sabkaNote) items[item.key].sabkaNote = sabkaNote;
    if(liveIdx != null) items[item.key].idx = liveIdx;
    // کل وزن — فی پیس Weight (وہی جو ابھی محفوظ ہوا) × ریٹ لسٹ کے Pcs (فی
    // کارٹن تعداد) × T CTN، Z Net Bill کے بغیر (2026-08-23)۔ آئٹم کا اپنا
    // pcsPerCtn بھی محفوظ کر لیتے ہیں تاکہ آئندہ ریٹ لسٹ بدلنے پر بھی یہ
    // پرانی انٹری کا وزن درست (تاریخی) رہے۔
    if(!isZNet){
      const pcsPerCtn = p ? (Number(p.ctn) || 0) : (item.pcsPerCtn || 0);
      items[item.key].pcsPerCtn = pcsPerCtn;
      todayWeightGrams += kataParseWeightGrams(liveWeight) * pcsPerCtn * t;
    }
    todayProfit += priftTotal;
    if(showDiscount){
      const dInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="discount"]`);
      const discount = Number((dInput && dInput.value) || 0) || 0;
      const discountTotal = discount * t;
      items[item.key].discount = discount;
      items[item.key].discountTotal = discountTotal;
      todayDiscount += discountTotal;
      // ہر آئٹم کا اپنا جمع Sabka CTN/Total CTN — اگلی انٹری اسی totalT کو
      // اپنا Sabka CTN بنائے گی (ms کے prevItemData والے انداز جیسے)۔ Z Net
      // Bill اس شمار میں کبھی شامل نہیں ہوتا (2026-08-23 صارف کی درخواست
      // پر) — ہمیشہ 0/0 رہے گا۔
      if(!isZNet){
        const sabkaCtn = (prevItemData[item.key] && prevItemData[item.key].totalT) || 0;
        items[item.key].sabkaCtn = sabkaCtn;
        items[item.key].totalT = sabkaCtn + t;
      } else {
        items[item.key].sabkaCtn = 0;
        items[item.key].totalT = 0;
      }
    }
    // Agency کھاتہ — صارف کی درخواست پر (2026-08-27): ہر آئٹم کی فی کارٹن
    // کرایہ اور ٹوٹل کرایہ محفوظ کریں، اور سب کا مجموعہ todayKrayaSum میں
    // جمع کرتے رہیں (بعد میں "کرایہ" باکس اور Price میں استعمال ہوتا ہے)۔
    if(showKraya){
      const krInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="krayaRate"]`);
      const krayaRate = Number((krInput && krInput.value) || 0) || 0;
      const krayaTotal = krayaRate * t;
      items[item.key].krayaRate = krayaRate;
      items[item.key].krayaTotal = krayaTotal;
      todayKrayaSum += krayaTotal;
      // کمیشن — کرایہ سے بالکل الگ، اپنا مستقل چلنے والا مجموعہ (صارف کی
      // درخواست 2026-08-30): نہ Price میں شامل ہوتا ہے نہ Profit میں، صرف
      // اپنا الگ ٹوٹل بناتا رہتا ہے (نیچے sabka/total/bqaya میں)۔
      const cmInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="commissionRate"]`);
      const commissionRate = Number((cmInput && cmInput.value) || 0) || 0;
      const commissionTotal = commissionRate * t;
      items[item.key].commissionRate = commissionRate;
      items[item.key].commissionTotal = commissionTotal;
      todayCommission += commissionTotal;
    }
    // Z Net Bill کی تعداد CTN کے مجموعے میں شامل نہیں ہوتی (دیکھیں
    // recomputeTotalsBlock کا نوٹ) — باقی سب (Total Rate/Profit/Discount) پر اثر رہتا ہے۔
    if(!isZNet) todayT += t;
    todayRate += price;
  });
  // اس انٹری کے فارم میں جو خانے رنگے گئے تھے (🎨 موڈ سے)، وہ رنگ اب اسی
  // انٹری کے ساتھ ہمیشہ کے لیے محفوظ ہو جاتے ہیں۔
  const cellColors = {};
  document.querySelectorAll('#kataDetailContainer [data-color-key]').forEach(td=>{
    if(td.style.backgroundColor) cellColors[td.dataset.colorKey] = td.style.backgroundColor;
  });
  // Agency کھاتہ — صارف کی درخواست پر (2026-08-27): "کرایہ" اب دستی نہیں،
  // ہر آئٹم کی "ٹوٹل کرایہ" کا مجموعہ (todayKrayaSum) ہی محفوظ ہوتا ہے۔
  const kharch = showKraya ? todayKrayaSum : (Number((document.querySelector('[data-kata-field="kharch"]')||{}).value || 0) || 0);
  // ربنواز کھاتہ — خرچہ اور Less دونوں Price میں شامل ہونے کی بجائے Profit
  // سے منفی ہوتے ہیں (2026-08-22)۔ Agency میں پرانا انداز برقرار ہے۔
  const lessInput = document.querySelector('[data-kata-field="less"]');
  const less = Number((lessInput && lessInput.value) || 0) || 0;
  const isRibnawaz = kataInstance === 'ribnawaz';
  const todayPrice = isRibnawaz ? todayRate : (todayRate + kharch);
  if(isRibnawaz) todayProfit = todayProfit - kharch - less;
  const salesmanInput = document.querySelector('[data-kata-field="salesman"]');
  const salesman = salesmanInput ? salesmanInput.value : '';

  const jVal = (name)=>{ const el = document.querySelector(`[data-jamah="${name}"]`); return el ? kataParseNum(el.value) : 0; };
  const jamah = {t: [jVal('t0'), jVal('t1')], price: [jVal('price0'), jVal('price1')], profit: [jVal('profit0'), jVal('profit1')]};
  if(showDiscount) jamah.discount = [jVal('discount0'), jVal('discount1')];
  const jamahTotal = jamah.price[0] + jamah.price[1];

  if(todayT === 0 && todayPrice === 0 && jamahTotal === 0){
    alert('کم از کم ایک آئٹم میں کوئی مقدار درج کریں، یا Jamah میں کوئی رقم لکھیں۔');
    return;
  }
  // پہلی انٹری میں "سابقہ" خود لکھی گئی ہو تو وہیں سے پڑھیں، ورنہ ہمیشہ کی
  // طرح پچھلی انٹری کی قدر (prevTotal)۔
  const sabkaTInput = document.querySelector('[data-kata-sabka="t"]');
  const sabka = sabkaTInput
    ? {
        t: Number(sabkaTInput.value) || 0,
        price: Number((document.querySelector('[data-kata-sabka="price"]')||{}).value) || 0,
        profit: Number((document.querySelector('[data-kata-sabka="profit"]')||{}).value) || 0,
        discount: Number((document.querySelector('[data-kata-sabka="discount"]')||{}).value) || 0,
      }
    : {t: prevTotal.t||0, price: prevTotal.price||0, profit: prevTotal.profit||0, discount: prevTotal.discount||0};
  if(showKraya) sabka.commission = prevTotal.commission||0;
  const today = {t: todayT, price: todayPrice, profit: todayProfit};
  const total = {t: sabka.t + today.t, price: sabka.price + today.price, profit: (sabka.profit||0) + todayProfit};
  if(showDiscount){
    today.discount = todayDiscount;
    total.discount = (sabka.discount||0) + todayDiscount;
  }
  // کمیشن — Price/Profit سے مکمل الگ، اپنا مستقل چلنے والا مجموعہ (صارف کی
  // درخواست 2026-08-30): Jamah/Bqaya کا تصور اس پر لاگو نہیں ہوتا (کوئی
  // "ادائیگی" ٹریک نہیں ہوتی)، صرف سابقہ+آج = ٹوٹل ہمیشہ آگے چلتا رہتا ہے،
  // مہینہ بند ہونے پر باقی سب کی طرح خودکار اگلے کھاتے میں carry ہو جاتا ہے۔
  if(showKraya){
    today.commission = todayCommission;
    total.commission = (sabka.commission||0) + todayCommission;
  }

  const bqaya = {t: total.t - (jamah.t[0]+jamah.t[1]), price: total.price - (jamah.price[0]+jamah.price[1]), profit: (total.profit||0) - (jamah.profit[0]+jamah.profit[1])};
  if(showDiscount) bqaya.discount = (total.discount||0) - (jamah.discount[0]+jamah.discount[1]);
  if(showKraya) bqaya.commission = total.commission; // کمیشن کبھی جمع/منہا نہیں ہوتا، ہمیشہ ٹوٹل کے برابر آگے چلتا ہے

  const btn = document.getElementById('kataSaveEntryBtn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ محفوظ ہو رہا ہے...'; }

  if(kataLocalMode){
    const entries = kataLocalGetEntries(kataOpenId);
    entries.push({
      id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
      items, sabka, today, total, jamah, bqaya, salesman, kharch, less, cellColors, weightKg: Math.round((todayWeightGrams/1000)*100)/100,
      createdAt: (customDate ? customDate : new Date()).toISOString(),
    });
    kataLocalSaveEntries(kataOpenId, entries);
    kataOpenEntries = entries;
    // بند/تالے والے کھاتے میں (پرانی تاریخ کی) انٹری محفوظ ہونے پر، اسی نام
    // کے کھلے (اگلے مہینے کے) کھاتے کا carryForward بھی اسی تازہ ترین Bqaya
    // کے مطابق خودکار اپڈیٹ کر دیں — تاکہ نئے مہینے کی انٹری میں "سابقہ"
    // ہمیشہ درست/تازہ ترین رقم دکھائے (2026-09-01، صارف کی درخواست پر)۔ صرف
    // اسی وقت اثر کرتا ہے جب نئے کھاتے میں ابھی خود کوئی انٹری نہ ہوئی ہو —
    // اس کے بعد اس کی اپنی پہلی انٹری کا Sabka خود مستقل ہو جاتا ہے۔
    if(kataOpenClosed){
      const newLastEntry = entries[entries.length - 1];
      const newFinalTotal = newLastEntry.bqaya || newLastEntry.total;
      // یہاں بھی CTN/Profit صفر — باقی سب جگہ کی طرح (اوپر kataCheckMonthRolloverLocal کا نوٹ دیکھیں)۔
      const newCarryForward = Object.assign({}, newFinalTotal, {t: 0, profit: 0});
      const siblingBooks = kataLocalGetBooks();
      const sibling = siblingBooks.find(b => !b.closed && b.name.indexOf(kataOpenName + ' - ') === 0);
      if(sibling){
        sibling.carryForward = newCarryForward;
        kataLocalSaveBooks(siblingBooks);
      }
    }
    kataRenderDetail(kataOpenName);
    kataShowSavedToast();
    return;
  }

  try{
    await kataCol().doc(kataOpenId).collection('entries').add({
      items, sabka, today, total, jamah, bqaya, salesman, kharch, less, cellColors, weightKg: Math.round((todayWeightGrams/1000)*100)/100,
      createdAt: customDate ? firebase.firestore.Timestamp.fromDate(customDate) : firebase.firestore.FieldValue.serverTimestamp(),
    });
    kataShowSavedToast();
  } catch(err){
    alert('انٹری محفوظ کرنے میں مسئلہ ہوا — دوبارہ کوشش کریں۔');
    console.warn(err);
    if(btn){ btn.disabled = false; btn.textContent = 'انٹری محفوظ کریں'; }
  }
}

// Small on-screen confirmation that an entry saved — a native alert() would
// force a tap to dismiss every time, this just appears and fades on its own.
function kataShowSavedToast(){
  const old = document.getElementById('kataSavedToast');
  if(old) old.remove();
  const toast = document.createElement('div');
  toast.id = 'kataSavedToast';
  toast.textContent = '✅ انٹری محفوظ ہو گئی';
  toast.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1a7a3c;color:#fff;padding:10px 20px;border-radius:20px;font-weight:400;font-size:14px;z-index:9999;box-shadow:0 2px 10px rgba(0,0,0,.3);';
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.style.transition='opacity .4s'; toast.style.opacity='0'; setTimeout(()=>toast.remove(), 400); }, 2200);
}

// If login is switched off site-wide, کھاتے still works fully — just using
// this device's own local storage instead of the signed-in cloud account.
if(typeof LOGIN_TEMPORARILY_DISABLED !== 'undefined' && LOGIN_TEMPORARILY_DISABLED){
  window.initKataModuleLocal();
}

<script>
// ---------- سائٹ بھر میں خانوں کا خودکار سائز (مواد کے مطابق) ----------
// کھاتہ اور سرف کا ماہانہ حساب میں پہلے سے یہ سہولت تھی (kataAutoSizeInput/
// msAutoSizeInput) — یہ اسے پوری ویب سائٹ پر لاگو کرتا ہے: ریٹ لسٹ، Best
// Excel official، ہر جگہ۔ ایک MutationObserver استعمال کیا ہے تاکہ یہ کسی
// بھی ٹیبل کے دوبارہ بننے (لاک بٹن دبانے وغیرہ) پر بھی خودکار کام کرے،
// ہر ٹیبل بنانے والے فنکشن میں الگ سے کوڈ ڈالنے کی ضرورت نہیں۔
//
// پہلے یہ صرف "ch" اکائی (موجودہ فونٹ کے "0" حرف کی چوڑائی) پر انحصار
// کرتا تھا — لیکن اگر انٹرنیٹ کمزور ہونے کی وجہ سے اصل فونٹ (Courier
// Prime) وقت پر لوڈ نہ ہو تو براؤزر عارضی طور پر ایک مختلف (اکثر چوڑی)
// فونٹ دکھاتا ہے، جس سے خانے حقیقت سے بڑے نظر آتے تھے (یہی وجہ تھی کہ
// لائیو سائٹ پر خانے Claude کے اپنے پیش نظارے سے بڑے نظر آ رہے تھے)۔ اب
// canvas کے ذریعے متن کی اصل، فونٹ سے آزاد پکسل چوڑائی ناپی جاتی ہے —
// نتیجہ ہر ڈیوائس/فونٹ لوڈنگ کی حالت میں یکساں رہتا ہے۔
const _sizeMeasureCanvas = document.createElement('canvas');
const _sizeMeasureCtx = _sizeMeasureCanvas.getContext('2d');
function measureAndSizeInput(input){
  if(!input) return;
  const text = (input.value || input.placeholder || '0').toString();
  const cs = getComputedStyle(input);
  _sizeMeasureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const textWidth = _sizeMeasureCtx.measureText(text).width;
  const paddingH = (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
  const borderH = (parseFloat(cs.borderLeftWidth)||0) + (parseFloat(cs.borderRightWidth)||0);
  input.style.width = Math.max(textWidth + paddingH + borderH + 4, 14) + 'px'; /* خانے کو مواد کے بالکل قریب، تنگ رکھنے کے لیے اضافی جگہ کم کر دی */
}
window.measureAndSizeInput = measureAndSizeInput;
function globalAutoSizeInput(input){
  measureAndSizeInput(input);
}
document.querySelectorAll('.cell-input').forEach(globalAutoSizeInput);
document.addEventListener('input', (e)=>{
  if(e.target && e.target.classList && e.target.classList.contains('cell-input')){
    globalAutoSizeInput(e.target);
  }
});
const globalAutoSizeObserver = new MutationObserver((mutations)=>{
  mutations.forEach(m=>{
    m.addedNodes.forEach(node=>{
      if(node.nodeType !== 1) return;
      if(node.classList && node.classList.contains('cell-input')) globalAutoSizeInput(node);
      if(node.querySelectorAll) node.querySelectorAll('.cell-input').forEach(globalAutoSizeInput);
    });
  });
});
globalAutoSizeObserver.observe(document.body, {childList:true, subtree:true});
</script>
<script>
// ---------- پوری ویب سائٹ میں "↩ واپس کریں" بٹن (Ctrl+Z کا کام) ----------
// کھاتہ ماڈیول میں پہلے سے اپنا الگ undo موجود ہے (اسی طرح کام کرتا رہے
// گا) — یہ اس کے علاوہ باقی ہر جگہ (ریٹ لسٹ، Best Excel official، سرف کا
// ماہانہ حساب) کے لیے ایک مشترکہ، ہمیشہ نظر آنے والا فلوٹنگ بٹن ہے، تاکہ
// موبائل پر Ctrl+Z کی بورڈ شارٹ کٹ کے بغیر بھی آخری تبدیلی واپس کی جا سکے۔
window.siteUndoStack = [];
window._siteUndoRestoring = false;
document.addEventListener('focusin', (e)=>{
  if(e.target && e.target.classList && e.target.classList.contains('cell-input')){
    e.target.dataset.siteUndoPrev = e.target.value;
  }
});
document.addEventListener('change', (e)=>{
  if(window._siteUndoRestoring) return;
  if(e.target && e.target.classList && e.target.classList.contains('cell-input')){
    if(e.target.dataset.siteUndoPrev !== undefined && e.target.dataset.siteUndoPrev !== e.target.value){
      window.siteUndoStack.push({input: e.target, oldValue: e.target.dataset.siteUndoPrev});
      if(window.siteUndoStack.length > 100) window.siteUndoStack.shift();
    }
    e.target.dataset.siteUndoPrev = e.target.value;
  }
});
window.siteUndo = function(){
  let entry = window.siteUndoStack.pop();
  while(entry && !document.body.contains(entry.input)) entry = window.siteUndoStack.pop(); // ہٹائی گئی قطاروں کے پرانے اندراج چھوڑ دیں
  if(!entry) return;
  window._siteUndoRestoring = true;
  entry.input.value = entry.oldValue;
  entry.input.dataset.siteUndoPrev = entry.oldValue;
  entry.input.dispatchEvent(new Event('input', {bubbles:true}));
  entry.input.dispatchEvent(new Event('change', {bubbles:true}));
  window._siteUndoRestoring = false;
};
document.getElementById('siteUndoFab').addEventListener('click', ()=>{
  // اگر کھاتہ یا سرف کے ماہانہ حساب کا اپنا مخصوص undo کھلا ہوا ہے (اسی
  // سیکشن میں ہیں) تو وہی چلائیں، تاکہ Sale/Jamah جیسے خاص خانے بھی صحیح
  // واپس آئیں — ورنہ سائٹ کا مشترکہ undo استعمال ہو۔
  if(document.getElementById('kataDetailView') && document.getElementById('kataDetailView').style.display !== 'none' && typeof window.kataUndo === 'function'){
    window.kataUndo();
  } else if(document.getElementById('msDetailView') && document.getElementById('msDetailView').style.display !== 'none' && typeof window.msUndo === 'function'){
    window.msUndo();
  } else {
    window.siteUndo();
  }
});
</script>
<script>
// ---------- سائٹ کا سائز خود چھوٹا/بڑا کرنے کا آزمائشی کنٹرول (🔍) ----------
// یہ صرف اسی ڈیوائس/براؤزر پر عارضی طور پر پورا صفحہ بڑا/چھوٹا دکھاتا ہے
// (CSS "zoom" — تمام الفاظ، نمبر، خانے، سب ایک ساتھ متناسب طریقے سے چھوٹے

<script>
// ---------- سائٹ کی قطاریں قریب/دور کرنے کا کنٹرول (📏) ----------

<script>
// ---------- 🔽 فوری صفحہ منتقلی (اوپر بائیں، ہمیشہ نظر آنے والا) ----------
// یہ بٹن کہیں سے بھی (چاہے صفحہ نیچے تک اسکرول ہو) موجودہ 6 صفحوں میں سے
// کسی پر بھی سیدھا لے جاتا ہے — نیچے دی گئی فہرست میں سے کوئی نام دبانے
// پر وہی کام ہوتا ہے جو اوپر والے اصل nav بٹن پر ٹیپ کرنے سے ہوتا ہے
// (btn.click() کے ذریعے) — پاس ورڈ گیٹ، کھاتہ instance بدلنا، سب کچھ
// بالکل ویسے ہی کام کرتا ہے، الگ سے کوئی نیا کوڈ نہیں لکھا۔
(function(){
  const fab = document.getElementById('topJumpFab');
  const menu = document.getElementById('topJumpMenu');
  const navButtons = Array.from(document.querySelectorAll('nav button'));
  navButtons.forEach((btn, idx)=>{
    const item = document.createElement('div');
    item.textContent = btn.textContent;
    item.style.cssText = 'padding:11px 16px;text-align:center;cursor:pointer;font-size:13.5px;color:var(--ink);transition:background .12s;' + (idx < navButtons.length-1 ? 'border-bottom:1px solid var(--line);' : '');
    item.addEventListener('mouseenter', ()=>{ item.style.background = 'var(--paper-dark)'; });
    item.addEventListener('mouseleave', ()=>{ item.style.background = ''; });
    item.addEventListener('click', ()=>{
      btn.click();
      menu.style.display = 'none';
    });
    menu.appendChild(item);
  });
  fab.addEventListener('click', ()=>{
    const isHidden = menu.style.display !== 'block';
    menu.style.display = isHidden ? 'block' : 'none';
    menu.classList.remove('hidden');
  });
  document.addEventListener('click', (e)=>{
    if(!fab.contains(e.target) && !menu.contains(e.target)) menu.style.display = 'none';
  });
})();
</script>
<script>
// ---------- کھاتوں کے خانوں پر مرضی کا رنگ لگانا ----------
// 🎨 دبائیں → رنگ چنیں → کسی بھی کھاتے (سیلزمین/ربنواز/سرف کا ماہانہ حساب)
// کے کسی بھی خانے پر ٹیپ کریں تو وہی رنگ لگ جائے۔ دوبارہ 🎨 دبائیں تو موڈ
// بند ہو جائے۔ یہ صرف اسی نشست کے لیے ہے (صفحہ دوبارہ لوڈ ہونے پر رنگ ری
// سیٹ ہو جاتے ہیں) — بالکل اسی طرح جیسے لاک کی حالتیں بھی ری لوڈ پر ری سیٹ
// ہوتی ہیں، سائٹ کا پہلے سے طے شدہ اصول۔
// (2026-08-22: 🎨 بٹن صارف کی درخواست پر ہٹا دیا گیا — نیا رنگ لگانا اب
// ممکن نہیں، لیکن pehle سے محفوظ شدہ خانوں کے رنگ نیچے موجود
// applyStoredCellColors نظام سے ویسے ہی نظر آتے رہیں گے۔)
let kataColorModeActive = false;
let kataColorModeValue = '#fff59d';

// ---------- ہر خانے کا رنگ مستقل محفوظ (2026-08-15، پہلا نظام کام نہیں کر
// رہا تھا کیونکہ رنگ صرف اسی لمحے کے لیے DOM پر لگتا تھا، کہیں محفوظ نہیں
// ہوتا تھا اور اگلی بار ٹیبل دوبارہ بنتے ہی ختم ہو جاتا تھا) ----------
// اب ہر رنگ کیا گیا خانہ ایک مستقل "پتے" (scope key) کے ساتھ localStorage
// اور کلاؤڈ (وہی firebaseSyncSet جو باقی ڈیٹا کے لیے استعمال ہو رہا ہے)
// دونوں میں محفوظ ہوتا ہے، اور ایک MutationObserver (نیچے) ہر بار جب بھی
// کوئی ٹیبل دوبارہ بنے (لاک بٹن، save، تاب سوئچ وغیرہ) خودکار وہی رنگ
// واپس لگا دیتا ہے — فہرست کے کارڈز، Sale Mahana Record، totals کے
// خانے، سب شامل ہیں، صرف مرکزی ٹیبل نہیں۔
const CELL_COLORS_KEY = 'kataCellColorsMap';
let cellColorsMap = {};
try{ cellColorsMap = JSON.parse(localStorage.getItem(CELL_COLORS_KEY)) || {}; }catch(e){ cellColorsMap = {}; }
let cellColorsSaveTimer = null;
function saveCellColorsSoon(){
  clearTimeout(cellColorsSaveTimer);
  cellColorsSaveTimer = setTimeout(()=>{
    const json = JSON.stringify(cellColorsMap);
    localStorage.setItem(CELL_COLORS_KEY, json);
    (window.firebaseSyncSet || (()=>{}))(CELL_COLORS_KEY, json);
  }, 400);
}

// خانے کی مستقل شناخت: کون سا ماڈیول (کھاتہ سیلزمین/ربنواز یا ماہانہ سرف)،
// فہرست کا کارڈ ہے تو اس کے نام سے، ورنہ موجودہ کھلا کھاتہ + کون سی
// ٹیبل/انٹری/قطار/کالم میں یہ خانہ ہے۔
function cellScopeKey(cell){
  const view = cell.closest('#kataListView, #kataDetailView, #msListView, #msDetailView');
  if(!view) return null;
  const viewId = view.id;
  const isKata = viewId.startsWith('kata');
  if(viewId === 'kataListView' || viewId === 'msListView'){
    const card = cell.closest('.card');
    const label = card ? (card.querySelector('h2') ? card.querySelector('h2').textContent : '') : '';
    return viewId + '::' + (isKata ? kataInstance : '') + '::list::' + label;
  }
  const openId = viewId === 'kataDetailView' ? kataOpenId : msOpenId;
  const table = cell.closest('table');
  const tableIdx = table ? Array.from(view.querySelectorAll('table')).indexOf(table) : 0;
  const row = cell.closest('tr');
  const rowIdx = row ? Array.from(row.parentNode.children).indexOf(row) : 0;
  const cellIdx = row ? Array.from(row.children).indexOf(cell) : Array.from(cell.parentNode.children).indexOf(cell);
  const entryCard = cell.closest('.kata-entry-card, .ms-entry-card');
  const entryTag = entryCard ? Array.from(view.querySelectorAll('.kata-entry-card, .ms-entry-card')).indexOf(entryCard) : 'new';
  return viewId + '::' + (isKata ? kataInstance : '') + '::' + openId + '::' + entryTag + '::' + tableIdx + '::' + rowIdx + '::' + cellIdx;
}

function applyStoredCellColors(root){
  const scope = (root && root.querySelectorAll) ? root : document;
  const cells = scope.querySelectorAll('#kataListView td, #kataListView .card, #kataDetailView td, #kataDetailView .totals > div, #kataDetailView .n, #kataDetailView .l, #msListView td, #msListView .card, #msDetailView td, #msDetailView .totals > div, #msDetailView .n, #msDetailView .l');
  cells.forEach(cell=>{
    const key = cellScopeKey(cell);
    if(key && cellColorsMap[key]) cell.style.backgroundColor = cellColorsMap[key];
  });
}
// صفحہ کھلتے ہی ایک بار، پھر ہر بار جب کھاتہ/ماہانہ سرف کا کوئی حصہ
// دوبارہ بنے (کوئی بھی نیا عنصر شامل ہو) خودکار — الگ سے ہر رینڈر
// فنکشن میں کوڈ ڈالنے کی ضرورت نہیں۔
applyStoredCellColors();
const cellColorObserver = new MutationObserver(()=> applyStoredCellColors());
['kataListView','kataDetailView','msListView','msDetailView'].forEach(id=>{
  const el = document.getElementById(id);
  if(el) cellColorObserver.observe(el, {childList:true, subtree:true});
});

// رنگ موڈ فعال ہو تو کسی بھی کھاتے کے خانے پر ٹیپ کرنے سے وہی رنگ لگ کر
// فوراً محفوظ ہو جائے — نارمل کلک/ان پٹ کا کام نہ رکے۔
document.addEventListener('click', (e)=>{
  if(!kataColorModeActive) return;
  const scope = e.target.closest('#kataListView, #kataDetailView, #msListView, #msDetailView');
  if(!scope) return;
  const cell = e.target.closest('td, .totals > div, .n, .l, .card');
  if(!cell) return;
  const key = cellScopeKey(cell);
  cell.style.backgroundColor = kataColorModeValue;
  if(key){
    cellColorsMap[key] = kataColorModeValue;
    saveCellColorsSoon();
  }
}, true);
</script>
<script>
// ---------- ڈیٹا کلاؤڈ سنک (بغیر لاگ ان) ----------
// مقصد: کسی بھی موبائل/کمپیوٹر سے کھاتہ (سیلزمین + ربنواز) یا سرف کا
// ماہانہ حساب میں کوئی بھی اپڈیٹ کریں تو کسی بھی دوسری ڈیوائس سے یہی ویب
// سائٹ کھولنے پر وہی اپڈیٹ شدہ ڈیٹا نظر آئے — بغیر کسی سائن ان کے۔
//
// طریقہ کار: موجودہ localStorage پر مبنی سسٹم کو بالکل نہیں چھیڑا گیا
// (کھاتہ/ماہانہ سرف کے تمام پرانے فنکشنز ویسے ہی کام کرتے ہیں) — بس ہر
// "save" پر ڈیٹا اسی ڈیوائس کے localStorage کے ساتھ ساتھ Firestore کے
// ایک مشترکہ کلیکشن ("localSync") میں بھی محفوظ ہو جاتا ہے (firebaseSyncSet
// — اوپر kataLocalSaveBooks/kataLocalSaveEntries/msLocalSaveBooks/
// msLocalSaveEntries میں استعمال ہوتا ہے)۔ صفحہ کھلتے وقت پہلے یہ سارا
// ڈیٹا کلاؤڈ سے واپس اسی ڈیوائس کے localStorage میں کاپی ہوتا ہے
// (firebaseSyncPullAll)، پھر کھاتہ/ماہانہ سرف کی فہرست دوبارہ بنائی جاتی
// ہے تاکہ تازہ ڈیٹا نظر آئے۔ اس کے بعد ایک لائیو listener بھی لگا ہے —
// اگر ایپ کھلی ہو اور اسی دوران کسی اور ڈیوائس سے کوئی تبدیلی آئے تو فہرست
// خودکار تازہ ہو جاتی ہے۔
//
// ⚠️ ضروری: یہ اسی وقت کام کرے گا جب Firebase Console میں Firestore کے
// "localSync" کلیکشن پر بغیر لاگ ان کے (public) read/write کی اجازت ہو —
// چونکہ سائٹ پر لاگ ان مستقل بند ہے، اس ڈیٹا کی حفاظت صرف اس بات پر منحصر
// ہے کہ اس ویب سائٹ کا لنک نجی رکھا جائے۔
//
// آف لائن ہونے پر ناکام ہونے والی cloud sync لکھائیوں کی خودکار دوبارہ
// کوشش (2026-08-30، صارف کی اصل رپورٹ پر: نیٹ نہ ہونے کے دوران کمپیوٹر پر
// محفوظ کی گئی انٹری، نیٹ 1-2 گھنٹے بعد واپس آنے کے باوجود موبائل پر کبھی
// نظر نہیں آئی)۔ اصل وجہ: Firestore کی offline persistence جان بوجھ کر
// بند ہے (اوپر نوٹ ملاحظہ کریں)، اور پرانا کوڈ ناکام لکھائی پر صرف ایک بار
// console.warn کر کے ہمیشہ کے لیے بھول جاتا تھا — نیٹ واپس آنے پر بھی
// دوبارہ کوشش نہیں ہوتی تھی۔ اب: ناکام ہونے والی ہر لکھائی (key) ایک
// "زیرالتوا" فہرست میں localStorage میں محفوظ رہتی ہے؛ جیسے ہی براؤزر
// 'online' ایونٹ دے (یا صفحہ دوبارہ نظر آئے)، اس فہرست کی ہر key کی اس وقت
// کی تازہ ترین قدر خودکار دوبارہ Firestore کو بھیجی جاتی ہے، جب تک کامیاب
// نہ ہو۔ ڈیٹا خود ہمیشہ کی طرح localStorage میں فوراً محفوظ رہتا ہے —
// یہ صرف کلاؤڈ کاپی (دوسری ڈیوائسز تک پہنچنے) کی ضمانت بہتر بناتا ہے۔
const FIREBASE_SYNC_PENDING_KEY = 'firebaseSyncPendingKeys';
function firebaseSyncGetPending(){
  try{ return JSON.parse(localStorage.getItem(FIREBASE_SYNC_PENDING_KEY) || '[]'); }
  catch(e){ return []; }
}
function firebaseSyncMarkPending(key){
  try{
    const pending = firebaseSyncGetPending();
    if(!pending.includes(key)){ pending.push(key); localStorage.setItem(FIREBASE_SYNC_PENDING_KEY, JSON.stringify(pending)); }
  } catch(e){ /* نظرانداز */ }
}
function firebaseSyncClearPending(key){
  try{
    const pending = firebaseSyncGetPending().filter(k=> k !== key);
    localStorage.setItem(FIREBASE_SYNC_PENDING_KEY, JSON.stringify(pending));
  } catch(e){ /* نظرانداز */ }
}
function firebaseSyncRetryPending(){
  if(!window.db) return;
  const pending = firebaseSyncGetPending();
  pending.forEach(key=>{
    const valueStr = localStorage.getItem(key);
    if(valueStr == null){ firebaseSyncClearPending(key); return; } // اب موجود ہی نہیں، فہرست سے ہٹا دیں
    window.db.collection('localSync').doc(key).set({
      value: valueStr,
      updatedAt: (typeof firebase !== 'undefined' && firebase.firestore) ? firebase.firestore.FieldValue.serverTimestamp() : Date.now()
    }).then(()=> firebaseSyncClearPending(key))
      .catch(err=> console.warn('cloud sync retry still failing for', key, err)); // اگلی کوشش تک زیرالتوا ہی رہے گی
  });
}
window.addEventListener('online', firebaseSyncRetryPending);
window.firebaseSyncRetryPending = firebaseSyncRetryPending;
function firebaseSyncSet(key, valueStr){
  localStorage.setItem(key, valueStr);
  if(window.db){
    window.db.collection('localSync').doc(key).set({
      value: valueStr,
      updatedAt: (typeof firebase !== 'undefined' && firebase.firestore) ? firebase.firestore.FieldValue.serverTimestamp() : Date.now()
    }).then(()=> firebaseSyncClearPending(key))
      .catch(err=>{
        console.warn('cloud sync save failed for', key, '— will retry automatically once online', err);
        firebaseSyncMarkPending(key);
      });
  } else {
    firebaseSyncMarkPending(key); // Firestore ابھی جڑا ہی نہیں (مثلاً SDK لوڈ نہیں ہوا) — بعد میں کوشش کے لیے نوٹ کر لیں
  }
  scheduleGmailBackup(); // ہر تبدیلی پر Gmail بیک اپ کا وقت مقرر کریں (2026-08-26)
}
window.firebaseSyncSet = firebaseSyncSet;

// ---------- Gmail بیک اپ (2026-08-26، صارف کی درخواست) ----------
// مقصد: Firebase کے علاوہ، مکمل ڈیٹا کی ایک کاپی صارف کے اپنے Gmail پر بھی
// ای میل کی صورت میں محفوظ ہوتی رہے، تاکہ اگر Firebase میں کبھی کوئی مسئلہ
// ہو تو ڈیٹا Gmail سے واپس مل سکے۔
// طریقہ کار: ایک Google Apps Script ویب ایپ (خود صارف کے Google اکاؤنٹ میں،
// مفت) یہاں سے آنے والا ڈیٹا وصول کر کے اسی صارف کو ای میل کر دیتا ہے —
// ویب سائٹ خود براہِ راست کسی کے Gmail تک نہیں پہنچ سکتی، یہ گوگل کی حد ہے۔
// GMAIL_BACKUP_WEBAPP_URL خالی ہونے تک یہ فیچر مکمل خاموش رہتا ہے (کچھ نہیں
// بھیجا جاتا) — صارف کے Apps Script deploy کر کے URL دینے کے بعد ہی فعال ہو۔
//
// ⚠️ Gmail کی روزانہ ای میل بھیجنے کی حد ہے (عام اکاؤنٹ پر تقریباً 100/دن)،
// اس لیے ہر چھوٹی تبدیلی پر الگ ای میل نہیں بھیجتے — ہر تبدیلی کے بعد ایک
// ٹائمر لگتا ہے، اور مکمل ڈیٹا کی ایک ای میل زیادہ سے زیادہ ہر 60 منٹ میں

; const GMAIL_BACKUP_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzZzbO1uxLrormluDOvUJoVdallZATWELZjN-4ysU99__KYY2gEhyAH0HzqWCVxCqEfrA/exec"; // یہاں پیسٹ کریں URL جو Apps Script Deploy کے بعد ملنے والا ہے
const GMAIL_BACKUP_MIN_INTERVAL_MS = 60 * 60 * 1000; // 60 منٹ
const GMAIL_BACKUP_LAST_SENT_KEY = 'gmailBackupLastSentAt';
let gmailBackupDebounceTimer = null;
function scheduleGmailBackup(){
  if(!GMAIL_BACKUP_WEBAPP_URL) return; // ابھی سیٹ نہیں ہوا — خاموشی سے کچھ نہ کریں
  clearTimeout(gmailBackupDebounceTimer);
  gmailBackupDebounceTimer = setTimeout(()=>{
    sendGmailBackupNow();
  }, 20000); // ایک ہی وقت کی کئی تبدیلیوں کو ایک ساتھ جمع کرنے کے لیے 20 سیکنڈ انتظار — اب ہر بار میل جاتی ہے، 60 منٹ کی پابندی ہٹا دی گئی
}
function sendGmailBackupNow(){
  if(!GMAIL_BACKUP_WEBAPP_URL) return;
  try{
    const allData = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      allData[k] = localStorage.getItem(k);
    }
    fetch(GMAIL_BACKUP_WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script ویب ایپ سے جواب پڑھنے کی ضرورت نہیں، صرف بھیجنا مقصود ہے
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ sentAt: new Date().toString(), data: allData })
    }).catch(err=> console.warn('gmail backup send failed', err));
    localStorage.setItem(GMAIL_BACKUP_LAST_SENT_KEY, String(Date.now()));
  }catch(err){ console.warn('gmail backup error', err); }
}
window.sendGmailBackupNow = sendGmailBackupNow; // ضرورت پڑنے پر فوری/دستی بیک اپ کے لیے کنسول یا بٹن سے بلایا جا سکتا ہے

// ---------- کھاتوں کی فہرست کا خاص، محفوظ طریقہ (2026-08-16 بگ فکس) ----------
// اصل مسئلہ: اگر دو ڈیوائسز ایک دوسرے سے ابھی تک نہ ملی ہوں اور دونوں پر
// الگ الگ نیا کھاتہ بنایا جائے، تو عام firebaseSyncSet سیدھا پوری فہرست
// (books array) کو overwrite کر دیتا تھا — یعنی جو ڈیوائس آخر میں محفوظ
// کرے وہ دوسری ڈیوائس کا کھاتہ کلاؤڈ سے (اور اگلی بار پل ہونے پر خود اس
// ڈیوائس سے بھی) مکمل غائب کر دیتی تھی۔ اب کھاتوں کی فہرست ہمیشہ پہلے
// کلاؤڈ سے تازہ ترین لسٹ منگوا کر، اپنے اور کلاؤڈ دونوں کے کھاتے (id کے
// مطابق) ملا (merge) کر، تب محفوظ ہوتی ہے — کوئی کھاتہ کبھی غائب نہیں
// ہوتا، دونوں طرف کے نئے کھاتے ہمیشہ محفوظ رہتے ہیں۔
//
// اہم: یہ merge صرف نئے کھاتے شامل کرتا ہے، کبھی کوئی کھاتہ خودکار نہیں
// ہٹاتا — ورنہ ڈیلیٹ کیا ہوا کھاتہ دوسری ڈیوائس کے اگلے save پر واپس آ
// جاتا۔ اس لیے حذف ("🗑 یہ کھاتہ حذف کریں") الگ سے ایک "tombstone" فہرست
// (`<key>_deletedIds`) میں اس کھاتے کی id لکھتا ہے — یہ merge میں ہمیشہ
// چیک ہوتی ہے، تاکہ حذف شدہ کھاتہ کبھی دوبارہ نمودار نہ ہو، چاہے دوسری
// ڈیوائس نے ابھی حذف ہونے کی خبر نہ دیکھی ہو۔
async function firebaseSyncFetchTombstones(key){
  if(!window.db) return [];
  try{
    const tDoc = await window.db.collection('localSync').doc(key + '_deletedIds').get();
    if(tDoc.exists){
      const data = tDoc.data();
      if(data && typeof data.value === 'string'){ try{ return JSON.parse(data.value) || []; }catch(e){ return []; } }
    }
  } catch(err){ console.warn('cloud sync tombstone fetch failed for', key, err); }
  return [];
}

async function firebaseSyncMergeBooksSet(key, localArr, onMerged){
  localStorage.setItem(key, JSON.stringify(localArr)); // فوری مقامی نظر آنا — انتظار کی ضرورت نہیں
  if(!window.db) return;
  try{
    const doc = await window.db.collection('localSync').doc(key).get();
    let cloudArr = [];
    if(doc.exists){
      const data = doc.data();
      if(data && typeof data.value === 'string'){
        try{ cloudArr = JSON.parse(data.value) || []; }catch(e){ cloudArr = []; }
      }
    }
    const tomb = await firebaseSyncFetchTombstones(key);
    const byId = {};
    cloudArr.forEach(b=>{ if(b && b.id && !tomb.includes(b.id)) byId[b.id] = b; });
    localArr.forEach(b=>{ if(b && b.id && !tomb.includes(b.id)) byId[b.id] = b; }); // تنازعے کی صورت میں یہی ڈیوائس کا ورژن رکھا جاتا ہے، باقی سب شامل رہتے ہیں (حذف شدہ کے سوا)
    const merged = Object.values(byId);
    const json = JSON.stringify(merged);
    localStorage.setItem(key, json);
    await window.db.collection('localSync').doc(key).set({
      value: json,
      updatedAt: (typeof firebase !== 'undefined' && firebase.firestore) ? firebase.firestore.FieldValue.serverTimestamp() : Date.now()
    });
    if(merged.length !== localArr.length && typeof onMerged === 'function') onMerged(); // دوسری ڈیوائس کا کوئی کھاتہ بھی ملا تو فہرست فوراً دوبارہ دکھا دیں
  } catch(err){ console.warn('cloud sync merge-save failed for', key, err); }
}
window.firebaseSyncMergeBooksSet = firebaseSyncMergeBooksSet;

// کھاتہ حذف کرنا — tombstone میں id لکھ کر، پھر فہرست سے نکال کر محفوظ
// کرتا ہے۔ یہ ہمیشہ باقی سب merge logic سے پہلے چلتا ہے تاکہ حذف شدہ
// کھاتہ کبھی merge کے ذریعے واپس نہ آئے۔
async function firebaseSyncDeleteBook(key, bookId, remainingArr, onDone){
  localStorage.setItem(key, JSON.stringify(remainingArr));
  if(!window.db){ if(onDone) onDone(); return; }
  try{
    const tKey = key + '_deletedIds';
    let localTomb = await firebaseSyncFetchTombstones(key);
    if(!localTomb.includes(bookId)) localTomb.push(bookId);
    localStorage.setItem(tKey, JSON.stringify(localTomb));
    await window.db.collection('localSync').doc(tKey).set({
      value: JSON.stringify(localTomb),
      updatedAt: (typeof firebase !== 'undefined' && firebase.firestore) ? firebase.firestore.FieldValue.serverTimestamp() : Date.now()
    });
    // اب باقی ماندہ فہرست بھی اسی tombstone کو مدنظر رکھتے ہوئے merge-save کریں
    await firebaseSyncMergeBooksSet(key, remainingArr.filter(b=> !localTomb.includes(b.id)));
  } catch(err){ console.warn('cloud sync delete failed for', key, bookId, err); }
  if(onDone) onDone();
}
window.firebaseSyncDeleteBook = firebaseSyncDeleteBook;

async function firebaseSyncPullAll(){
  if(!window.db) return;
  try{
    const snap = await window.db.collection('localSync').get();
    snap.forEach(docSnap=>{
      const data = docSnap.data();
      if(data && typeof data.value === 'string') localStorage.setItem(docSnap.id, data.value);
    });
  } catch(err){ console.warn('cloud sync pull failed — staying with this device\'s existing data', err); }
}

function firebaseSyncListenLive(){
  if(!window.db) return;
  if(window._kataListenUnsub){ try{ window._kataListenUnsub(); }catch(e){} }
  window._kataListenUnsub = window.db.collection('localSync').onSnapshot(snap=>{
    let changedAny = false;
    let siteDataCloudJson = null; // SITE_DATA_KEY کی خام (raw) کلاؤڈ ویلیو — merge کے لیے چاہیے
    snap.docChanges().forEach(change=>{
      if(change.type === 'removed') return; // manual deletes only ever come from OUR OWN app code (see کھاتہ/ms delete buttons) — a remote doc disappearing here is never treated as "clear this device's copy", so nothing is ever wiped just because a listener fired
      const data = change.doc.data();
      if(data && typeof data.value === 'string'){
        if(change.doc.id === SITE_DATA_KEY){
          siteDataCloudJson = data.value; // ابھی localStorage میں نہیں لکھتے — نیچے merge کے بعد لکھیں گے
        } else {
          localStorage.setItem(change.doc.id, data.value);
        }
        changedAny = true;
      }
    });
    if(changedAny) firebaseSyncRefreshVisibleViews();
    // ریٹ لسٹ/Best Excel official: پہلے یہاں براہِ راست restoreSiteData()
    // کلاؤڈ کی خام قدر سے پوری packs array overwrite کر دیتا تھا — کوئی
    // merge نہیں، baseline کا کوئی خیال نہیں۔ اسی وجہ سے ابھی ابھی دستی
    // طور پر بدلا گیا Agency ریٹ (یا کوئی بھی خانہ) کبھی کبھار اس اپڈیٹ کی
    // وجہ سے واپس پرانی قدر پر ری سیٹ ہو جاتا تھا (اپنی ہی save کی echo، یا
    // بیچ میں کسی اور فیلڈ کی تبدیلی سے) — چاہے وہ خانہ اس وقت فوکس میں نہ
    // ہو۔ اب saveSiteDataNow() جیسا ہی 3-way baseline-merge یہاں بھی
    // استعمال ہوتا ہے، تاکہ صرف واقعی نہ بدلے ہوئے خانے ہی کلاؤڈ کی نئی
    // قدر لیں — جو خانہ اسی ڈیوائس پر ابھی حال ہی میں بدلا (چاہے اس کا اپنا
    // save ابھی cloud تک نہ پہنچا ہو) وہ ہمیشہ محفوظ رہتا ہے۔
    if(siteDataCloudJson && typeof applySiteDataSnapshot === 'function'){
      const active = document.activeElement;
      const typingHere = active && active.closest && active.closest('#tierListsContainer, #combinedTableContainer, #ledgerContainer');
      if(!typingHere){
        try{
          const cloudSnapshot = JSON.parse(siteDataCloudJson);
          const localSnapshot = buildSiteDataSnapshot();
          const merged = siteDataBaseline ? mergeByBaseline(localSnapshot, cloudSnapshot, siteDataBaseline) : cloudSnapshot;
          applySiteDataSnapshot(merged);
          siteDataBaseline = JSON.parse(JSON.stringify(merged));
          const mergedJson = JSON.stringify(merged);
          localStorage.setItem(SITE_DATA_KEY, mergedJson);
        } catch(err){
          console.warn('site data live-merge failed, storing raw cloud value', err);
          localStorage.setItem(SITE_DATA_KEY, siteDataCloudJson);
        }
      }
      // اگر صارف اسی وقت وہاں ٹائپ کر رہا ہے تو localStorage بھی جان بوجھ
      // کر نہیں چھیڑتے — جیسے ہی وہ رکے گا، اس کا اپنا scheduleSiteDataSave
      // اپنی ہی تازہ ترین قدر (اور تازہ باسلائن سے صحیح merge) کے ساتھ
      // خودکار محفوظ کر دے گا۔
    }
  }, err=>{
    // کبھی کبھار (خاص طور پر کمپیوٹر پر لمبے عرصے تک کھلا ٹیب) یہ realtime
    // کنکشن نیٹ ورک کی معمولی رکاوٹ سے خاموشی سے مر جاتا تھا اور خودکار
    // دوبارہ کبھی نہیں جڑتا تھا — یہی وہ اصل وجہ تھی کہ "موبائل پر فوراً
    // اپڈیٹ ہوتا ہے، کمپیوٹر پر نہیں" کی شکایت باقی رہتی تھی۔ اب یہاں غلطی
    // آنے پر خود ہی چند سیکنڈ بعد نیا کنکشن دوبارہ بنا لیا جاتا ہے — ہمیشہ
    // کے لیے، صارف کو کچھ کرنے کی ضرورت نہیں۔
    console.warn('cloud sync listener error — reconnecting', err);
    setTimeout(firebaseSyncListenLive, 4000);
  });
}

const KATA_AUTO_REFRESH_MIN_HIDDEN_MS = 60000; // 1 منٹ
let kataHiddenAtTs = null;
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden'){
    kataHiddenAtTs = Date.now();
    return;
  }
  if(document.visibilityState !== 'visible') return;
  if(typeof window.firebaseSyncRetryPending === 'function') window.firebaseSyncRetryPending();
  const wasHiddenLongEnough = kataHiddenAtTs != null && (Date.now() - kataHiddenAtTs) >= KATA_AUTO_REFRESH_MIN_HIDDEN_MS;
  kataHiddenAtTs = null;
  if(!wasHiddenLongEnough) return; // ایک منٹ سے کم — کچھ مت کریں، جوں کا توں رہنے دیں
  if(window.db && typeof window.silentRefreshAll === 'function'){
    window.silentRefreshAll().catch(err=> console.warn('visibility refresh failed', err));
  }
});

        window.firebaseSyncMergeBooksSet('kataLocalBooks_agency', JSON.parse(localStorage.getItem('kataLocalBooks_agency')||'[]'), ()=>{ if(typeof kataLocalRenderList==='function' && document.getElementById('kataListView').style.display !== 'none') kataLocalRenderList(); });
        window.firebaseSyncMergeBooksSet('msLocalBooks', JSON.parse(localStorage.getItem('msLocalBooks')||'[]'), ()=>{ if(typeof msRenderList==='function' && document.getElementById('msListView').style.display !== 'none') msRenderList(); });
      }
    } catch(err){ console.warn('one-time books reconcile failed', err); }
  }, 1500); // firestore rules/connection کو مکمل تیار ہونے کا تھوڑا وقت دیتے ہیں
}
firebaseSyncInit();
</script>
<script>
// ---------- دستی ری فریش بٹن (🔄) — 2026-08-16 ----------
// عام طور پر ڈیٹا خودکار سنک ہوتا رہتا ہے، لیکن اگر صارف یقین کرنا چاہے
// کہ ابھی اسی لمحے دوسری ڈیوائسز کا تازہ ترین ڈیٹا آ گیا ہے، تو یہ بٹن
// 0% سے 100% تک ترقی دکھاتا ہوا کلاؤڈ سے سب کچھ دوبارہ منگواتا ہے —
// کھاتہ/ماہانہ سرف کی فہرستیں، ریٹ لسٹ/Best Excel official کا ڈیٹا،
// ریٹس، اور خانوں کے رنگ سب دوبارہ تازہ ہو جاتے ہیں۔ مکمل ہونے پر سبز ✅
// اور "100% اپڈیٹ" کا پیغام چند سیکنڈ کے لیے نظر آتا ہے۔
// یہ اصل "سب کچھ دوبارہ منگوانے" کا کام ہے — 🔄 بٹن اور خودکار بحالی
// (نیچے) دونوں اسی ایک فنکشن کو استعمال کرتے ہیں، تاکہ ہر جگہ ایک جیسا
// اور مکمل تازہ ڈیٹا ملے۔
async function silentRefreshAll(){
  if(window.db){
    await firebaseSyncPullAll();
  }
  if(typeof window.initKataModuleLocal === 'function') window.initKataModuleLocal();
  if(typeof window.restoreSiteData === 'function') window.restoreSiteData();
  if(typeof window.msReloadRatesFromStorage === 'function') window.msReloadRatesFromStorage();
  if(typeof msRenderList === 'function' && document.getElementById('msListView').style.display !== 'none') msRenderList();
  if(typeof applyStoredCellColors === 'function') applyStoredCellColors();
  if(typeof syncKataItemsFromRateList === 'function') syncKataItemsFromRateList();
}
window.silentRefreshAll = silentRefreshAll;

async function manualRefreshAll(){
  const btn = document.getElementById('manualRefreshFab');
  const box = document.getElementById('manualRefreshBox');
  const pctEl = document.getElementById('manualRefreshPercent');
  const labelEl = document.getElementById('manualRefreshLabel');
  if(btn.dataset.busy === '1') return; // دوبارہ دبانے پر دو بار نہ چلے
  btn.dataset.busy = '1';
  btn.classList.add('spinning'); // بٹن خود گھومنا شروع
  box.classList.remove('hidden');
  box.style.display = 'block';
  pctEl.style.color = '#1e5f4a';
  labelEl.textContent = 'اپڈیٹ ہو رہا ہے...';

  let pct = 0;
  pctEl.textContent = '0%';
  // اصل کلاؤڈ ڈیٹا آنے تک آہستہ آہستہ 90% تک دکھاتے ہیں (تاکہ صارف کو
  // پیش رفت نظر آئے)، باقی 10% اصل کام مکمل ہونے پر ایک ساتھ۔
  const ticker = setInterval(()=>{
    if(pct < 90){ pct += Math.max(1, Math.round((90 - pct) / 12)); pctEl.textContent = Math.min(pct,90) + '%'; }
  }, 90);

  try{
    await silentRefreshAll();
  } catch(err){
    console.warn('manual refresh failed', err);
  }

  clearInterval(ticker);
  btn.classList.remove('spinning'); // گھومنا رک جائے — اپڈیٹ مکمل
  pctEl.textContent = '✅ 100%';
  pctEl.style.color = '#1a8a4a';
  labelEl.textContent = 'اب مکمل 100% اپڈیٹ ہے';
  btn.dataset.busy = '0';
  setTimeout(()=>{
    box.style.display = 'none';
  }, 2500);
}
document.getElementById('manualRefreshFab').addEventListener('click', manualRefreshAll);
</script>
<script>
// ---------- تیر کے بٹنوں سے خانوں کے درمیان سفر (پوری ویب سائٹ) ----------
// نیچے/اوپر تیر: اسی کالم میں نیچے/اوپر والے خانے پر — جو خانہ لاک ہے
// (لکھا نہیں جا سکتا) اسے چھوڑ کر جتنے بھی ایسے خانے ہوں انہیں پھلانگ کر
// اگلے قابلِ تحریر خانے تک۔ دائیں/بائیں تیر: اسی قطار میں دائیں/بائیں
// طرف اسی طرح — بند خانے چھوڑ کر اگلے کھلے خانے تک۔ ٹیبل کے اندر دائیں/
// بائیں پہلے متن کے شروع/آخر پر پہنچنے کے بعد ہی اگلے خانے پر جاتا ہے
// (تاکہ ایک ہی خانے میں لکھے ہوئے متن کے اندر cursor بھی معمول کے مطابق
// حرکت کر سکے)۔ سائٹ کے ہر ٹیبل (ریٹ لسٹ، Best Excel official، کھاتہ،
// سرف کا ماہانہ حساب) میں کام کرتا ہے کیونکہ سب ایک ہی `.cell-input`
// کلاس استعمال کرتے ہیں۔
function cellNavIsUsable(input){
  return !!(input && input.classList && input.classList.contains('cell-input') && !input.disabled);
}
document.addEventListener('keydown', function(e){
  if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const el = e.target;
  if(!el || !el.classList || !el.classList.contains('cell-input') || el.tagName !== 'INPUT') return;

  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    const atStart = el.selectionStart === 0 && el.selectionEnd === 0;
    const atEnd = el.selectionStart === (el.value || '').length && el.selectionEnd === (el.value || '').length;
    const forward = e.key === 'ArrowRight';
    if(forward && !atEnd) return;   // متن کے اندر ہی cursor حرکت کرنے دیں
    if(!forward && !atStart) return;

    const row = el.closest('tr');
    let target = null;
    if(row){
      const cells = Array.from(row.children);
      let idx = cells.indexOf(el.closest('td, th'));
      if(idx !== -1){
        while(true){
          idx += forward ? 1 : -1;
          if(idx < 0 || idx >= cells.length) break;
          const input = cells[idx].querySelector('.cell-input');
          if(cellNavIsUsable(input)){ target = input; break; }
        }
      }
    } else {
      // ٹیبل کے باہر (مثلاً Less/خرچ کے خانے) — اسی کارڈ کے اندر موجود
      // ترتیب کے مطابق اگلا/پچھلا خانہ ڈھونڈیں۔
      const scope = el.closest('.card') || document;
      const all = Array.from(scope.querySelectorAll('.cell-input'));
      let idx = all.indexOf(el);
      if(idx !== -1){
        while(true){
          idx += forward ? 1 : -1;
          if(idx < 0 || idx >= all.length) break;
          if(cellNavIsUsable(all[idx])){ target = all[idx]; break; }
        }
      }
    }
    if(target){ e.preventDefault(); target.focus(); if(target.select) target.select(); }
    return;
  }

  // ArrowDown / ArrowUp — اسی ٹیبل کے اسی کالم میں
  const table = el.closest('table');
  const row = el.closest('tr');
  if(!table || !row) return;
  const td = el.closest('td, th');
  const colIdx = Array.from(row.children).indexOf(td);
  const rows = Array.from(table.querySelectorAll('tr'));
  let rIdx = rows.indexOf(row);
  const down = e.key === 'ArrowDown';
  let target = null;
  let r = rIdx;
  while(true){
    r += down ? 1 : -1;
    if(r < 0 || r >= rows.length) break;
    const cell = rows[r].children[colIdx];
    if(!cell) continue;
    const input = cell.querySelector('.cell-input');
    if(cellNavIsUsable(input)){ target = input; break; }
  }
  if(target){ e.preventDefault(); target.focus(); if(target.select) target.select(); }
}, true);
</script>
