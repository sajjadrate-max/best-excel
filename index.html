<script>
// Firebase کی SDK اپنے اندرونی نیٹ ورک کنکشن (realtime listener) میں کبھی
// کبھار عارضی transport/deprecation پیغامات کنسول میں خود چھاپ دیتی ہے —
// کبھی console.warn سے، کبھی console.error سے (جیسے "Could not reach
// Cloud Firestore backend" — یہ بھی نیٹ ورک کے عارضی مسئلے کا نوٹس ہے،
// Firebase خودکار دوبارہ کوشش کرتا رہتا ہے، ڈیٹا کہیں ضائع نہیں ہوتا)۔
// یہ سائٹ کے کام کرنے پر کوئی اثر نہیں ڈالتے مگر صارف کو غیر ضروری طور
// پر پریشان کرتے ہیں۔ اس لیے دونوں (warn اور error) میں سے صرف
// @firebase/firestore سے آنے والے پیغامات چھپا دیے گئے ہیں — باقی کوئی
// بھی warning یا error (سائٹ کے اپنے کوڈ کی طرف سے) پہلے کی طرح نظر آتا
// رہے گا۔
(function(){
  const originalWarn = console.warn.bind(console);
  const originalError = console.error.bind(console);
  function isFirebaseNoise(args){
    for(const a of args){
      let text = '';
      if(typeof a === 'string') text = a;
      else if(a && typeof a === 'object') text = (a.message || '') + ' ' + (a.code || '');
      if(text.indexOf('@firebase') !== -1 || text.indexOf('firestore') !== -1 || text.indexOf('Firestore') !== -1) return true;
      // آف لائن ہونے کی صورت میں "client is offline"/"unavailable" پیغامات —
      // یہ بھی نیٹ ورک کے عارضی مسئلے کا نوٹس ہیں (ڈیٹا پہلے ہی localStorage
      // میں محفوظ ہو چکا ہوتا ہے)، اس لیے یہ بھی چھپا دیے گئے ہیں۔
      if(text.indexOf('offline') !== -1 || text.indexOf('unavailable') !== -1) return true;
    }
    return false;
  }
  console.warn = function(...args){
    if(isFirebaseNoise(args)) return;
    originalWarn(...args);
  };
  console.error = function(...args){
    if(isFirebaseNoise(args)) return;
    originalError(...args);
  };
})();
</script>
<script>
// Loads each SDK by trying several CDN mirrors in turn — some networks
// block one Google/CDN domain but allow another, so a single hard-coded
// source made the whole login system unreliable.
function loadScriptWithFallback(srcList){
  return new Promise((resolve, reject)=>{
    let i = 0;
    function tryNext(){
      if(i >= srcList.length){ reject(new Error('all sources failed: ' + srcList[0])); return; }
      const s = document.createElement('script');
      s.src = srcList[i];
      s.onload = ()=> resolve();
      s.onerror = ()=>{ i++; tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
}
window.loadAuthSDKs = async function(){
  await loadScriptWithFallback([
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
    'https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js',
    'https://unpkg.com/firebase@9.23.0/firebase-app-compat.js'
  ]);
  await loadScriptWithFallback([
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js',
    'https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js',
    'https://unpkg.com/firebase@9.23.0/firebase-auth-compat.js'
  ]);
  await loadScriptWithFallback([
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js',
    'https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-firestore-compat.js',
    'https://unpkg.com/firebase@9.23.0/firebase-firestore-compat.js'
  ]);
  await loadScriptWithFallback([
    'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js',
    'https://unpkg.com/@emailjs/browser@3/dist/email.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/emailjs-com/3.2.0/email.min.js'
  ]);
};
</script>

<script>
// ---------- انٹرنیٹ نہ ہونے پر پوری سائٹ روک دینا (2026-08-24) ----------
// پہلے بغیر انٹرنیٹ کے صفحہ خالی نظر آتا تھا (کلاؤڈ ڈیٹا کبھی نہ آنے کی
// وجہ سے) جس سے صارف کو لگتا تھا ڈیٹا ضائع ہو گیا — اب واضح پیغام کے ساتھ
// پوری سائٹ ہی روک دی جاتی ہے، جب تک انٹرنیٹ واپس نہ آئے۔
// (2026-08-24: پہلے یہاں navigator.onLine کے ساتھ ایک حقیقی fetch() سے بھی
// تصدیق کی جاتی تھی — لیکن اگر صفحہ ڈاؤن لوڈ شدہ فائل سے content://...
// کے ذریعے کھولا جائے (جیسے صارف اکثر کرتا ہے) تو وہ fetch ہمیشہ ناکام ہو
// جاتا ہے چاہے انٹرنیٹ موجود ہو، جس سے یہ پیغام غلطی سے ہمیشہ نظر آتا
// رہتا۔ اب صرف navigator.onLine — سادہ اور ہر جگہ قابلِ بھروسہ۔)
(function(){
  const block = document.getElementById('siteOfflineBlock');
  const retryBtn = document.getElementById('siteOfflineRetryBtn');
  function checkAndUpdate(){
    block.style.display = navigator.onLine ? 'none' : 'flex';
  }
  window.addEventListener('online', checkAndUpdate);
  window.addEventListener('offline', checkAndUpdate);
  if(retryBtn) retryBtn.addEventListener('click', checkAndUpdate);
  checkAndUpdate();
})();
</script>

    </div>
  </div>

<script>
// ---------- window.prompt() کا محفوظ متبادل (2026-08-16) ----------
// window.prompt() انسٹالڈ PWA (Add to Home Screen) میں خاموشی سے دب جاتا
// ہے — بٹن دبانے پر کچھ نظر نہیں آتا، جیسا کہ formulation والے پاس ورڈ
// گیٹ کے لیے پہلے ہی نوٹ کیا جا چکا ہے۔ "+ نیا کھاتہ" بھی یہی prompt()
// استعمال کر رہا تھا — اسی وجہ سے موبائل پر بعض اوقات نیا کھاتہ نظر ہی
// نہیں آتا تھا (خاموشی سے فیل ہو جاتا)۔ اب سب جگہ یہی in-page modal
// استعمال ہوتا ہے، ہر context میں یکساں کام کرتا ہے۔
function siteTextPrompt(label, callback){
  const modal = document.getElementById('siteTextPromptModal');
  const input = document.getElementById('siteTextPromptInput');
  document.getElementById('siteTextPromptLabel').textContent = label;
  input.value = '';
  modal.style.display = 'flex';
  modal.classList.remove('hidden');
  setTimeout(()=> input.focus(), 50);
  function done(value){
    modal.style.display = 'none';
    modal.classList.add('hidden');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.removeEventListener('click', onCancel);
    input.removeEventListener('keydown', onKey);
    callback(value);
  }
  const okBtn = document.getElementById('siteTextPromptOk');
  const cancelBtn = document.getElementById('siteTextPromptCancel');
  function onOk(){ done(input.value); }
  function onCancel(){ done(null); }
  function onKey(e){ if(e.key === 'Enter') onOk(); if(e.key === 'Escape') onCancel(); }
  okBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', onCancel);
  input.addEventListener('keydown', onKey);
}
</script>

// صفحہ کھلتے ہی سب سے پہلے یہ سیاہ پردہ نظر آتا ہے (باقی سائٹ کے کسی بھی

// کوڈ کے بغیر آگے نہیں بڑھا جا سکتا۔ بالکل "Best Excel official" ٹیب کے
// پاس ورڈ گیٹ جیسا طریقہ (وہی in-page modal پیٹرن، window.prompt() نہیں —
// یہ انسٹالڈ PWA میں خاموشی سے دب جاتا ہے)، لیکن یہ پورے صفحے کے لیے ہے
// اور ہر بار (session بھر یاد نہیں رکھتا) کھلتے وقت پوچھتا ہے۔
(function(){
  var gate = document.getElementById('siteAccessGate');
  var input = document.getElementById('siteAccessInput');
  var err = document.getElementById('siteAccessError');
  var btn = document.getElementById('siteAccessSubmit');
  function trySubmit(){
    if(input.value === 'Bhatti'){
      gate.style.display = 'none';
    } else {
      err.textContent = 'غلط کوڈ۔';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', trySubmit);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') trySubmit(); });
  input.focus();
})();
</script>

// ---------- ریٹ لسٹ / Best Excel official کا سارا ڈیٹا محفوظ کرنا ----------
// اوپر کے تمام arrays (packs, packagingRows, costRows, ledgerRows) اور لاک
// کی حالتیں (masterColLocked, colLocked, ledgerColLocked) اب ری لوڈ پر
// خالی نہیں ہوں گی — ہر تبدیلی (تھوڑا سا رکنے کے بعد، debounce) اسی
// firebaseSyncSet کے ذریعے localStorage اور Firestore دونوں میں محفوظ ہو
// جاتی ہے (کھاتہ/ماہانہ سرف پہلے ہی اسی طریقے سے محفوظ ہو رہے تھے)۔ صفحہ
// کھلتے ہی محفوظ شدہ ڈیٹا واپس انہی arrays میں بھر دیا جاتا ہے، پھر
// متعلقہ ٹیبلز خودکار دوبارہ بن جاتی ہیں تاکہ فوراً نظر آئے۔
const SITE_DATA_KEY = 'bestExcelSiteData';

function buildSiteDataSnapshot(){
  return {
    packs: packs.map(p=>({key:p.key, tpcs:p.tpcs, ctn:p.ctn, mrp:p.mrp, company:p.company, name:p.name, agencyB:p.agencyB, agencyBManual:p.agencyBManual, agencyC:p.agencyC, agencyCManual:p.agencyCManual, salman:p.salman, salmanManual:p.salmanManual, diffB:p.diffB, diffC:p.diffC, diffSalman:p.diffSalman, diffDukandar:p.diffDukandar})),
    packagingRows: packagingRows.map(r=>({name:r.name, weight:r.weight, shopperWeight:r.shopperWeight})),
    costRows: costRows.map(r=>({name:r.name, rate:r.rate, remainingSurf:r.remainingSurf, perPieceRate:r.perPieceRate, companyProfit:r.companyProfit, bijli:r.bijli, tax:r.tax, ctnRate:r.ctnRate, shopperAmt:r.shopperAmt})),
    ledgerRows: ledgerRows.map(r=>({dateNo:r.dateNo, detail:r.detail, page:r.page, naam:r.naam})),
    masterColLocked, colLocked, ledgerColLocked, tierAgencyLocked,
    weightLossKg: (document.getElementById('weightLossKgInput') || {}).value || '0',
  };
}

function applySiteDataSnapshot(saved){
  if(!saved) return;
  if(Array.isArray(saved.packs)){
    // پہلے صرف موجودہ INDEX پر Object.assign ہوتا تھا — جو نئے شامل کیے
    // گئے یا حذف کیے گئے پراڈکٹس کو نظرانداز کر دیتا (Excel جیسی رو کی
    // شمولیت/حذف مستقل محفوظ رہنے کے لیے یہ ضروری تھا)۔ اب پوری array
    // محفوظ شدہ ڈیٹا کے مطابق دوبارہ بنتی ہے، key سے موجودہ object کو
    // پہچان کر (تاکہ اسی object کا حوالہ رکھنے والا باقی کوڈ متاثر نہ ہو)۔
    const byKey = {};
    packs.forEach(p=>{ byKey[p.key] = p; });
    packs.length = 0;
    saved.packs.forEach(row=>{
      const existing = row.key && byKey[row.key];
      const p = existing || {diffB:0, diffC:0, diffSalman:0, diffDukandar:0, agencyBManual:false, agencyCManual:false, salmanManual:false};
      Object.assign(p, row);
      packs.push(p);
    });
  }
  if(Array.isArray(saved.packagingRows)) saved.packagingRows.forEach((row,i)=>{ if(packagingRows[i]) Object.assign(packagingRows[i], row); });
  if(Array.isArray(saved.costRows)) saved.costRows.forEach((row,i)=>{ if(costRows[i]) Object.assign(costRows[i], row); });
  if(Array.isArray(saved.ledgerRows)) saved.ledgerRows.forEach((row,i)=>{ if(ledgerRows[i]) Object.assign(ledgerRows[i], row); });
  if(saved.masterColLocked) Object.assign(masterColLocked, saved.masterColLocked);
  if(saved.colLocked) Object.assign(colLocked, saved.colLocked);
  if(saved.ledgerColLocked) Object.assign(ledgerColLocked, saved.ledgerColLocked);
  if(saved.tierAgencyLocked) Object.assign(tierAgencyLocked, saved.tierAgencyLocked);
  packs.forEach(p=>{
    if(!p.agencyBManual) p.agencyB = p.company + p.diffB;
    if(!p.agencyCManual) p.agencyC = p.company + p.diffC;
    if(!p.salmanManual)  p.salman  = p.company + p.diffSalman;
    p.dukandar = p.company + p.diffDukandar;
  });
  if(typeof buildAllTierTables === 'function') buildAllTierTables();
  if(typeof buildCombinedTable === 'function') buildCombinedTable();
  if(typeof buildLedgerTable === 'function') buildLedgerTable();
  if(typeof syncKataItemsFromRateList === 'function') syncKataItemsFromRateList();
  const lossInput = document.getElementById('weightLossKgInput');
  if(lossInput && saved.weightLossKg !== undefined){
    lossInput.value = saved.weightLossKg;
    lossInput.dispatchEvent(new Event('input'));
  }
}

// دو ڈیوائسز کے درمیان صحیح ملاپ: ہر خانے کے لیے، اگر اس ڈیوائس پر وہ
// خانہ آخری سنک کے بعد سے تبدیل نہیں ہوا (یعنی baseline جیسا ہی ہے) تو
// کلاؤڈ کی موجودہ (شاید نئی) قدر لی جاتی ہے؛ اگر اسی ڈیوائس پر تبدیل ہوا
// ہے تو اسی ڈیوائس کی نئی قدر رکھی جاتی ہے۔ اس کے بغیر پہلے پوری فہرست
// ایک ساتھ overwrite ہوتی تھی — جو ڈیوائس آخر میں save کرے وہ دوسری
// ڈیوائس کی حالیہ تبدیلی خاموشی سے مٹا دیتی تھی (اسی وجہ سے "آدھے نمبر"
// والا مسئلہ ہو رہا تھا)۔
function mergeByBaseline(local, cloud, baseline){
  if(Array.isArray(local)){
    return local.map((item, i)=> mergeByBaseline(item, (cloud && cloud[i]) || {}, (baseline && baseline[i]) || {}));
  }
  if(local && typeof local === 'object'){
    const result = {};
    const keys = new Set([...Object.keys(local||{}), ...Object.keys(cloud||{})]);
    keys.forEach(k=>{
      result[k] = mergeByBaseline(local[k], cloud ? cloud[k] : undefined, baseline ? baseline[k] : undefined);
    });
    return result;
  }
  if(cloud === undefined) return local; // کلاؤڈ میں یہ خانہ کبھی محفوظ نہیں ہوا — مقامی قدر ہی درست
  return (local === baseline) ? cloud : local;
}

let siteDataBaseline = null; // آخری بار کلاؤڈ کے ساتھ مکمل ملاپ کے وقت کی حالت

async function saveSiteDataNow(){
  const localSnapshot = buildSiteDataSnapshot();
  if(window.db && siteDataBaseline){
    try{
      const doc = await window.db.collection('localSync').doc(SITE_DATA_KEY).get();
      let cloudSnapshot = null;
      if(doc.exists){
        const data = doc.data();
        if(data && typeof data.value === 'string'){ try{ cloudSnapshot = JSON.parse(data.value); }catch(e){} }
      }
      if(cloudSnapshot){
        const merged = mergeByBaseline(localSnapshot, cloudSnapshot, siteDataBaseline);
        // اگر صارف ابھی اسی حصے میں کچھ ٹائپ کر رہا ہے تو ٹیبل کو دوبارہ نہ
        // بنائیں — ورنہ ہر تھوڑی دیر بعد (سنک کی وجہ سے) خانے سے فوکس ہٹ
        // جاتا اور نمبر ادھورا/کٹا ہوا نظر آتا تھا (اسی وجہ سے یہ بگ ہوا
        // تھا)۔ ڈیٹا پھر بھی درست محفوظ ہو جاتا ہے، بس صفحہ فوراً دوبارہ
        // نہیں بنتا — اگلی بار (ٹائپنگ رکنے پر) خودکار تازہ ہو جائے گا۔
        const active = document.activeElement;
        const typingHere = active && active.closest && active.closest('#tierListsContainer, #combinedTableContainer, #ledgerContainer');
        if(!typingHere) applySiteDataSnapshot(merged);
        siteDataBaseline = JSON.parse(JSON.stringify(merged));
        const json = JSON.stringify(merged);
        localStorage.setItem(SITE_DATA_KEY, json);
        await window.db.collection('localSync').doc(SITE_DATA_KEY).set({
          value: json,
          updatedAt: (typeof firebase !== 'undefined' && firebase.firestore) ? firebase.firestore.FieldValue.serverTimestamp() : Date.now()
        });
        return;
      }
    } catch(err){ console.warn('site data merge-save failed, falling back to plain save', err); }
  }
  // کلاؤڈ ابھی تک نہیں ملا (baseline موجود نہیں، یا نیٹ ورک مسئلہ) — سیدھا
  // محفوظ کریں، اگلی بار جب کلاؤڈ سے پہلی بار ڈیٹا آئے گا تبھی سے ملاپ شروع ہو گا۔
  const json = JSON.stringify(localSnapshot);
  localStorage.setItem(SITE_DATA_KEY, json);
  (window.firebaseSyncSet || (()=>{}))(SITE_DATA_KEY, json);
}
let siteDataSaveTimer = null;
function scheduleSiteDataSave(){
  clearTimeout(siteDataSaveTimer);
  siteDataSaveTimer = setTimeout(saveSiteDataNow, 500);
}
// ہر ٹائپنگ یا لاک بٹن دبانے پر (ریٹ لسٹ + Best Excel official کے پورے
// حصے میں) خودکار محفوظ ہو جائے — ہر ان پٹ/بٹن پر الگ سے کوڈ لگانے کی
// ضرورت نہیں، ایک delegated listener کافی ہے۔
['tierListsContainer','combinedTableContainer','ledgerContainer'].forEach(id=>{
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', scheduleSiteDataSave);
  el.addEventListener('click', (e)=>{ if(e.target.closest('.row-lock-btn')) scheduleSiteDataSave(); });
});

function restoreSiteData(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SITE_DATA_KEY)); }catch(e){ saved = null; }
  if(!saved) return false;
  applySiteDataSnapshot(saved);
  siteDataBaseline = JSON.parse(JSON.stringify(saved)); // اب یہ حالت "آخری معلوم مشترکہ حالت" بن گئی
  return true;
}
window.restoreSiteData = restoreSiteData;

    const headRow = document.createElement('tr');

      // مشترکہ تالے سے کنٹرول ہوتے ہیں، اس لیے ہیڈر خانے صرف لیبل دکھاتے ہیں۔

      // Profit ہمیشہ خودکار حساب سے بنتا ہے (Price CTN منفی Agency) —

// Editable cells: the master card (A) has its own per-column lock state;
// every other card is always read-only.
// ایجنسی ریٹ (B/C/سیلزمین) کا خانہ — makeCell سے الگ اس لیے کہ اسے پوری
// ٹیبل دوبارہ بنائے بغیر صرف اسی قطار کا Profit خانہ تازہ کرنا ہوتا ہے،
// ورنہ ٹائپنگ کے دوران خانہ فوکس کھو دیتا (recalcDependentTiers ہر بار
// پوری ٹیبل دوبارہ بناتا ہے)۔
function makeManualAgencyCell(p, tier){
  const manualKey = tier.key + 'Manual';
  const td = document.createElement('td');
  td.className = 'edit-cell';
  const locked = !!tierAgencyLocked[tier.key];
  // لاک ہونے پر عام <span class="cell-val"> — بالکل Profit کالم جیسا فکس
  // (اوپر Profit کا نوٹ دیکھیں): disabled <input> کی value کبھی کبھار
  // html2canvas (پرنٹ/شیئر تصویر) میں صحیح جگہ/سیدھ میں نہیں کھینچتی تھی،
  // جس سے نمبر اوپر نیچے/غلط جگہ نظر آتا تھا۔ صرف اسی وقت اصل <input>
  // بنایا جاتا ہے جب کالم واقعی کھلا (قابلِ ترمیم) ہو۔
  if(locked){
    const span = document.createElement('span');
    span.className = 'cell-val';
    span.textContent = p[tier.key];
    td.appendChild(span);
    return td;
  }
  const input = document.createElement('input');
  input.type = 'number';
  input.step = 'any';
  input.value = p[tier.key];
  input.className = 'cell-input';
  input.addEventListener('input', ()=>{
    p[tier.key] = Math.round((parseFloat(input.value) || 0) * 100) / 100;
    p[manualKey] = true;
    const row = td.parentElement;
    const profitCell = row && row.querySelector('[data-profit-cell] .cell-val');
    if(profitCell){
      const mrpNum = Number(p.mrp) || 0;
      profitCell.textContent = Math.round((mrpNum - p[tier.key]) * 100) / 100;
    }
    if(typeof scheduleSiteDataSave === 'function') scheduleSiteDataSave();
    // کھاتہ کے Items/Weight/Price ہمیشہ B کارڈ کے Agency ریٹ سے آتے ہیں —
    // پہلے یہ صرف اسی وقت تازہ ہوتے تھے جب List A بدلے (recalcDependentTiers
    // کے ذریعے)؛ اگر B کا Agency خانہ براہِ راست دستی لکھا جائے (یہاں) تو
    // بھی فوراً تازہ ہونا چاہیے۔
    if(tier.key === 'agencyB' && typeof syncKataItemsFromRateList === 'function') syncKataItemsFromRateList();
  });
  td.appendChild(input);
  return td;
}

// ---------- Excel کی طرح خود نیا پراڈکٹ شامل/حذف کرنا (2026-08-20، صارف
// کی درخواست) ----------
// نیا پراڈکٹ صرف "کمپنی ریٹ لسٹ A" (packs) میں شامل ہوتا ہے — باقی سب
// لسٹیں (B/C/Salesman/دکاندار) اسی سے خودکار بن جاتی ہیں (diffB=0 وغیرہ
// سے شروع، یعنی ابتدا میں سب Agency ریٹ کمپنی ریٹ جتنے ہی ہوں گے — بعد
// میں چاہیں تو ان کالمز کا اپنا لاک کھول کر دستی تبدیل کر سکتے ہیں، بالکل
// پرانے پراڈکٹس کی طرح)۔ نوٹ: کھاتہ (Salesman/ربنواز) اور سرف کا ماہانہ
// حساب کی اپنی الگ، مقررہ آئٹم فہرستیں ہیں (KATA_ITEMS/SALE_MAHANA_ITEMS)
// جو خودکار نیا پراڈکٹ شامل نہیں کرتیں — وہاں شامل کرنے کے لیے الگ سے
// بتائیں۔
function addNewProduct(){
  const key = 'custom_' + Date.now();
  packs.push({
    key, name:'نیا پراڈکٹ', tpcs:'', ctn:'', mrp:'', company:'',
    agencyB:'', agencyC:'', salman:'', dukandar:'',
    diffB:0, diffC:0, diffSalman:0, diffDukandar:0,
    agencyBManual:false, agencyCManual:false, salmanManual:false,
  });
  buildAllTierTables();
  if(typeof buildCombinedTable === 'function') buildCombinedTable();
  if(typeof scheduleSiteDataSave === 'function') scheduleSiteDataSave();
}
function deleteProduct(key){
  const p = packs.find(x=>x.key === key);
  if(!p) return;
  if(!confirm(`کیا آپ واقعی "${p.name || '(بلا نام)'}" کو پوری ریٹ لسٹ سے حذف کرنا چاہتے ہیں؟ یہ واپس نہیں ہو سکتا۔`)) return;
  const idx = packs.indexOf(p);
  if(idx !== -1) packs.splice(idx, 1);
  buildAllTierTables();
  if(typeof buildCombinedTable === 'function') buildCombinedTable();
  if(typeof scheduleSiteDataSave === 'function') scheduleSiteDataSave();
}

function fillTierTableBody(tbody, tier){
  tbody.innerHTML = '';
  packs.forEach((p)=>{
    const tr = document.createElement('tr');
    tr.dataset.key = p.key;

    if(tier.master){
      // All 5 columns now read their own toggle state from
      // masterColLocked — Products Name/CTN Pcs/Agency are no longer
      // hardcoded read-only.
      const nameTd = makeCell(p, 'name', true, !masterColLocked.name, 'name-cell');
      if(!masterColLocked.name){
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'row-delete-btn';
        delBtn.title = 'یہ پراڈکٹ حذف کریں';
        delBtn.textContent = '🗑';
        delBtn.style.marginLeft = '2px';
        delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteProduct(p.key); });
        nameTd.appendChild(delBtn);
      }
      tr.appendChild(nameTd);
      tr.appendChild(makeCell(p, 'tpcs', true, !masterColLocked.tpcs)); // text — keeps "20.000"-style weights exact, never silently reformatted by a number input
      tr.appendChild(makeCell(p, 'ctn', false, !masterColLocked.ctn));
      tr.appendChild(makeCell(p, 'mrp', false, !masterColLocked.mrp));
      tr.appendChild(makeCell(p, tier.key, false, !masterColLocked.company));
    } else {
      tr.appendChild(makeCell(p, 'name', true, false, 'name-cell'));
      tr.appendChild(makeCell(p, 'tpcs', true, false));
      ['ctn','mrp'].forEach(k=>{
        tr.appendChild(makeCell(p, k, false, false));
      });
      if(tier.slug !== 'dukandar'){
        // ایجنسی ریٹ (B/C/سیلزمین) اب براہِ راست لکھا جا سکتا ہے — ایک بار
        // لکھیں تو وہی قدر ہمیشہ کے لیے رہتی ہے، List A بدلنے پر بھی
        // خودکار واپس فارمولے پر نہیں جاتی۔ عام makeCell کے بجائے یہاں
        // الگ فنکشن استعمال کیا ہے کیونکہ makeCell ہر بار پوری ٹیبل دوبارہ
        // بنا دیتا (recalcDependentTiers) — جس سے ٹائپنگ کے دوران خانہ
        // فوکس کھو دیتا؛ یہاں صرف اسی قطار کا Profit خانہ تازہ ہوتا ہے۔
        tr.appendChild(makeManualAgencyCell(p, tier));
      }
    }

    // Profit — ہر کارڈ کے اپنے آخری دو خانوں (Price CTN منفی Agency) کا
    // فرق، ہمیشہ خودکار حساب سے، کبھی براہِ راست نہیں لکھا جاتا۔ دکاندار
    // کارڈ پر یہ کالم نہیں دکھایا جاتا (وہاں Agency کالم بھی نہیں ہے)۔
    // نوٹ: پہلے یہ ایک disabled <input> تھا — html2canvas (شیئر/پرنٹ کی
    // تصویر بنانے والا) disabled input کی قدر (value) صحیح طور پر نہیں
    // کھینچتا تھا، اسی لیے پرنٹ شدہ PDF میں Profit کالم بالکل خالی نظر آ
    // رہا تھا حالانکہ ویب سائٹ پر نمبر موجود تھے۔ باقی سب لاک شدہ خانوں کی
    // طرح اب یہ بھی ایک عام <span class="cell-val"> ہے — نہ صرف صفحے پر
    // بلکل ویسا ہی نظر آتا ہے، بلکہ پرنٹ میں بھی اب درست نظر آئے گا۔
    if(tier.slug !== 'dukandar'){
      const profitTd = document.createElement('td');
      profitTd.className = 'edit-cell';
      profitTd.dataset.profitCell = '1';
      const profitSpan = document.createElement('span');
      profitSpan.className = 'cell-val';
      const mrpNum = Number(p.mrp) || 0;
      const agencyNum = Number(p[tier.key]) || 0;
      profitSpan.textContent = Math.round((mrpNum - agencyNum) * 100) / 100;
      profitTd.appendChild(profitSpan);
      tr.appendChild(profitTd);
    }

    tbody.appendChild(tr);
  });
}

function makeCell(pack, field, isText, editable, extraClass, onInput){
  const td = document.createElement('td');
  td.className = 'edit-cell' + (extraClass ? ' ' + extraClass : '');

  if(editable){
    const input = document.createElement('input');
    input.type = isText ? 'text' : 'number';
    if(!isText) input.step = 'any';
    input.value = pack[field];
    input.className = 'cell-input';
    input.addEventListener('input', ()=>{
      if(isText){
        pack[field] = input.value;
      } else {
        pack[field] = Math.round((parseFloat(input.value) || 0) * 100) / 100; // consistent 2-decimal formatting everywhere
      }
      if(onInput) onInput();
      recalcDependentTiers();
    });
    td.appendChild(input);
  } else {
    const span = document.createElement('span');
    span.className = 'cell-val';
    span.textContent = pack[field];
    td.appendChild(span);
  }

  return td;
}

// Whenever List A changes (name, weight, CTN Pcs, Price CTN, or Rate A),
// recompute every other tier from A + its fixed difference, and redraw
// their read-only tables so they always mirror A exactly — UNLESS that
// tier's own Agency value has been manually typed in directly (see
// AGENCY MANUAL OVERRIDE below), in which case it's left alone forever,
// even when A changes.
function recalcDependentTiers(){
  packs.forEach(p=>{
    if(!p.agencyBManual) p.agencyB = p.company + p.diffB;
    if(!p.agencyCManual) p.agencyC = p.company + p.diffC;
    if(!p.salmanManual)  p.salman  = p.company + p.diffSalman;
    p.dukandar = p.company + p.diffDukandar;
  });
  tiers.forEach(tier=>{
    if(!tier.master){
      fillTierTableBody(tierBodies[tier.slug], tier);
    }
  });
  if(typeof syncKataItemsFromRateList === 'function') syncKataItemsFromRateList(); // کھاتہ کے Items/Weight/Profit/Price بھی فوراً تازہ ہوں
}

// Draws one tier's table straight onto a <canvas> from the data itself —
// no external library, no screenshotting the live page, so it always
// works even with no internet. Runs at 2x scale for a crisp save/share.
// Loads the same poster image used as the page's card background (the
// Best Excel powder/shirt photo, stored as a data: URL in the --poster-img
// CSS variable) so the exported share image can use it too. Cached after
// the first load.
let _posterImgPromise = null;
function loadPosterImage(){
  if(_posterImgPromise) return _posterImgPromise;
  _posterImgPromise = new Promise((resolve)=>{
    try{
      const cssVal = getComputedStyle(document.documentElement).getPropertyValue('--poster-img').trim();
      const match = cssVal.match(/url\((["']?)(.*?)\1\)/);
      const src = match ? match[2] : '';
      if(!src){ resolve(null); return; }
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    } catch(e){ resolve(null); }
  });
  return _posterImgPromise;
}

// Screenshots the tier's ACTUAL table element from the live page — this
// guarantees the shared image is always pixel-identical to what the user
// sees on screen (same fonts, same colors, same layout), since it is a
// direct capture rather than a hand-redrawn copy that can drift out of
// sync with the live CSS.
async function renderTierCanvas(btn){
  const el = btn.closest('.card').querySelector('.edit-table');
  // Make sure the site's webfonts are fully loaded before the screenshot,
  // otherwise html2canvas can capture a fallback font mid-swap.
  try{ await document.fonts.ready; } catch(e){ /* proceed anyway */ }
  // فونٹ لوڈ ہونے سے پہلے خانوں کا سائز شاید غلط فونٹ کی پیمائش پر طے ہوا
  // ہو — اب اصل فونٹ آ جانے کے بعد دوبارہ درست سائز کر لیتے ہیں، تاکہ
  // پرنٹ/شیئر شدہ تصویر میں بھی خانے بالکل اسی طرح صحیح نظر آئیں جیسے
  // صفحے پر نظر آتے ہیں۔
  if(typeof window.measureAndSizeInput === 'function'){
    el.querySelectorAll('.cell-input').forEach(window.measureAndSizeInput);
  }
  // 🔒/🔓 لاک بٹن کا ایموجی html2canvas میں صحیح نہیں کھینچا جاتا (رنگین
  // ڈبے کی طرح، غلط جگہ پر نظر آتا تھا — Agency ہیڈر کے اوپر عجیب نشان
  // بن جاتا تھا) — اسی لیے کھینچنے سے پہلے تمام لاک بٹن عارضی طور پر چھپا
  // دیتے ہیں، کھینچنے کے فوراً بعد واپس دکھا دیتے ہیں (2026-08-23)۔
  const lockBtns = el.querySelectorAll('.row-lock-btn, .master-all-lock-btn');
  const lockPrevDisplay = [];
  lockBtns.forEach(b=>{ lockPrevDisplay.push(b.style.display); b.style.display = 'none'; });
  // چوڑی ٹیبل (موبائل پر سائیڈ سکرول والی) کو html2canvas صرف نظر آنے
  // والا حصہ ہی کھینچتا تھا، پورا نہیں — اسی لیے کچھ کالم کٹے ہوئے آتے
  // تھے۔ کھینچنے سے پہلے مکمل چوڑا (بغیر سکرول) کر دیتے ہیں، بعد میں
  // واپس پہلے جیسا۔
  // پہلے یہاں ٹیبل کو مکمل چوڑا (max-content) کر کے کھینچا جاتا تھا کیونکہ
  // ٹیبل موبائل پر سائیڈ سکرول کرنی پڑتی تھی اور html2canvas صرف نظر آنے
  // والا حصہ کھینچتا تھا۔ اب ٹیبل fixed layout کی وجہ سے پہلے ہی مکمل
  // اسکرین میں فٹ ہے (کوئی سکرول نہیں) — اسی موجودہ حالت میں کھینچنا اب
  // زیادہ درست ہے، ورنہ پرنٹ ویب سائٹ سے مختلف (زیادہ چوڑا) نظر آتا۔
  try{
    return await html2canvas(el, {
      scale: 3,                 // high-res export
      backgroundColor: '#F4EFE2', // matches the card's cream background
      useCORS: true,
    });
  } finally {
    lockBtns.forEach((b,i)=>{ b.style.display = lockPrevDisplay[i]; });
  }
}


// Renders the tier's table to a canvas, then converts that canvas into a
// single-page PDF (via jsPDF) sized to match the table's own aspect ratio,
// and shares/downloads THAT — per the user's explicit request, the share
// button must always produce a PDF, never a plain image file.
// Per explicit request (2026-08-12): no in-page choice sheet anymore —
// tapping Share goes STRAIGHT to the device's native share sheet (all
// apps), only falling back to a plain download if the browser genuinely
// can't do native sharing with files.
// کمپیوٹر پر پرنٹ کرنے کا طریقہ: PDF کو ایک پوشیدہ iframe میں لوڈ کر کے
// اسی کا print() چلایا جاتا ہے — اس سے براؤزر کا اپنا اصل پرنٹ ڈائیلاگ
// کھلتا ہے (بالکل ویسے ہی جیسے Ctrl+P دبانے پر کھلتا ہے)، جس میں کمپیوٹر
// سے جڑا ہوا اصل پرنٹر خودکار پہلے سے منتخب نظر آتا ہے — الگ سے کوئی
// فائل ڈاؤن لوڈ نہیں ہوتی، صرف پرنٹ ڈائیلاگ کھلتا ہے جہاں "پرنٹ" دبانے پر
// اسی پرنٹر سے کاغذ نکل آتا ہے۔
function printPdfBlob(blob){
  const url = URL.createObjectURL(blob);
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;';
  iframe.src = url;
  document.body.appendChild(iframe);
  const cleanup = ()=>{ if(iframe.parentNode) iframe.parentNode.removeChild(iframe); URL.revokeObjectURL(url); };
  iframe.onload = ()=>{
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    } catch(err){
      // کچھ براؤزر iframe کے اندر سے پرنٹ کی اجازت نہیں دیتے — اس صورت میں
      // ایک نئے ٹیب میں PDF کھول دیتے ہیں تاکہ صارف وہاں سے Ctrl+P کر سکے۔
      window.open(url, '_blank');
    }
    setTimeout(cleanup, 60000); // پرنٹ ڈائیلاگ بند ہونے تک وقت دیتے ہیں، پھر صاف کرتے ہیں
  };
}

// موبائل (فون/ٹیبلٹ) اور کمپیوٹر میں فرق — چونکہ ونڈوز کا Edge/Chrome
// براؤزر بھی navigator.share() سپورٹ کرتا ہے (اسی لیے پہلے کمپیوٹر پر
// بھی موبائل کی طرح "Share" شیٹ کھل رہی تھی، پرنٹ ڈائیلاگ نہیں) — اب
// پہلے یہ چیک کر لیتے ہیں کہ ڈیوائس واقعی موبائل ہے یا نہیں، صرف اسی
// صورت میں native شیئر آزماتے ہیں، ورنہ کمپیوٹر پر ہمیشہ سیدھا پرنٹ
// ڈائیلاگ ہی کھلے گا۔
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
}
// موبائل/کمپیوٹر پرنٹ بٹن — صرف اسی ڈیوائس کی قسم پر نظر آئے (سکرین کے
// سائز/زوم پر نہیں — ایک کمپیوٹر پر تنگ/چھوٹی برائوزر ونڈو کو غلطی سے
// "موبائل" نہ سمجھ لیا جائے، اسی لیے اوپر والا isMobileDevice ہی معیار ہے،
// وہی جو پہلے سے شیئر/پرنٹ کے فیصلے میں استعمال ہوتا ہے) — 2026-09-01،
// صارف کی نشاندہی پر: پہلے یہ سکرین کی چوڑائی (CSS media query) سے طے ہوتا
// تھا، جو کمپیوٹر پر بھی چھوٹی/غیر میکسیمائزڈ ونڈو میں غلط بٹن دکھا رہا
// تھا — اب اصل ڈیوائس چیک پر منتقل کر دیا۔
function kataApplyPrintButtonVisibility(root){
  if(!root) return;
  const mobile = isMobileDevice();
  root.querySelectorAll('.kata-print-mobile-btn').forEach(b=>{ b.style.display = mobile ? '' : 'none'; });
  root.querySelectorAll('.kata-print-computer-btn').forEach(b=>{ b.style.display = mobile ? 'none' : ''; });
}

async function sharePdfDirectly(blob, fileName, title){
  if(isMobileDevice()){
    try{
      if(navigator.canShare && window.File){
        const file = new File([blob], fileName, {type:'application/pdf'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title});
          return;
        }
      }
    } catch(shareErr){
      // user cancelled the native share sheet — nothing else to do
      return;
    }
  }
  // کمپیوٹر پر — سیدھا پرنٹ ڈائیلاگ (کبھی Share شیٹ نہیں)۔
  printPdfBlob(blob);
}

async function shareCardAsImage(tier, btn){
  const originalLabel = btn.textContent;
  btn.textContent = '⏳ تیار ہو رہا ہے...';
  btn.disabled = true;
  try{
    const canvas = await renderTierCanvas(btn);
    const baseName = tier.title.replace(/\s+/g,'_');

    if(typeof jspdf === 'undefined' || !jspdf.jsPDF){
      throw new Error('jsPDF-not-loaded');
    }
    const { jsPDF } = jspdf;
    const imgData = canvas.toDataURL('image/png');
    // پرنٹر کا پرنٹ ڈائیلاگ ہمیشہ Portrait کاغذ فرض کرتا ہے — پہلے یہاں
    // چوڑی ٹیبل کے مطابق صفحہ بھی چوڑا (landscape) بنایا جاتا تھا، جس کی
    // وجہ سے کاغذ سیدھا نہیں بلکہ ترچھا/الٹی طرف (sideways) نکلتا تھا۔ اب
    // ہمیشہ سیدھا (Portrait، A4) صفحہ رکھتے ہیں اور تصویر کو اسی کے اندر
    // چوڑائی کے مطابق سکیل کر کے اوپر سے فٹ کرتے ہیں — یہی حل کھاتے کے
    // پرنٹ (kataPrintEntry) میں پہلے کیا جا چکا تھا، یہاں ریٹ لسٹ کے لیے
    // بھی وہی لگایا (2026-08-25، صارف کی نشاندہی پر — پرنٹ سیدھا/صحیح
    // ترتیب سے آنا چاہیے)۔
    const pdf = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 20;
    // صارف کی درخواست (2026-08-25): پہلے تصویر صرف چوڑائی کے مطابق سیدھی
    // فٹ ہوتی تھی، جس سے وہ صفحے کے اوپری حصے میں ہی رک جاتی تھی اور نیچے
    // کا بڑا حصہ خالی رہ جاتا تھا۔ اب لمبائی کو مکمل صفحے کے آخر تک
    // پھیلاتے ہیں، اور چوڑائی کو جان بوجھ کر تناسب سے کم رکھتے ہیں (0.62
    // فیکٹر) تاکہ صفحہ مکمل استعمال ہو اور تصویر پہلے سے پتلی/تنگ نظر
    // آئے — یہ تناسب برقرار رکھنے والا (aspect-preserving) فٹ نہیں بلکہ
    // جان بوجھ کر چوڑائی کو کم کیا گیا ہے۔
    const drawH = (pageH - margin*2) / 2;
    const widthNarrowFactor = 0.40;
    const drawW = drawH * (canvas.width / canvas.height) * widthNarrowFactor;
    pdf.addImage(imgData, 'PNG', (pageW - drawW)/2, margin, drawW, drawH);
    const blob = pdf.output('blob');
    const fileName = baseName + '.pdf';
    if(!blob) throw new Error('no-blob');

    await sharePdfDirectly(blob, fileName, tier.title);
  } catch(err){
    alert('PDF بنانے میں مسئلہ ہوا، دوبارہ کوشش کریں۔');
  } finally {
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}
buildAllTierTables();
loadPosterImage(); // warm the cache now, so tapping share later has zero delay before opening the native share sheet + COST TABLE (top of Formulation tab) ----------
// One row per product: packaging-weight columns first, cost/profit columns
// merged onto the right of the same row (paired by position).
// Per-COLUMN lock state — one lock per editable column (in the header row),
// not per row. Unlocking "Products Name" opens that whole column, top to
// bottom, for every product; other columns stay locked.
let colLocked = {
  name:true, weight:true, shopperWeight:true, rate:true, remainingSurf:true,
  perPieceRate:true, totalRemaining:true, companyProfit:true, bijli:true,
  tax:true, ctnRate:true, shopperAmt:true,
};

function buildCombinedTable(){
  // Rebuilding this table (below) replaces the whole DOM subtree, which on
  // mobile browsers can reset the page's scroll position — most noticeably
  // when a lock button inside the table is tapped: the button itself gets
  // destroyed and recreated, and some browsers then reset scroll instead of
  // keeping the view where it was. Save/restore scrollY around the rebuild
  // so tapping a lock keeps the screen exactly where it was.
  const scrollY = window.scrollY;
  const container = document.getElementById('combinedTableContainer');
  container.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card tier-card';

  const h2 = document.createElement('h2');
  h2.style.textAlign = 'center';
  h2.textContent = 'Best Excel ریٹ بنانے کا طریقہ';
  card.appendChild(h2);

  const wrap = document.createElement('div');
  wrap.className = 'edit-table wide-table';
  const table = document.createElement('table');
  table.dir = 'ltr';
  card.appendChild(wrap);
  wrap.appendChild(table);

  const thead = document.createElement('thead');
  const titleRow = document.createElement('tr');
  titleRow.innerHTML = '<th colspan="16" class="sheet-title" dir="ltr"><span class="brand-badge"><span class="b-best">Best</span> <span class="b-excel">Excel</span></span></th>';
  thead.appendChild(titleRow);

  // Builds one <th> — for a locked/unlockable column it includes a small
  // 🔒/🔓 toggle right in the header; formula columns just get the label.
  function makeHeaderCell(label, field){
    const th = document.createElement('th');
    if(field === null){
      th.textContent = label;
      return th;
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'row-lock-btn ' + (colLocked[field] ? 'is-locked' : 'is-unlocked');
    btn.textContent = colLocked[field] ? '🔒' : '🔓';
    btn.title = colLocked[field] ? 'یہ کالم ترمیم کے لیے کھولیں' : 'یہ کالم لاک کریں';
    btn.addEventListener('click', ()=>{
      colLocked[field] = !colLocked[field];
      buildCombinedTable();
    });
    th.appendChild(btn);
    th.appendChild(document.createTextNode(label));
    return th;
  }

  const headRow = document.createElement('tr');
  [
    ['items','name'], ['weight','weight'], ['فی گرام ƒ',null],
    ['ٹوٹل شاپر کے ساتھ وزن ƒ',null], ['ٹوٹل شاپر وزن ƒ',null], ['فی شاپر وزن','shopperWeight'],
    ['سرف فی کلو ریٹ','rate'], ['بقایا رقم کا سرف','remainingSurf'], ['سرف پیس تعداد','perPieceRate'],
    ['کمپنی ریٹ','totalRemaining'], ['ٹوٹل خرچ ƒ',null], ['کمپنی منافع','companyProfit'], ['بجلی','bijli'],
    ['ٹیکس','tax'], ['کارٹن کی قیمت','ctnRate'], ['شاپر کی قیمت','shopperAmt'],
  ].forEach(([label, field])=> headRow.appendChild(makeHeaderCell(label, field)));
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  table.appendChild(tbody);

  // A small "ƒ" badge marks any cell whose value is calculated by a formula
  // rather than typed in — makes it obvious at a glance which cells to trust
  // as auto and which are raw inputs.
  function makeFormulaCell(){
    const td = document.createElement('td');
    td.className = 'edit-cell formula-cell';
    const badge = document.createElement('span');
    badge.className = 'formula-badge';
    badge.textContent = 'ƒ';
    const span = document.createElement('span');
    span.className = 'cell-val';
    td.appendChild(badge);
    td.appendChild(span);
    return {td, span};
  }

  packagingRows.forEach((pRow, i)=>{
    const cRow = costRows[i] || (costRows[i] = {}); // "Best Excel sada" has no matching cost row in the reference sheet
    const tr = document.createElement('tr');

    tr.appendChild(makeCell(pRow, 'name', true, !colLocked.name, 'name-cell'));
    tr.appendChild(makeCell(pRow, 'weight', true, !colLocked.weight)); // text — preserves exact "20.850"/"20.000"-style padding; a number-type input was silently rounding this to 2 decimals and stripping trailing zeros whenever the column got unlocked and edited (root cause of the "20.8 instead of 20.800" report)

    // فی گرام = ٹوٹل شاپر کے ساتھ وزن ÷ سرف پیس تعداد
    const perGram = makeFormulaCell();
    // ٹوٹل شاپر کے ساتھ وزن = [(بقایا رقم کا سرف ÷ سرف فی کلو ریٹ) × 1000] + ٹوٹل شاپر وزن
    const totalWithShopper = makeFormulaCell();
    // ٹوٹل شاپر وزن = فی شاپر وزن × سرف پیس تعداد
    const totalShopperWeight = makeFormulaCell();

    const recalcPackagingChain = ()=>{
      const pieces = parseFloat(cRow.perPieceRate) || 0;
      const rate   = parseFloat(cRow.rate) || 0;
      const shopperW = parseFloat(pRow.shopperWeight) || 0;

      pRow.totalShopperWeight = Math.round(shopperW * pieces * 100) / 100;
      totalShopperWeight.span.textContent = kataIndianNumberFormat(pRow.totalShopperWeight);

      const surfGrams = rate ? ((cRow.remainingSurf || 0) / rate) * 1000 : 0;
      pRow.totalWithShopper = Math.round((surfGrams + pRow.totalShopperWeight) * 100) / 100;
      totalWithShopper.span.textContent = kataIndianNumberFormat(pRow.totalWithShopper);

      pRow.perGram = pieces ? Math.round((pRow.totalWithShopper / pieces) * 100) / 100 : 0;
      perGram.span.textContent = kataIndianNumberFormat(pRow.perGram);
    };

    tr.appendChild(perGram.td);
    tr.appendChild(totalWithShopper.td);
    tr.appendChild(totalShopperWeight.td);

    const shopperWeightTd = makeCell(pRow, 'shopperWeight', false, !colLocked.shopperWeight);
    const shopperWeightInput = shopperWeightTd.querySelector('input');
    if(shopperWeightInput) shopperWeightInput.addEventListener('input', recalcPackagingChain);
    tr.appendChild(shopperWeightTd);

    // وزن پیک کالم اب نظر نہیں آتا، لیکن ہر پروڈکٹ کی اپنی مقدار اب بھی
    // اندرونی طور پر فارمولے میں استعمال ہوتی ہے (pRow.packWeight)

    const rateTd = makeCell(cRow, 'rate', false, !colLocked.rate);
    const rateInput = rateTd.querySelector('input');
    if(rateInput) rateInput.addEventListener('input', recalcPackagingChain);
    tr.appendChild(rateTd);
    // "گرام" کالم اب نظر نہیں آتا (ہمیشہ 1000 تھا)، ڈیٹا اندرونی طور پر cRow.gram میں محفوظ رہتا ہے

    // بقایا رقم کا سرف — عام حالت میں خودکار بنتی ہے (کمپنی ریٹ − ٹوٹل
    // خرچ)، لیکن اپنا کالم کھلا ہو تو خود بھی لکھی جا سکتی ہے — دونوں
    // صورتوں میں تبدیلی فوراً آگے ٹوٹل شاپر کے ساتھ وزن اور فی گرام تک پہنچ جاتی ہے۔
    const remainingSurfTd = makeCell(cRow, 'remainingSurf', false, !colLocked.remainingSurf);
    const remainingSurfInput = remainingSurfTd.querySelector('input');
    const remainingSurfSpan = remainingSurfTd.querySelector('span.cell-val');
    if(remainingSurfInput) remainingSurfInput.addEventListener('input', recalcPackagingChain);
    const recalcRemainingSurf = ()=>{
      const raw = (parseFloat(cRow.totalRemaining) || 0) - (parseFloat(cRow.totalExpense) || 0);
      cRow.remainingSurf = Math.round(raw * 100) / 100; // cap at 2 decimal places
      if(remainingSurfInput) remainingSurfInput.value = cRow.remainingSurf;
      if(remainingSurfSpan) remainingSurfSpan.textContent = kataIndianNumberFormat(cRow.remainingSurf);
      recalcPackagingChain();
    };
    tr.appendChild(remainingSurfTd);

    const perPieceRateTd = makeCell(cRow, 'perPieceRate', false, !colLocked.perPieceRate);
    const perPieceRateInput = perPieceRateTd.querySelector('input');
    if(perPieceRateInput) perPieceRateInput.addEventListener('input', recalcPackagingChain);
    tr.appendChild(perPieceRateTd);

    const totalRemainingTd = makeCell(cRow, 'totalRemaining', false, !colLocked.totalRemaining);
    const totalRemainingInput = totalRemainingTd.querySelector('input');
    if(totalRemainingInput) totalRemainingInput.addEventListener('input', recalcRemainingSurf);
    tr.appendChild(totalRemainingTd);

    // ٹوٹل خرچ = شاپر کی قیمت + کارٹن کی قیمت + ٹیکس + بجلی + کمپنی منافع
    // — computed live from those five fields, never typed in directly.
    const expense = makeFormulaCell();
    const recalcExpense = ()=>{
      const raw =
        (parseFloat(cRow.shopperAmt)   || 0) +
        (parseFloat(cRow.ctnRate)      || 0) +
        (parseFloat(cRow.tax)          || 0) +
        (parseFloat(cRow.bijli)        || 0) +
        (parseFloat(cRow.companyProfit)|| 0);
      cRow.totalExpense = Math.round(raw * 100) / 100; // cap at 2 decimal places
      expense.span.textContent = kataIndianNumberFormat(cRow.totalExpense);
      recalcRemainingSurf();
    };
    tr.appendChild(expense.td);

    const companyProfitTd = makeCell(cRow, 'companyProfit', false, !colLocked.companyProfit);
    const bijliTd          = makeCell(cRow, 'bijli', false, !colLocked.bijli);
    const taxTd             = makeCell(cRow, 'tax', false, !colLocked.tax);
    const ctnRateTd          = makeCell(cRow, 'ctnRate', false, !colLocked.ctnRate);
    const shopperAmtTd        = makeCell(cRow, 'shopperAmt', false, !colLocked.shopperAmt);
    [companyProfitTd, bijliTd, taxTd, ctnRateTd, shopperAmtTd].forEach(td=>{
      const input = td.querySelector('input');
      if(input) input.addEventListener('input', recalcExpense);
    });
    tr.appendChild(companyProfitTd);
    tr.appendChild(bijliTd);
    tr.appendChild(taxTd);
    tr.appendChild(ctnRateTd);

// simple version) ----------
// kataEscape is normally defined in the کھاتہ module's script tag further
// down the page — but msRenderList() (below) gets called synchronously
// during THIS script's own initial page-load init, before that later
// script has run. A local copy here (identical body) makes it available
// in time; it gets harmlessly redefined to the exact same function once
// the کھاتہ module's script runs afterward.
function kataEscape(s){
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
// Same early-definition reason as kataEscape above — used by
// msRenderEntryCard to re-apply a saved cell's persisted color.
function kataColorStyleFor(cellColors, key){
  return (cellColors && cellColors[key]) ? `background-color:${cellColors[key]};` : '';
}
// Same early-definition reason as kataEscape above — msRenderList/
// msRenderStockCard etc. call these for Indian-style (lakh/crore) number
// grouping, but the کھاتہ module's script (where these are the real,
// authoritative definitions) only runs AFTER this one — so without a local
// copy here, msShowList()/msRenderList() at the bottom of this same script
// would throw "kataIndianNumberFormat is not defined" on every page load
// (2026-09-01، صارف کی نشاندہی — ہر بار سائٹ کھلتے ہی یہ خرابی آ رہی تھی)۔
// Harmlessly redefined to the exact same function once the کھاتہ module's
// script runs afterward.
function kataIndianNumberFormat(numVal){
  if(numVal == null) return numVal;
  const str = String(numVal).trim();
  if(!/^-?\d+(\.\d+)?$/.test(str)) return numVal;
  const neg = str.startsWith('-');
  let s = neg ? str.slice(1) : str;
  let dec = '';
  const dotIdx = s.indexOf('.');
  if(dotIdx !== -1){ dec = s.slice(dotIdx); s = s.slice(0, dotIdx); }
  if(s.length <= 3) return (neg?'-':'') + s + dec;
  const last3 = s.slice(-3);
  let rest = s.slice(0, -3);
  rest = rest.replace(/\B(?=(\d{2})+(?!\d)$)/g, ',');
  return (neg?'-':'') + rest + ',' + last3 + dec;
}
function kataApplyIndianFormattingToReadonly(root){
  if(!root) return;
  root.querySelectorAll('span.cell-val, .totals .n, div.n').forEach(el=>{
    if(el.querySelector('input, select, textarea')) return;
    el.textContent = kataIndianNumberFormat(el.textContent.trim());
  });
  root.querySelectorAll('td').forEach(td=>{
    if(td.children.length) return;
    td.textContent = kataIndianNumberFormat(td.textContent.trim());
  });
}

// Runs every time the کھاتوں کی فہرست is opened. If an OPEN book's most
// recent activity (last entry, or its own creation date if it has none yet)
// falls in an earlier calendar month than today, it gets closed (view-only
// from then on, see msRenderDetail) and a new book is created in its place,
// carrying the running total forward as the new book's opening Sabka. This
// NEVER deletes anything — only sets a `closed` flag and adds one new book.
function msCheckMonthRollover(){
  const books = msLocalGetBooks();
  const curMonth = kataMonthKey();
  let changed = false;
  const newBooks = [];
  books.forEach(b=>{
    if(b.closed) return;
    const entries = msLocalGetEntries(b.id);
    const lastEntry = entries.length ? entries[entries.length-1] : null;
    const refDate = lastEntry ? new Date(lastEntry.createdAt) : new Date(b.createdAt);
    const bookMonth = kataMonthKey(refDate);
    if(bookMonth !== curMonth){
      b.closed = true;
      changed = true;
      const finalTotal = lastEntry ? lastEntry.total : (b.carryForward || {n:0, totalProfit:0});
      newBooks.push({
        id: 'm' + Date.now() + Math.random().toString(36).slice(2,7),
        name: (b.name || 'کھاتہ') + ' - ' + curMonth,
        createdAt: new Date().toISOString(),
        carryForward: finalTotal,
      });
    }
  });
  if(newBooks.length) books.push(...newBooks);
  if(changed) msLocalSaveBooks(books);
}

// اسٹاک حساب: سیلزمین کھاتے اور ربنواز سیلزمین کے تمام کھاتوں کی تمام
// انٹریز میں سے ہر پراڈکٹ کی فروخت شدہ CTN جمع کی جاتی ہے (بذریعہ پوزیشن —
// KATA_ITEMS کے پہلے 8 آئٹمز اور MS_ITEMS کے 8 آئٹمز ایک ہی ترتیب میں ہیں،

// منہا کر کے باقی اسٹاک نکالا جاتا ہے۔
// یہ 8 کیز کھاتے کے KATA_ITEMS array سے میچ کرتی ہیں (وہاں دیکھیں اگر
// کبھی نام/ترتیب بدلے) — یہاں ہارڈ کوڈ کی گئی ہیں تاکہ یہ فنکشن صفحہ لوڈ
// ہوتے ہی (کھاتہ ماڈیول کا اپنا اسکرپٹ چلنے سے پہلے) بھی چل سکے، بغیر
// KATA_ITEMS پر انحصار کے — بالکل اسی طرز پر جیسے kataEscape کا مسئلہ
// پہلے حل کیا گیا تھا۔
const KATA_PRODUCT_KEYS = ['rs10','rs50','rs100','rs150','rs400','rs1000','special','sada'];
function kataSumSoldByProduct(booksKey, entriesPrefix){
  const sold = [0,0,0,0,0,0,0,0]; // 8 real products, same order as KATA_ITEMS/MS_ITEMS indices 0-7
  let books = [];
  try{ books = JSON.parse(localStorage.getItem(booksKey)) || []; }catch(e){ books = []; }
  books.forEach(book=>{
    let entries = [];
    try{ entries = JSON.parse(localStorage.getItem(entriesPrefix + book.id)) || []; }catch(e){ entries = []; }
    entries.forEach(entry=>{
      KATA_PRODUCT_KEYS.forEach((key, idx)=>{
        const v = entry.items && entry.items[key];
        if(v && v.t) sold[idx] += Number(v.t) || 0;
      });
    });
  });
  return sold;
}

function msComputeStock(){
  const soldSalesman = kataSumSoldByProduct('kataLocalBooks', 'kataLocalEntries_');
  const soldRibnawaz = kataSumSoldByProduct('kataLocalBooks_ribnawaz', 'kataLocalEntries_ribnawaz_');
  const soldAgency = kataSumSoldByProduct('kataLocalBooks_agency', 'kataLocalEntries_agency_');
  const sold = soldSalesman.map((v,i)=> Math.round((v + soldRibnawaz[i] + soldAgency[i]) * 100) / 100);

  const produced = [0,0,0,0,0,0,0,0];
  msLocalGetBooks().forEach(book=>{
    const entries = msLocalGetEntries(book.id);
    if(!entries.length) return;
    const last = entries[entries.length-1];
    MS_ITEMS.forEach((item, idx)=>{
      const v = last.items && last.items[item.key];
      if(v) produced[idx] += Number(v.totalCtn) || 0;
    });
  });

  let totalRemaining = 0, totalPrice = 0;
  const items = MS_ITEMS.map((item, idx)=>{
    const remaining = Math.round((produced[idx] - sold[idx]) * 100) / 100;
    // ریٹ لسٹ B کارڈ کا موجودہ ایجنسی ریٹ — یہی وہ قیمت ہے جس پر یہ مال
    // اصل میں خریدا/فروخت ہوتا ہے، اس لیے بچے ہوئے مال کی مالیت اسی کے
    // مطابق نکالی جاتی ہے۔
    const rlKey = MS_TO_RATELIST_KEY[item.key];
    const pack = (typeof packs !== 'undefined' && Array.isArray(packs)) ? packs.find(p=>p.key===rlKey) : null;
    const rate = pack ? (Number(pack.agencyB) || 0) : 0;
    const value = Math.round(remaining * rate * 100) / 100;
    totalRemaining += remaining;
    totalPrice += value;
    return {name: item.name, remaining, value};
  });
  totalRemaining = Math.round(totalRemaining * 100) / 100;
  totalPrice = Math.round(totalPrice * 100) / 100;
  return {items, totalRemaining, totalPrice};
}

function msRenderList(){

  books.forEach(b=>{

function msCreateNew(){
  siteTextPrompt('نئے کھاتے کا نام لکھیں (مثلاً: اگست 2026)', function(name){

    const books = msLocalGetBooks();

function msWireLiveFormulas(prevTotal, prevItemData){
  prevItemData = prevItemData || {};
  // خانے مواد (نمبر/الفاظ) کے سائز کے مطابق خودکار چھوٹے بڑے ہوں — same
  // mechanism as کھاتہ's own kataAutoSizeInput, applied here to #msDetailContainer.
  function msAutoSizeInput(input){
    (window.measureAndSizeInput || function(inp){
      if(!inp) return;
      const len = (inp.value || inp.placeholder || '0').toString().length;
      inp.style.width = Math.max(len + 1.5, 3) + 'ch';
    })(input);
  }
  document.querySelectorAll('#msDetailContainer .cell-input').forEach(msAutoSizeInput);
  document.querySelectorAll('#msDetailContainer .cell-input').forEach(inp=>{
    inp.addEventListener('input', ()=> msAutoSizeInput(inp));
  });

  // Profit/Price ریٹ کے خانے ہمیشہ لاک (بند) رہتے ہیں تاکہ غلطی سے رقم نہ
  // بدل جائے۔ 🔒 دبا کر کھولیں، نیا ریٹ لکھیں — لکھنا ختم کر کے خانے سے
  // باہر جاتے ہی (blur) خودکار دوبارہ لاک ہو جائے گا، الگ سے بند کرنے کی
  // ضرورت نہیں۔
  ['profitRate','priceRate'].forEach(field=>{
    const btn = document.querySelector(`[data-ms-lockbtn="${field}"]`);
    const inputs = document.querySelectorAll(`#msDetailContainer [data-ms-field="${field}"]`);
    function setLocked(locked){
      inputs.forEach(inp=> inp.disabled = locked);
      if(btn){
        btn.className = 'row-lock-btn ' + (locked ? 'is-locked' : 'is-unlocked');
        btn.textContent = locked ? '🔒' : '🔓';
        btn.title = locked ? 'یہ ریٹ ترمیم کے لیے کھولیں' : 'ترمیم کے بعد خودکار دوبارہ لاک ہو جائے گا';
      }
    }
    if(btn) btn.addEventListener('click', ()=> setLocked(btn.classList.contains('is-locked') ? false : true));
    inputs.forEach(inp=> inp.addEventListener('change', ()=>{
      if(!inp.disabled) setLocked(true); // ترمیم مکمل (blur) — خودکار دوبارہ لاک
    }));
  });

  function recalc(){
    let todayN = 0, todayProfit = 0;
    let sumCtn = 0, sumProfit = 0, sumPrice = 0;
    MS_ITEMS.forEach(item=>{
      const prev = prevItemData[item.key] || {ctn:0, profit:0, price:0};
      const nI = document.querySelector(`[data-ms-item="${item.key}"][data-ms-field="n"]`);
      const profitRateI = document.querySelector(`[data-ms-item="${item.key}"][data-ms-field="profitRate"]`);
      const priceRateI = document.querySelector(`[data-ms-item="${item.key}"][data-ms-field="priceRate"]`);
      const n = parseFloat((nI && nI.value)) || 0;
      const profitRate = parseFloat((profitRateI && profitRateI.value)) || 0;
      const priceRate = parseFloat((priceRateI && priceRateI.value)) || 0;
      const profitToday = Math.round(n * profitRate * 100) / 100;
      const priceToday = Math.round(n * priceRate * 100) / 100;
      const totalCtnItem = Math.round((prev.ctn + n) * 100) / 100;
      const totalProfitItem = Math.round((prev.profit + profitToday) * 100) / 100;
      const totalPriceItem = Math.round((prev.price + priceToday) * 100) / 100;

      const set = (sel, val)=>{ const el = document.querySelector(sel); if(el) el.textContent = kataIndianNumberFormat(val); };
      set(`[data-ms-totalctn="${item.key}"]`, totalCtnItem);
      set(`[data-ms-profittoday="${item.key}"]`, profitToday);
      set(`[data-ms-totalprofititem="${item.key}"]`, totalProfitItem);
      set(`[data-ms-pricetoday="${item.key}"]`, priceToday);
      set(`[data-ms-totalprice="${item.key}"]`, totalPriceItem);

      sumCtn += totalCtnItem; sumProfit += totalProfitItem; sumPrice += totalPriceItem;
      todayN += n; todayProfit += profitToday;
    });
    const setBox = (sel, val)=>{ const el = document.querySelector(sel); if(el) el.textContent = kataIndianNumberFormat(val); };
    setBox('[data-ms-sumctn]', Math.round(sumCtn * 100) / 100);
    setBox('[data-ms-sumprofit]', Math.round(sumProfit * 100) / 100);
    setBox('[data-ms-sumprice]', Math.round(sumPrice * 100) / 100);
    todayN = Math.round(todayN * 100) / 100;
    todayProfit = Math.round(todayProfit * 100) / 100;
    const totN = Math.round((prevTotal.n + todayN) * 100) / 100;
    const totProfit = Math.round((prevTotal.totalProfit + todayProfit) * 100) / 100;
    const set = (sel, val)=>{ const el = document.querySelector(sel); if(el) el.textContent = kataIndianNumberFormat(val); };
    set('[data-ms-today-n]', todayN);
    set('[data-ms-today-totalprofit]', todayProfit);
    set('[data-ms-tot-n]', totN);
    set('[data-ms-tot-totalprofit]', totProfit);

    let expSum = 0;
    ['employees','transport','goods','other'].forEach(k=>{
      const el = document.querySelector(`[data-ms-field="${k}"]`);
      expSum += Number((el && el.value)) || 0;
    });
    set('[data-ms-origprofit]', Math.round((todayProfit - expSum) * 100) / 100);
  }
  document.querySelectorAll('#msDetailContainer .cell-input').forEach(inp=>{
    inp.addEventListener('input', recalc);
  });
  recalc();

  // ↩ پچھلی تبدیلی واپس کریں — بالکل کھاتوں کی طرح: ہر خانے کی آخری مکمل
  // شدہ تبدیلی (blur/change پر) یاد رکھی جاتی ہے، تاکہ ایک بار Undo دبانے
  // سے پوری تبدیلی واپس آئے، ایک ایک حرف نہیں۔
  function msTrackUndo(input){
    input.addEventListener('focus', ()=>{ input.dataset.msPrevValue = input.value; });
    input.addEventListener('change', ()=>{
      if(msUndoRestoring) return;
      if(input.dataset.msPrevValue !== undefined && input.dataset.msPrevValue !== input.value){
        msUndoStack.push({input, oldValue: input.dataset.msPrevValue});
        if(msUndoStack.length > 50) msUndoStack.shift();
      }
      input.dataset.msPrevValue = input.value;
    });
  }
  document.querySelectorAll('#msDetailView .cell-input').forEach(msTrackUndo);

  function msUndo(){
    let entry = msUndoStack.pop();
    while(entry && !document.body.contains(entry.input)) entry = msUndoStack.pop(); // DOM سے ہٹ چکی قطاروں کی اندراجات چھوڑ دیں (مثلاً محفوظ ہونے کے بعد دوبارہ رینڈر پر)
    if(!entry) return;
    msUndoRestoring = true;
    entry.input.value = entry.oldValue;
    entry.input.dataset.msPrevValue = entry.oldValue;
    entry.input.dispatchEvent(new Event('input', {bubbles:true}));
    msUndoRestoring = false;
  }
  window.msUndo = msUndo; // سائٹ کے مشترکہ ↩ فلوٹنگ بٹن سے بھی رسائی کے لیے (کھاتہ کی طرح)

  const msUndoBtn = document.getElementById('msUndoBtn');
  if(msUndoBtn) msUndoBtn.addEventListener('click', msUndo);
  if(!window._msUndoKeyListenerAttached){
    window._msUndoKeyListenerAttached = true;
    document.addEventListener('keydown', (e)=>{
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && document.getElementById('msDetailView')){
        e.preventDefault();
        msUndo();
      }
    });
  }
}

function msSaveEntry(prevTotal, prevItemData){
  prevItemData = prevItemData || {};
  // تاریخ کا خانہ خالی ہو تو ہمیشہ کی طرح "ابھی" کا وقت — بھرا ہو تو وہی
  // تاریخ استعمال ہوتی ہے (دوپہر 12 بجے، تاکہ ٹائم زون کی وجہ سے دن آگے
  // پیچھے نہ ہو) — کھاتے کی طرح بند/تالے والے کھاتے میں پرانی تاریخ کی
  // انٹری شامل کرنے کے لیے۔
  const msDateInputEl = document.getElementById('msEntryDateInput');
  const msCustomDateStr = msDateInputEl && msDateInputEl.value ? msDateInputEl.value : '';
  const msCustomDate = msCustomDateStr ? new Date(msCustomDateStr + 'T12:00:00') : null;
  // نام کا خانہ — سیلزمین کھاتوں کی طرح، یہ انٹری کس نے درج کی۔ اگلی انٹری
  // میں خودکار وہی نام پہلے سے بھرا آئے (چپکنے والا)، جب تک صارف خود بدلے۔
  const msNameInputEl = document.getElementById('msEntryNameInput');
  const enteredBy = msNameInputEl ? msNameInputEl.value.trim() : '';
  (window.firebaseSyncSet || ((k,v)=>localStorage.setItem(k,v)))(MS_LAST_NAME_KEY, enteredBy);
  const items = {};
  let todayN = 0, todayProfit = 0;
  MS_ITEMS.forEach(item=>{
    const prev = prevItemData[item.key] || {ctn:0, profit:0, price:0};
    const nI = document.querySelector(`[data-ms-item="${item.key}"][data-ms-field="n"]`);
    const profitRateI = document.querySelector(`[data-ms-item="${item.key}"][data-ms-field="profitRate"]`);
    const priceRateI = document.querySelector(`[data-ms-item="${item.key}"][data-ms-field="priceRate"]`);
    const n = parseFloat(nI.value) || 0;
    const profitRate = parseFloat(profitRateI.value) || 0;
    const priceRate = parseFloat(priceRateI.value) || 0;
    const profitToday = Math.round(n * profitRate * 100) / 100;
    const priceToday = Math.round(n * priceRate * 100) / 100;
    const sabkaCtn = prev.ctn;
    const totalCtn = Math.round((sabkaCtn + n) * 100) / 100;
    const sabkaProfit = prev.profit;
    const totalProfitItem = Math.round((sabkaProfit + profitToday) * 100) / 100;
    const sabkaPrice = prev.price;
    const totalPrice = Math.round((sabkaPrice + priceToday) * 100) / 100;
    items[item.key] = {
      n, sabkaCtn, totalCtn,
      profitRate, profitToday, sabkaProfit, totalProfit: totalProfitItem,
      priceRate, priceToday, sabkaPrice, totalPrice,
    };
    msCtnProfits[item.key] = profitRate; // remember for next entry, like ریٹ لسٹ/کھاتہ reference fields
    msPrices[item.key] = priceRate;
    todayN += n; todayProfit += profitToday;
  });
  todayN = Math.round(todayN * 100) / 100;
  todayProfit = Math.round(todayProfit * 100) / 100;
  msSaveRates(); // Profit/Price ریٹس اگلی انٹری کے لیے بھی یاد رہیں — ری لوڈ یا نئی ڈیوائس پر بھی

  // اس انٹری کے فارم میں جو خانے رنگے گئے تھے (🎨 موڈ سے)، وہ رنگ اب اسی
  // انٹری کے ساتھ ہمیشہ کے لیے محفوظ ہو جاتے ہیں۔
  const cellColors = {};
  document.querySelectorAll('#msDetailContainer [data-color-key]').forEach(td=>{
    if(td.style.backgroundColor) cellColors[td.dataset.colorKey] = td.style.backgroundColor;
  });

  const expenses = {};
  let expSum = 0;
  ['employees','transport','goods','other'].forEach(k=>{
    const el = document.querySelector(`[data-ms-field="${k}"]`);
    const v = Number(el.value) || 0;
    expenses[k] = v; expSum += v;
  });
  const originalProfit = Math.round((todayProfit - expSum) * 100) / 100;

  if(todayN === 0 && todayProfit === 0){
    alert('کم از کم ایک آئٹم میں کوئی مقدار درج کریں۔');
    return;
  }

  const sabka = {n: prevTotal.n || 0, totalProfit: prevTotal.totalProfit || 0};
  const today = {n: todayN, totalProfit: todayProfit};
  const total = {n: Math.round((sabka.n + today.n) * 100) / 100, totalProfit: Math.round((sabka.totalProfit + today.totalProfit) * 100) / 100};

  const entries = msLocalGetEntries(msOpenId);
  entries.push({
    id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
    items, sabka, today, total, expenses, originalProfit, cellColors, enteredBy,
    createdAt: (msCustomDate ? msCustomDate : new Date()).toISOString(),
  });
  msLocalSaveEntries(msOpenId, entries);
  msOpenEntries = entries;
  msRenderDetail(msOpenName);
  kataShowSavedToast();
}

  const prevItemData = {};
  MS_ITEMS.forEach(item=>{
    const v = lastEntry && lastEntry.items && lastEntry.items[item.key];
    prevItemData[item.key] = {
      ctn: (v && v.totalCtn) || 0,
      profit: (v && v.totalProfit) || 0,

  let html = `<div class="card" style="text-align:center;">${kataDotsMenuHtml([{cls:'ms-close-book-btn', label:'📅 یہ ریکارڈ محفوظ کر کے نیا مہینہ شروع کریں'}, {cls:'ms-delete-book-btn', label:'🗑 یہ کھاتہ حذف کریں'}])}<h2 style="border:none;margin:0;">${kataEscape(name)}${msOpenClosed ? ' 🔒' : ''}</h2></div>`;

  // اوپر تاریخ کے خانے سے، بالکل سیلزمین/ربنواز/Agency کھاتوں کی طرح — پاس
  // ورڈ کے بغیر نیا فارم نظر ہی نہیں آتا، غلطی سے پرانی مکمل شدہ انٹری
  // چھیڑی نہ جا سکے۔
  const msClosedFormUnlocked = msOpenClosed && msUnlockedClosedBookIds.has(msOpenId);
  if(msOpenClosed && !msClosedFormUnlocked){
    html += `<div class="card" style="text-align:center;">
      <div class="note" style="margin-bottom:8px;">یہ کھاتہ بند ہو چکا ہے — نئی (پرانی تاریخ کی) انٹری شامل کرنے کے لیے پاس ورڈ درکار ہے۔</div>
      <button type="button" id="msClosedUnlockBtn" class="lock-btn">🔒 نئی انٹری کے لیے پاس ورڈ درج کریں</button>
    </div>`;
  } else {
    if(msOpenClosed){
      html += '<div class="card"><div class="note" style="text-align:center;">یہ کھاتہ بند ہو چکا ہے — نیچے تاریخ کا خانہ بھر کر پرانی تاریخ کی انٹری اب بھی شامل کی جا سکتی ہے۔</div></div>';
    }
    html += msRenderNewEntryForm(prevTotal, prevItemData);
  }

  // نئی انٹری کے بلکل نیچے: اگر اسی نام کے پرانے (بند شدہ، پچھلے مہینے کے)
  // ریکارڈ کا ڈبہ موجود ہو تو وہ یہاں بھی دکھائیں — بالکل کھاتوں کی طرح
  // (آخری انٹری کی تاریخ + نام + 🔒) — تاکہ اسی ریکارڈ کے اندر سے پرانا/بند
  // ریکارڈ کھولا جا سکے۔ صرف کھلے (غیر بند) ریکارڈ پر دکھتا ہے، چونکہ بند
  // ریکارڈ میں خود کوئی "نئی انٹری" موجود نہیں۔
  let msPrevClosedBook = null;
  if(!msOpenClosed){
    const baseName = name.replace(/ - \d{4}-\d{2}$/, '');
    if(baseName !== name){
      const siblingBooks = msLocalGetBooks();
      msPrevClosedBook = siblingBooks.find(b => b.name === baseName && b.closed && b.id !== msOpenId) || null;
    }
  }
  if(msPrevClosedBook){
    const prevEntries = msLocalGetEntries(msPrevClosedBook.id);
    const prevLastEntry = prevEntries.length ? prevEntries[prevEntries.length-1] : null;

    msWireLiveFormulas(prevTotal, prevItemData);
  }
  const msClosedUnlockBtn = document.getElementById('msClosedUnlockBtn');
  if(msClosedUnlockBtn){
    msClosedUnlockBtn.addEventListener('click', ()=>{
      siteTextPrompt('پاس ورڈ درج کریں', function(pw){
        if(pw === null) return;
        if(pw === KATA_CLOSED_ENTRY_PASSWORD){

    btn.addEventListener('click', ()=> msDeleteEntry());

  container.querySelectorAll('.kata-print-entry-btn').forEach(btn=>{

  if(bookCloseBtn) bookCloseBtn.addEventListener('click', ()=> msManualCloseBook(name));
  const msPrevClosedBookCard = container.querySelector('[data-ms-prev-closed-book-id]');
  if(msPrevClosedBookCard){
    msPrevClosedBookCard.addEventListener('click', ()=>{
      msOpen(msPrevClosedBookCard.dataset.msPrevClosedBookId, msPrevClosedBookCard.dataset.msPrevClosedBookName);
    });
  }
}

// موجودہ کھلا کھاتہ فوراً بند کر کے (پرانے مہینے کے ریکارڈ کے طور پر
// محفوظ ہو جاتا ہے، ہمیشہ کے لیے دیکھا جا سکتا ہے) اس کا آخری ٹوٹل نئے
// کھاتے میں بطور Sabka منتقل کر کے نیا مہینہ شروع کر دیتا ہے — بالکل
// وہی کام جو مہینہ خودکار بدلنے پر msCheckMonthRollover کرتا ہے، بس یہاں
// صارف کی مرضی سے، فوری طور پر۔ ڈیٹا کچھ بھی حذف نہیں ہوتا۔
function msManualCloseBook(name){
  if(!confirm(`"${name || '(بلا نام)'}" کو اب بند کر کے نیا مہینہ شروع کیا جائے؟ موجودہ ریکارڈ محفوظ رہے گا (صرف دیکھا جا سکے گا)، اور اسی کا آخری ٹوٹل نئے کھاتے میں بطور Sabka چلا جائے گا۔`)) return;
  const books = msLocalGetBooks();
  const book = books.find(b=>b.id===msOpenId);
  if(!book || book.closed) return;
  const entries = msLocalGetEntries(book.id);
  const lastEntry = entries.length ? entries[entries.length-1] : null;
  const finalTotal = lastEntry ? lastEntry.total : (book.carryForward || {n:0, totalProfit:0});
  book.closed = true;
  const newBook = {
    id: 'm' + Date.now() + Math.random().toString(36).slice(2,7),
    name: (book.name || 'کھاتہ') + ' - ' + kataMonthKey(),
    createdAt: new Date().toISOString(),
    carryForward: finalTotal,
  };
  books.push(newBook);
  msLocalSaveBooks(books);
  msShowList();
  msRenderList();
}

function msDeleteWholeBook(name){
  if(!confirm(`کیا آپ واقعی "${name || '(بلا نام)'}" کھاتہ مکمل طور پر حذف کرنا چاہتے ہیں؟ اس میں موجود تمام انٹریز بھی حذف ہو جائیں گی — یہ واپس نہیں ہو سکتا۔`)) return;
  const deletedId = msOpenId;
  const remaining = msLocalGetBooks().filter(x=>x.id !== deletedId);
  localStorage.setItem(msLocalBooksKey(), JSON.stringify(remaining));
  if(window.firebaseSyncDeleteBook) window.firebaseSyncDeleteBook(msLocalBooksKey(), deletedId, remaining);
  localStorage.removeItem(msLocalEntriesKey(deletedId));
  msShowList();
  msRenderList();
}

// ---------- FINGERPRINT / SCREEN-LOCK UNLOCK (WebAuthn) ----------
// Uses the phone's own fingerprint/screen-lock as a local re-entry gate on
// top of the already-signed-in Firebase session — not a separate server
// login, just "unlock this device quickly" instead of typing the password
// again every time.
const FP_FLAG_KEY = 'bestExcelFingerprintEnabled';
const FP_CRED_KEY = 'bestExcelFingerprintCredId';
let unlockedThisSession = false;

async function webAuthnSupported(){
  if(!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create)) return false;
  try{
    // The mere existence of the API isn't enough — some browsers expose it
    // without an actual fingerprint/screen-lock authenticator behind it.
    // This is the real check Chrome recommends for "can this device do it".
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  } catch(e){
    return false;
  }
}

async function registerFingerprint(){
  const userId = auth.currentUser ? auth.currentUser.uid : 'guest';
  const challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  const idBytes = new TextEncoder().encode(userId);
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: 'BEST Excel' },
      user: { id: idBytes, name: userId, displayName: userId },
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      timeout: 60000,
    }
  });
  const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem(FP_FLAG_KEY, '1');
  localStorage.setItem(FP_CRED_KEY, credIdB64);
}

async function verifyFingerprint(){
  const credIdB64 = localStorage.getItem(FP_CRED_KEY);
  const challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  const allowCredentials = credIdB64
    ? [{ type:'public-key', id: Uint8Array.from(atob(credIdB64), c=>c.charCodeAt(0)) }]
    : [];
  await navigator.credentials.get({
    publicKey: { challenge, allowCredentials, userVerification:'required', timeout:60000 }
  });
}

    await cred.user.updateProfile({displayName: pendingSignup.name});

      name: pendingSignup.name,
      email: pendingSignup.email,

auth.onAuthStateChanged(async (user)=>{
  if(user){
    logoutBtn.style.display = 'block';
    changePasswordBtn.style.display = 'block';
    const fpEnabled = localStorage.getItem(FP_FLAG_KEY) === '1';
    fingerprintManualBtn.style.display = fpEnabled ? 'none' : 'block';
    if(fpEnabled && !unlockedThisSession){
      // Already signed in (session persisted), but this device wants a
      // fingerprint/screen-lock gate before showing the app each time.
      authGate.classList.remove('hidden');
      showAuthStep('locked');
    } else if(justAuthenticated && !fpEnabled && await webAuthnSupported()){
      // A real login/signup just happened (not just reopening an already-
      // signed-in session) on a device that actually has a fingerprint/
      // screen-lock authenticator — offer to set unlock up once.
      justAuthenticated = false;
      authGate.classList.remove('hidden');
      showAuthStep('enableFingerprint');
    } else {
      justAuthenticated = false;
      authGate.classList.add('hidden');
    }
    if(window.initKataModule) window.initKataModule(user.uid);
  } else {
    unlockedThisSession = false;
    if(window.teardownKataModule) window.teardownKataModule();
    authGate.classList.remove('hidden');
    logoutBtn.style.display = 'none';
    changePasswordBtn.style.display = 'none';
    fingerprintManualBtn.style.display = 'none';
    changePasswordModal.classList.add('hidden');
    showAuthStep('login');
  }
});
} catch(err){
  console.warn('Auth system failed to initialize — running without login.', err);
  showAuthLoadError();
}
} else {
  console.warn('Firebase/EmailJS SDK loaded but global objects missing.');
  showAuthLoadError();
}
} // end initAuthSystem

// کھاتہ ماڈیول (رینڈر/حساب) خودکار نئی قدریں استعمال کرتا ہے، کہیں اور
// کچھ بدلنے کی ضرورت نہیں۔ صرف Z Net Bill کی دو قطاریں اس میں شامل نہیں
// (ریٹ لسٹ میں ان کا کوئی متبادل پراڈکٹ نہیں)، اور "d" (فرق) کالم بھی
// چھیڑا نہیں گیا — صرف weight/rate/prift۔
const KATA_TO_RATELIST_KEY = {rs10:'rs10', rs50:'rs50', rs100:'rs100', rs150:'rs150', rs400:'rs400', rs1000:'rs1000', special:'kabotar', sada:'sada'};
// لسٹ A میں آئٹمز اسی مقررہ ترتیب میں ہیں: Rs.10, Rs.50, Rs.100, Rs.150,
// Rs.400, Rs.1000, Special, sada — یہ کھاتہ کے KATA_ITEMS کی ترتیب سے مکمل
// ملتی ہے۔ چونکہ کلید (key) سے میچ کرنا ناقابلِ بھروسہ نکلا (ریٹ لسٹ کی
// اصل کلیدیں کبھی کبھی مختلف/تبدیل شدہ ہو سکتی ہیں)، اسی جگہ (پوزیشن) سے
// جوڑنا زیادہ قابلِ اعتماد ہے — 2026-08-24 کی وزن والی خرابی کی اصل وجہ
// یہی نکلی تھی۔
const KATA_RATELIST_INDEX = {rs10:0, rs50:1, rs100:2, rs150:3, rs400:4, rs1000:5, special:6, sada:7};
// کھاتہ کے کسی بھی آئٹم کے لیے ریٹ لسٹ (packs) میں اس کی صحیح قطار ڈھونڈتا
// ہے — پہلے کلید (key) سے میچ کرنے کی کوشش، نہ ملے تو مقررہ پوزیشن سے۔ اب
// ہر جگہ (sync، نئی انٹری فارم، لائیو حساب، محفوظ کرنا) یہی ایک فنکشن
// استعمال ہوتا ہے، تاکہ سب جگہ ایک جیسا اور قابلِ بھروسہ نتیجہ آئے۔
function kataFindPack(itemKey){
  if(typeof packs === 'undefined' || !packs) return null;
  const rlKey = KATA_TO_RATELIST_KEY[itemKey];
  let p = rlKey ? packs.find(x=>x.key === rlKey) : null;
  if(!p){
    const idx = KATA_RATELIST_INDEX[itemKey];
    if(idx != null && packs[idx]) p = packs[idx];
  }
  return p || null;
}
function syncKataItemsFromRateList(){
  if(typeof packs === 'undefined' || !Array.isArray(packs)) return;
  KATA_ITEMS.forEach(item=>{
    if(!KATA_TO_RATELIST_KEY[item.key] && KATA_RATELIST_INDEX[item.key] == null) return; // Z Net Bill — no ریٹ لسٹ equivalent, leave as-is
    const p = kataFindPack(item.key);
    if(!p) return;
    const agencyB = Number(p.agencyB) || 0;
    const mrp = Number(p.mrp) || 0;
    // نام (Items) 2026-08-21 سے خودکار نہیں — ہمیشہ nameManual، دیکھیں اوپر KATA_ITEMS کا نوٹ
    // Weight — پہلے یہاں "p.tpcs || item.weight" تھا (Rate کی طرح
    // unconditional نہیں) — اگر کبھی p.tpcs عارضی طور پر خالی ہوتا (مثلاً
    // ڈیٹا لوڈ کے دوران) تو پرانی/ابتدائی قدر ہمیشہ کے لیے پھنس جاتی، بعد
    // میں p.tpcs درست ہونے کے باوجود بھی۔ اب بالکل Rate جیسا ہی — ہمیشہ
    // براہِ راست ریٹ لسٹ کی موجودہ قدر، کبھی پرانی قدر پر انحصار نہیں۔
    item.weight = p.tpcs;
    item.rate = agencyB; // Price — ریٹ لسٹ B کارڈ کا ایجنسی ریٹ
    // فی کارٹن پیس تعداد — نیا "کل وزن" باکس اسی سے فی کارٹن وزن نکالتا ہے
    // (فی پیس Weight × یہ تعداد) — دیکھیں kataWireLiveFormulas کا نوٹ
    // (2026-08-23)۔
    item.pcsPerCtn = Number(p.ctn) || 0;
    // Profit — اب بالکل ریٹ لسٹ B کارڈ کے اپنے "Profit" کالم جتنا ہی
    // (Price CTN منفی Agency)، پہلے کی "B منفی Company" فارمولے کی بجائے
    // (2026-08-16 تبدیل کیا گیا، تصویر میں B کارڈ کے Profit کالم سے
    // موازنہ کر کے)۔
    item.prift = Math.round((mrp - agencyB) * 100) / 100;
  });
  if(typeof kataLocalRenderList === 'function' && document.getElementById('kataListView') && document.getElementById('kataListView').style.display !== 'none') kataLocalRenderList();

  // فوراً تازہ کر دیتے ہیں — بغیر پوری فارم دوبارہ بنائے (تاکہ اگر کوئی
  // اسی وقت T CTN میں کچھ لکھ رہا ہو تو اس میں رکاوٹ نہ آئے)۔ یہی وہ اصل
  // خودکار ربط ہے جو صارف نے مانگا: Rate ہمیشہ ریٹ لسٹ B سے آتا رہے،
  // کھاتے میں کبھی دستی تبدیل نہ ہو سکے۔
  const detailView = document.getElementById('kataDetailView');
  if(detailView && detailView.style.display !== 'none'){
    KATA_ITEMS.forEach(item=>{
      const rateCell = document.querySelector(`[data-kata-rate="${item.key}"]`);
      if(rateCell) rateCell.value = item.rate;
      const priftCell = document.querySelector(`[data-kata-prift="${item.key}"]`);
      if(priftCell) priftCell.value = item.prift;

      const tInput = document.querySelector(`[data-kata-item="${item.key}"][data-kata-field="t"]`);
      const tVal = Number((tInput && tInput.value)||0) || 0;

      if(totalRateCell) totalRateCell.textContent = item.rate * tVal;
      const totalPriftCell = document.querySelector(`[data-kata-totalprift="${item.key}"]`);
      if(totalPriftCell) totalPriftCell.textContent = item.prift * tVal;
    });
    if(typeof window.kataRecomputeTotalsBlock === 'function') window.kataRecomputeTotalsBlock();
  }
}

// ---------- LOCAL (no-login) STORAGE, used while login is switched off ----------
// Same data shapes as the Firestore path (books: {id,name,createdAt}; entries:
// same object kataSaveEntry already builds) so kataRenderDetail/kataRenderEntryCard/

function kataLocalBooksKey(){ return kataInstance === 'salesman' ? 'kataLocalBooks' : 'kataLocalBooks_' + kataInstance; }
function kataLocalEntriesKey(bookId){ return (kataInstance === 'salesman' ? 'kataLocalEntries_' : 'kataLocalEntries_' + kataInstance + '_') + bookId; }
function kataLocalGetBooks(){
  try{ return JSON.parse(localStorage.getItem(kataLocalBooksKey())) || []; }catch(e){ return []; }

function kataLocalSaveBooks(arr){

  if(window.firebaseSyncMergeBooksSet) window.firebaseSyncMergeBooksSet(kataLocalBooksKey(), arr, ()=>{ if(document.getElementById('kataListView').style.display !== 'none') kataLocalRenderList(); });
}
function kataLocalGetEntries(bookId){

}
function kataLocalSaveEntries(bookId, arr){ (window.firebaseSyncSet || ((k,v)=>localStorage.setItem(k,v)))(kataLocalEntriesKey(bookId), JSON.stringify(arr)); }

// Runs every time the کھاتوں کی فہرست is opened — same rollover logic as
// سرف کا ماہانہ حساب's msCheckMonthRollover (see there for the full
// explanation). Never deletes anything, only closes old books and adds new
// ones. Applies to whichever instance is active (سیلزمین یا ربنواز), since
// each already has its own separate storage namespace via kataInstance.
function kataCheckMonthRolloverLocal(){
  const books = kataLocalGetBooks();
  const curMonth = kataMonthKey();
  let changed = false;
  const newBooks = [];
  books.forEach(b=>{
    if(b.closed) return;
    const entries = kataLocalGetEntries(b.id);
    const lastEntry = entries.length ? entries[entries.length-1] : null;
    const refDate = lastEntry ? new Date(lastEntry.createdAt) : new Date(b.createdAt);
    const bookMonth = kataMonthKey(refDate);
    if(bookMonth !== curMonth){
      b.closed = true;
      changed = true;
      // نئے مہینے کا آغازی بیلنس بھی Bqaya (Jamah/ادائیگی منہا کرنے کے
      // بعد کی اصل باقی رقم) سے ہونا چاہیے، Total سے نہیں — اوپر والے اسی
      // مسئلے کی طرح (2026-08-23)۔ CTN اور Profit نئے مہینے میں خودکار 0 سے
      // شروع ہوتے ہیں — یہ صرف اسی مہینے کے اعداد و شمار ہیں، رقم کی طرح
      // اگلے مہینے میں بطور "باقی" آگے نہیں چلتے (صرف Price/Discount اصل
      // بقایا رقم ہیں، وہی آگے چلتے ہیں) (2026-09-01، صارف کی درخواست پر)۔
      const finalTotal = lastEntry ? (lastEntry.bqaya || lastEntry.total) : (b.carryForward || {t:0, price:0, profit:0, td:0});
      const carryForward = Object.assign({}, finalTotal, {t: 0, profit: 0});
      newBooks.push({
        id: 'k' + Date.now() + Math.random().toString(36).slice(2,7),
        name: (b.name || 'کھاتہ') + ' - ' + curMonth,
        createdAt: new Date().toISOString(),
        carryForward: carryForward,
      });
    }
  });
  if(newBooks.length) books.push(...newBooks);
  if(changed) kataLocalSaveBooks(books);
}

// ایک کھاتے کی سب سے تازہ باقی رقم (Remaining Price / Bqaya) — آخری محفوظ
// شدہ انٹری کے bqaya.price سے، یا انٹری نہ ہو تو book.carryForward.price
// سے، وہ بھی نہ ہو تو 0۔ لوکل اور Firestore دونوں موڈز میں استعمال ہوتا
// ہے۔ (2026-08-30 — صارف کی درخواست پر: ہر کھاتہ قسم [سیلزمین/ربنواز/
// Agency] کی فہرست کے اوپر خودکار "کل باقی رقم" باکس۔)
function kataBookRemainingPrice(book, lastEntry){
  if(lastEntry) return (lastEntry.bqaya && lastEntry.bqaya.price != null) ? lastEntry.bqaya.price : ((lastEntry.total && lastEntry.total.price) || 0);
  return (book && book.carryForward && book.carryForward.price) || 0;
}
function kataEntryDateOnly(ts){
  let d;
  if(ts && typeof ts.toDate === 'function') d = ts.toDate();
  else if(typeof ts === 'string') d = new Date(ts);
  if(!d || isNaN(d.getTime())) return null;
  return d;
}
function kataEntriesMonthCommissionSum(entries, monthKeyStr){
  let sum = 0;
  (entries||[]).forEach(entry=>{
    const d = kataEntryDateOnly(entry.createdAt);
    if(!d) return;
    if(kataMonthKey(d) !== monthKeyStr) return;
    sum += (entry.today && entry.today.commission) || 0;
  });
  return sum;
}
