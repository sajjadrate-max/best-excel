}

// انڈین نمبرنگ سسٹم (لاکھ/کروڑ گروپنگ — 7,47,574 / 6,78,75,464 طرز) —
// صارف کی درخواست پر (2026-08-30) کھاتہ (Best Excel Washing powder) کے
// بڑے نمبروں پر لاگو۔ 1000 سے کم نمبر کوما کے بغیر ہی رہتے ہیں (ضرورت
// نہیں)۔ صرف عدد کو فارمیٹ کرتا ہے — اصل حساب کتاب کہیں متاثر نہیں ہوتا۔
function kataIndianNumberFormat(numVal){
  if(numVal == null) return numVal;
  const str = String(numVal).trim();
  if(!/^-?\d+(\.\d+)?$/.test(str)) return numVal; // خالص عدد نہ ہو تو جوں کا توں
  const neg = str.startsWith('-');
  let s = neg ? str.slice(1) : str;
  let dec = '';
  const dotIdx = s.indexOf('.');
  if(dotIdx !== -1){ dec = s.slice(dotIdx); s = s.slice(0, dotIdx); }
  if(s.length <= 3) return (neg?'-':'') + s + dec;
  const last3 = s.slice(-3);
  let rest = s.slice(0, -3);
  rest = rest.replace(/\B(?=(\d{2})+(?!\d)$)/g, ',');
  return (neg?'-':'') + rest + ',' + last3 + dec;
}
// انڈین گروپنگ والے (کوما لگے) عدد کو واپس خالص نمبر میں بدلتا ہے — Jamah
// جیسے قابلِ ترمیم خانوں کے لیے، جہاں کوما لگنے کے بعد بھی حساب درست چلنا
// چاہیے (2026-09-01، صارف کی درخواست پر — Jamah بھی باقی خانوں جیسی
// فارمیٹنگ میں)۔
function kataParseNum(str){
  if(str == null) return 0;
  const n = Number(String(str).replace(/,/g, '').trim());
  return isNaN(n) ? 0 : n;
}
// Jamah جیسے قابلِ ترمیم عدد والے خانے پر لگاتے ہیں — لکھتے وقت (focus)
// سادہ عدد نظر آئے (آسانی سے ترمیم کے لیے)، لکھنا ختم کرنے پر (blur) انڈین
// گروپنگ (کوما) کے ساتھ نظر آئے، باقی سائٹ کی طرح۔
function kataWireJamahFormatting(input){
  if(!input) return;
  input.addEventListener('focus', ()=>{ const n = kataParseNum(input.value); input.value = String(n); });
  input.addEventListener('blur', ()=>{ const n = kataParseNum(input.value); input.value = kataIndianNumberFormat(n); });
}
// محفوظ شدہ (read-only) کھاتہ کارڈز کے اندر جتنے بھی خالص عدد والے
// cell-val/n خانے ہیں انہیں انڈین گروپنگ میں بدل دیتا ہے — input فیلڈز کو
// ہاتھ نہیں لگاتا (وہ حساب کتاب کے کوڈ میں Number()/parseFloat() سے پڑھے
// جاتے ہیں، کوما لگنے سے وہ ٹوٹ جائیں گے)۔
function kataApplyIndianFormattingToReadonly(root){
  if(!root) return;
  root.querySelectorAll('span.cell-val, .totals .n, div.n').forEach(el=>{
    if(el.querySelector('input, select, textarea')) return;
    el.textContent = kataIndianNumberFormat(el.textContent.trim());
  });
  root.querySelectorAll('td').forEach(td=>{
    if(td.children.length) return;
    td.textContent = kataIndianNumberFormat(td.textContent.trim());
  });
}

// یک بارگی ڈیٹا اصلاح (2026-08-30، صارف کی واضح درخواست): Agency کی تمام
// پرانی محفوظ شدہ انٹریوں میں کمیشن شامل کریں — فی کارٹن ریٹ آئٹم کے مطابق
// (RS.10/RS.50/RS.100 = 40، RS.150/RS.400/RS.1000/Khula Special/Khula sada
// = 60) — اور ہر کھاتے میں تاریخ وار سابقہ+آج=ٹوٹل کا حساب اسی طرح دوبارہ
// بنائیں جیسے نئی انٹری محفوظ کرتے وقت اب خودکار بنتا ہے۔ ایک ہی گاہک کے
// کئی مہینوں کے الگ الگ کھاتے (نام کے آخر میں " - YYYY-MM" لگا کر خودکار
// نئے مہینے کا کھاتہ بنتا ہے) بنیادی نام سے پہچان کر تاریخ وار زنجیر میں
// جوڑے جاتے ہیں تاکہ کمیشن کئی مہینوں میں درست طور پر آگے چلتا رہے۔ یہ
// صرف ایک بار چلتا ہے (localStorage flag سے روکا جاتا ہے) تاکہ دوبارہ
// چلنے پر رقم دوگنی نہ ہو۔
const KATA_COMMISSION_RATE_MAP = {rs10:40, rs50:40, rs100:40, rs150:60, rs400:60, rs1000:60, special:60, sada:60};
const KATA_COMMISSION_BACKFILL_FLAG = 'kataCommissionBackfillDone_v2'; // v1→v2 (2026-08-30): پہلی کوشش کسی ڈیوائس پر cloud sync سے پہلے ہی چل کر "ہو چکا" کا flag لکھ چکی تھی، جس سے درست شدہ کوڈ کبھی دوبارہ نہیں چلتا — نیا version نمبر اسے دوبارہ چلاتا ہے
function kataCommissionBaseName(name){
  return String(name||'').replace(/ - \d{4}-\d{2}$/, '');
}
function kataBackfillCommissionForAgency(){
  try{
    if(localStorage.getItem(KATA_COMMISSION_BACKFILL_FLAG)) return;
    const booksKey = 'kataLocalBooks_agency';
    const booksRaw = localStorage.getItem(booksKey);
    const books = booksRaw ? (JSON.parse(booksRaw) || []) : [];
    if(!books.length){ localStorage.setItem(KATA_COMMISSION_BACKFILL_FLAG, '1'); return; }
    // ایک ہی گاہک کے کئی مہینوں کے کھاتے بنیادی نام سے گروپ کر کے تاریخ
    // وار ترتیب دیں (چاہے اصل فہرست میں ترتیب کچھ بھی ہو)۔
    const groups = {};
    books.forEach(b=> {
      const base = kataCommissionBaseName(b.name);
      (groups[base] = groups[base] || []).push(b);
    });
    let booksChanged = false;
    Object.values(groups).forEach(chain=>{
      chain.sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
      // پوری زنجیر میں ایک ہی مسلسل چلنے والا مجموعہ — پچھلے کھاتے کا آخری
      // کمیشن اگلے کھاتے کے carryForward میں لکھ کر، اسی وقت اگلے کھاتے کی
      // اپنی انٹریاں شروع کرنے سے پہلے، ورنہ اگلے کھاتے کا سابقہ ہمیشہ 0 سے
      // شروع ہو جاتا (2026-08-30 کو ٹیسٹ کے دوران یہی خرابی پکڑی گئی)۔
      let runningCommission = 0;
      chain.forEach((book, i)=>{
        if(i === 0){
          runningCommission = (book.carryForward && book.carryForward.commission) || 0;
        } else if(book.carryForward){
          book.carryForward.commission = runningCommission;
          booksChanged = true;
        }
        const entriesKey = 'kataLocalEntries_agency_' + book.id;
        const entriesRaw = localStorage.getItem(entriesKey);
        const entries = entriesRaw ? (JSON.parse(entriesRaw) || []) : [];
        if(entries.length){
          entries.forEach(entry=>{
            let todayCommission = 0;
            Object.keys(KATA_COMMISSION_RATE_MAP).forEach(key=>{
              const it = entry.items && entry.items[key];
              if(!it) return;
              const rate = KATA_COMMISSION_RATE_MAP[key];
              const cTotal = rate * (it.t||0);
              it.commissionRate = rate;
              it.commissionTotal = cTotal;
              todayCommission += cTotal;
            });
            const sabkaCommission = runningCommission;
            const totalCommission = sabkaCommission + todayCommission;
            if(entry.sabka) entry.sabka.commission = sabkaCommission;
            if(entry.today) entry.today.commission = todayCommission;
            if(entry.total) entry.total.commission = totalCommission;
            if(entry.bqaya) entry.bqaya.commission = totalCommission;
            runningCommission = totalCommission;
          });
          localStorage.setItem(entriesKey, JSON.stringify(entries));
          if(window.firebaseSyncSet) window.firebaseSyncSet(entriesKey, JSON.stringify(entries));
        }
      });
    });
    if(booksChanged){
      localStorage.setItem(booksKey, JSON.stringify(books));
      if(window.firebaseSyncSet) window.firebaseSyncSet(booksKey, JSON.stringify(books));
    }
    localStorage.setItem(KATA_COMMISSION_BACKFILL_FLAG, '1');
  } catch(e){ console.warn('commission backfill failed', e); }
}
window.kataBackfillCommissionForAgency = kataBackfillCommissionForAgency;

function kataLocalRenderList(){
  kataCheckMonthRolloverLocal();
  const container = document.getElementById('kataListContainer');
  if(!container) return;
  const totalBox = document.getElementById('kataListTotalBox');
  const allBooks = kataLocalGetBooks();
  // فہرست اور "کل باقی رقم" دونوں میں صرف جاری (غیر بند) کھاتے شامل ہوں —
  // بند شدہ (پچھلے مہینے کے، auto-rollover والے) کھاتے یہاں نہیں دکھائے
  // جاتے (وہ اب صرف اسی نام کے نئے کھاتے کے اندر، نئی انٹری کے نیچے، لنک
  // کے ذریعے قابلِ رسائی ہیں) — اور نہ ہی ان کی رقم کل میں شامل کی جاتی ہے،
  // چونکہ وہ رقم پہلے ہی نئے کھاتے کے carryForward میں شمار ہو چکی ہے،
  // ورنہ دونوں جگہ گنے جانے سے رقم دگنی ہو جاتی (2026-09-01، صارف کی
  // درخواست پر)۔
  const books = allBooks.filter(b => !b.closed);
  if(!books.length){
    container.innerHTML = '<div class="note" style="text-align:center;">ابھی کوئی جاری کھاتہ موجود نہیں — اوپر بٹن سے نیا کھاتہ بنائیں۔</div>';
    if(totalBox) totalBox.innerHTML = '';
    return;
  }
  if(totalBox){
    let totalRemaining = 0;
    let monthCommission = 0;
    const curMonthKey = kataMonthKey();
    books.forEach(b=>{
      const entries = kataLocalGetEntries(b.id);
      const lastEntry = entries.length ? entries[entries.length-1] : null;
      totalRemaining += kataBookRemainingPrice(b, lastEntry);
      if(kataInstance === 'agency') monthCommission += kataEntriesMonthCommissionSum(entries, curMonthKey);
    });
    totalBox.innerHTML = kataRenderTotalRemainingBoxHtml(totalRemaining, monthCommission);
  }
  container.innerHTML = '';
  books.forEach(b=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cursor = 'pointer';
    card.style.textAlign = 'center';
    const entries = kataLocalGetEntries(b.id);
    const lastEntry = entries.length ? entries[entries.length-1] : null;
    const lastEntryDate = lastEntry ? kataEntryDateOnly(lastEntry.createdAt) : null;
    // Agency کھاتہ — صارف کی درخواست پر (2026-08-28): نام میں غلطی درست
    // کرنے کے لیے ✏️ بٹن (صرف Agency میں)۔ (2026-08-30 — ہر کھاتے کے اپنے
    // ڈبے کے اوپر اسی کھاتے کی آخری انٹری کی تاریخ۔)
    card.innerHTML = `${lastEntryDate ? `<div class="note" style="text-align:center;font-size:11px;margin-bottom:2px;">آخری انٹری: ${lastEntryDate.toLocaleDateString('en-GB')}</div>` : ''}<h2 style="border:none;margin:0;font-size:18px;">${kataEscape(b.name || '(بلا نام)')}${b.closed ? ' 🔒' : ''}${kataInstance === 'agency' ? ` <button type="button" class="kata-rename-book-btn" data-kata-book-id="${b.id}" style="font-size:14px;background:none;border:1px solid var(--line);border-radius:4px;padding:2px 6px;cursor:pointer;">✏️</button>` : ''}</h2>`;
    card.addEventListener('click', (ev)=>{ if(ev.target.closest('.kata-rename-book-btn')) return; kataLocalOpen(b.id, b.name || ''); });

    container.appendChild(card);
  });
  if(kataInstance === 'agency'){
    container.querySelectorAll('.kata-rename-book-btn').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const id = btn.dataset.kataBookId;
        siteTextPrompt('نیا نام لکھیں', function(newName){
          if(!newName || !newName.trim()) return;
          const arr = kataLocalGetBooks();
          const b = arr.find(x=>x.id===id);
          if(b){ b.name = newName.trim(); kataLocalSaveBooks(arr); kataLocalRenderList(); }
        });
      });
    });
  }
}

// ---------- کام کی حالت (نامحفوظ + نئی انٹری) — ایپ/ٹیب چھوڑ کر واپس آنے
// پر بحال (2026-08-22، صارف کی درخواست) ----------
// جب موبائل کوئی دوسرا ایپ کھولنے یا کمپیوٹر پر کوئی دوسری ونڈو دیکھنے پر
// اس ویب سائٹ کے ٹیب کو (میموری بچانے کے لیے) پس منظر میں بند/ری لوڈ کر
// دیتا ہے، تو صفحہ دوبارہ کھلنے پر جاوا اسکرپٹ کی حالت (کون سا کھاتہ کھلا
// تھا، "+ نئی انٹری" میں کیا لکھا جا رہا تھا) ضائع ہو جاتی تھی — صرف
// "محفوظ کریں" دبانے سے پہلے تک کا سب کام دوبارہ کرنا پڑتا تھا۔ اب: جب
// بھی صفحہ پس منظر میں جائے (visibilitychange/pagehide)، اگر کوئی کھاتہ
// کھلا ہو تو اس کی "+ نئی انٹری" فارم کی ہر خانے کی قدر localStorage میں
// وقت کی مہر کے ساتھ محفوظ کر لی جاتی ہے۔ صفحہ دوبارہ نظر آنے پر: اگر یہ
// محفوظ شدہ حالت 30 سیکنڈ سے کم پرانی ہے تو وہی کھاتہ خودکار دوبارہ کھول
// کر ساری قدریں واپس بھر دی جاتی ہیں (بالکل جہاں چھوڑا تھا وہیں سے)؛ 30
// سیکنڈ سے زیادہ پرانی ہو تو خاموشی سے حذف ہو جاتی ہے — نیا خالی کام شروع
// ہوتا ہے (خودکار ری سیٹ)۔ یہ صرف نامحفوظ ("+ نئی انٹری") ڈیٹا پر اثر
// انداز ہے — جو انٹری پہلے سے "محفوظ کریں" دبا کر Firestore/localStorage
// میں محفوظ ہو چکی ہے، وہ ہمیشہ کی طرح محفوظ ہی رہتی ہے، اس کا اس فیچر سے
// کوئی تعلق نہیں۔
const KATA_DRAFT_KEY = 'kataDraftEntryState';
const KATA_DRAFT_TTL_MS = 180000; // 3 منٹ (پہلے 30 سیکنڈ تھا، 2026-08-22 کو صارف کی درخواست پر بڑھایا)
function kataDraftInputKey(input, idx){
  if(input.id) return 'id:'+input.id;
  if(input.dataset.kataItem && input.dataset.kataField) return 'item:'+input.dataset.kataItem+':'+input.dataset.kataField;
  if(input.dataset.kataRate) return 'rate:'+input.dataset.kataRate;
  if(input.dataset.kataPrift) return 'prift:'+input.dataset.kataPrift;
  if(input.dataset.kataSabka) return 'sabka:'+input.dataset.kataSabka;
  if(input.dataset.jamah) return 'jamah:'+input.dataset.jamah;
  return 'idx:'+idx; // آخری حل — پوزیشن کی بنیاد پر
}
function kataSaveDraftIfOpen(){
  try{
    const card = document.getElementById('kataNewEntryCard');
    if(!kataOpenId || !card){
      localStorage.removeItem(KATA_DRAFT_KEY);
      return;
    }
    const values = {};
    card.querySelectorAll('input').forEach((input, idx)=>{
      values[kataDraftInputKey(input, idx)] = input.value;
    });
    localStorage.setItem(KATA_DRAFT_KEY, JSON.stringify({
      kataOpenId, kataOpenName, kataInstance, ts: Date.now(), values,
    }));
  } catch(e){ /* localStorage ناکام ہو تو خاموشی سے نظرانداز — یہ فیچر ضروری نہیں، صرف سہولت ہے */ }
}
function kataTryRestoreDraft(){
  try{
    // اگر صفحہ اصل میں ری لوڈ نہیں ہوا (زیادہ تر معاملات میں موبائل/کمپیوٹر
    // پس منظر میں ٹیب زندہ رکھتے ہیں) تو کھاتہ اور فارم پہلے ہی جوں کے توں
    // موجود ہیں — کچھ بحال کرنے کی ضرورت نہیں، دوبارہ کھولنے سے صرف غیر
    // ضروری ری فریش/جھٹکا لگے گا۔
    if(kataOpenId && document.getElementById('kataNewEntryCard')) return;
    const raw = localStorage.getItem(KATA_DRAFT_KEY);
    if(!raw) return;
    const draft = JSON.parse(raw);
    if(!draft || !draft.ts || (Date.now() - draft.ts) > KATA_DRAFT_TTL_MS){
      localStorage.removeItem(KATA_DRAFT_KEY);
      return;
    }
    if(!draft.kataOpenId || draft.kataInstance !== kataInstance) return; // دوسرے کھاتہ ٹیب (سیلزمین/ربنواز/Agency) کا ڈرافٹ یہاں لاگو نہیں
    if(kataLocalMode) kataLocalOpen(draft.kataOpenId, draft.kataOpenName);
    else if(typeof kataOpen === 'function') kataOpen(draft.kataOpenId, draft.kataOpenName);
    const tryFill = (attemptsLeft)=>{
      const card = document.getElementById('kataNewEntryCard');
      if(!card){
        if(attemptsLeft > 0) return setTimeout(()=> tryFill(attemptsLeft-1), 200);
        return;
      }
      card.querySelectorAll('input').forEach((input, idx)=>{
        const key = kataDraftInputKey(input, idx);
        if(Object.prototype.hasOwnProperty.call(draft.values, key)){
          input.value = draft.values[key];
          input.dispatchEvent(new Event('input', {bubbles:true}));
        }
      });
      localStorage.removeItem(KATA_DRAFT_KEY);
    };
    tryFill(20); // ~4 سیکنڈ تک انتظار — Firestore سے کھاتہ کھلنے میں وقت لگ سکتا ہے
  } catch(e){ /* نظرانداز */ }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') kataSaveDraftIfOpen();
  else if(document.visibilityState === 'visible') kataTryRestoreDraft();
});
window.addEventListener('pagehide', kataSaveDraftIfOpen);
// صفحہ پہلی بار لوڈ ہونے پر بھی چیک کریں — اگر موبائل نے میموری بچانے کے
// لیے پورا ٹیب ہی نئے سرے سے لوڈ کر دیا ہو (نہ صرف چھپایا ہو) تو یہیں سے بحال ہوگا
kataTryRestoreDraft();

// Firestore counterpart of kataCheckMonthRolloverLocal — same logic, same
// "never delete, only close+add" rule, just async/batched for Firestore.
// Runs once whenever the module initializes (i.e. right after sign-in).
async function kataCheckMonthRolloverFirestore(){
  try{
    const curMonth = kataMonthKey();
    const snap = await kataCol().get();
    const batch = window.db.batch();
    let changed = false;
    for(const docSnap of snap.docs){
      const data = docSnap.data();
      if(data.closed) continue;
      const entriesSnap = await kataCol().doc(docSnap.id).collection('entries').orderBy('createdAt','asc').get();
      const lastDoc = entriesSnap.docs.length ? entriesSnap.docs[entriesSnap.docs.length-1] : null;
      const lastData = lastDoc ? lastDoc.data() : null;
      let refDate;
      if(lastData && lastData.createdAt && typeof lastData.createdAt.toDate === 'function') refDate = lastData.createdAt.toDate();
      else if(data.createdAt && typeof data.createdAt.toDate === 'function') refDate = data.createdAt.toDate();
      else refDate = new Date();
      const bookMonth = kataMonthKey(refDate);
      if(bookMonth !== curMonth){
        changed = true;
        batch.update(docSnap.ref, {closed: true});
        // نئے مہینے کا آغازی بیلنس بھی Bqaya سے، Total سے نہیں (2026-08-23)۔
        const finalTotal = lastData ? (lastData.bqaya || lastData.total) : (data.carryForward || {t:0, price:0, profit:0, td:0});
        const newRef = kataCol().doc();
        batch.set(newRef, {
          name: (data.name || 'کھاتہ') + ' - ' + curMonth,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          carryForward: finalTotal,
        });
      }
    }
    if(changed) await batch.commit();
  } catch(err){
    console.warn('kata month rollover (Firestore) failed', err);
  }
}

// کھاتے کے نام کے آخر میں خودکار لگا " - YYYY-MM" حصہ ہٹا کر اصل نام دیتا
// ہے — مثلاً "Shafiq Bhatti - 2026-09" سے "Shafiq Bhatti"۔ صرف دکھانے کے
// لیے استعمال ہوتا ہے (نئی انٹری فارم میں سیلزمین/Agency کا نام)، کھاتے کا

// پر — تاریخ صرف کھاتے کے عنوان میں رہے، نام کے خانے میں نہ آئے)۔
function kataBaseBookName(name){
  return (name || '').replace(/ - \d{4}-\d{2}$/, '');
}

// پرانی محفوظ شدہ انٹریوں میں "Khula Special"/"Khula sada" کا وزن "20.000"
// کی شکل میں محفوظ تھا (نئی انٹریوں میں اب "20kg" لکھا جاتا ہے) — صارف کی
// درخواست پر (2026-08-30) صرف دکھانے کے وقت "20.kg" میں بدل دیا جاتا ہے،
// خام ڈیٹا (Firestore) نہیں چھیڑا جاتا۔
function kataDisplayWeight(w){
  return (w === '20.000') ? '20.kg' : w;
}
function kataParseWeightGrams(str){
  if(str == null) return 0;
  const s = String(str).trim().toLowerCase();
  const num = parseFloat(s) || 0;
  return s.endsWith('kg') ? num * 1000 : num;
}

// Small "⋮" corner menu, reused for both کھاتہ book delete (list view) and
// the last-entry delete (detail view) — keeps a rarely-used destructive
// action tucked away instead of a big always-visible red button.
function kataDotsMenuHtml(items){
  const buttons = items.map(it => `<button type="button" class="${it.cls}">${it.label}</button>`).join('');
  return `<div class="kata-dots-wrap"><button type="button" class="kata-dots-btn">⋮</button><div class="kata-dots-menu">${buttons}</div></div>`;
}
if(!window._kataDotsMenuWired){
  window._kataDotsMenuWired = true;
  document.addEventListener('click', (e)=>{
    const dotsBtn = e.target.closest('.kata-dots-btn');
    const openMenus = document.querySelectorAll('.kata-dots-menu.open');
    if(dotsBtn){
      const menu = dotsBtn.parentElement.querySelector('.kata-dots-menu');
      const wasOpen = menu.classList.contains('open');
      openMenus.forEach(m=>m.classList.remove('open'));
      if(!wasOpen){
        // position:fixed — والدین کے overflow:hidden (کارڈ کے گول کونوں کی
        // وجہ سے) سے مینو کبھی کٹتا نہیں تھا، لیکن دو بٹن ہونے پر مینو
        // کارڈ سے اونچا ہو کر نیچے والا بٹن (🗑 حذف کریں) چھپا دیتا تھا۔
        // اب مینو کی جگہ ہر بار "⋮" کی اصل اسکرین پوزیشن سے حساب کی جاتی
        // ہے، تو یہ کبھی کسی کارڈ کے اندر قید ہو کر نہیں کٹتا۔
        const rect = dotsBtn.getBoundingClientRect();
        menu.style.top = (rect.bottom + 4) + 'px';
        menu.style.left = rect.left + 'px';
        menu.classList.add('open');
        // اگر نیچے جگہ کم ہو تو مینو اوپر کی طرف کھلے، تاکہ اسکرین سے باہر
        // نہ نکلے۔
        requestAnimationFrame(()=>{
          const menuRect = menu.getBoundingClientRect();
          if(menuRect.bottom > window.innerHeight){
            menu.style.top = Math.max(4, rect.top - menuRect.height - 4) + 'px';
          }
          if(menuRect.right > window.innerWidth){
            menu.style.left = Math.max(4, window.innerWidth - menuRect.width - 4) + 'px';
          }
        });
      }
    } else if(!e.target.closest('.kata-dots-menu')){
      openMenus.forEach(m=>m.classList.remove('open'));
    }
  });
}

  kataEntriesUnsub = kataCol().doc(id).collection('entries').orderBy('createdAt','asc').onSnapshot(snap=>{
    kataOpenEntries = snap.docs.map(d=>({id:d.id, ...d.data()}));
    // اگر صارف ابھی نئی انٹری کے فارم میں ٹائپ کر رہا ہے (Discount/Profit/
    // Price/T CTN/کرایہ/Jamah وغیرہ)، تو یہاں مکمل ری بلڈ نہ ہو — ورنہ ابھی
    // لکھی گئی، ابھی تک محفوظ نہ کی گئی قدریں 0 پر ری سیٹ ہو جائیں گی۔ ٹائپنگ
    // ختم (blur) ہوتے ہی نیچے والا listener خود بخود تازہ ترین ڈیٹا سے ایک
    // بار ری بلڈ کر دے گا۔
    const active = document.activeElement;
    const typingHere = active && active.closest && active.closest('#kataNewEntryCard');
    if(typingHere){ kataEntriesPendingRerender = true; return; }
    kataRenderDetail(name);
  }, err=>{
    console.warn('kata entries listener error', err);
  });
  const detailContainer = document.getElementById('kataDetailContainer');
  if(detailContainer && !detailContainer.dataset.kataBlurCatchupWired){
    detailContainer.dataset.kataBlurCatchupWired = '1';
    detailContainer.addEventListener('focusout', ()=>{
      setTimeout(()=>{
        const stillTypingHere = document.activeElement && document.activeElement.closest && document.activeElement.closest('#kataNewEntryCard');
        if(kataEntriesPendingRerender && !stillTypingHere){
          kataEntriesPendingRerender = false;
          kataRenderDetail(kataOpenName);
        }
      }, 0);
    });
  }
}

function kataFormatWhen(ts){
  // Firestore Timestamp -> "10/8/2026, 6:30 PM"; falls back gracefully
  // while serverTimestamp() is still resolving (shows "…ابھی" briefly).
  // Local mode stores a plain ISO string instead, handled here too.
  let d;
  if(ts && typeof ts.toDate === 'function') d = ts.toDate();
  else if(typeof ts === 'string') d = new Date(ts);
  if(!d || isNaN(d.getTime())) return '...ابھی';
  return d.toLocaleDateString('en-GB') + '، ' + d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
}

// کھاتہ کھلتے ہی خودکار اتنا نیچے سکرول کریں کہ پچھلی محفوظ شدہ انٹری کا
// بقایا/پرنٹ بٹن بھی نظر آئیں اور نئی انٹری کا حصہ بھی ایک ساتھ نظر آ جائے
// (2026-08-30، صارف کی درخواست پر) — صرف کھاتہ پہلی بار کھلتے وقت، ہر بار
// ڈیٹا اپڈیٹ ہونے پر دوبارہ سکرول نہیں ہوتا (kataRenderDetail خود اس فنکشن
// کو نہیں بلاتا، صرف kataOpen/kataLocalOpen بلاتے ہیں)۔
function kataScrollToNewEntryBoundary(){
  requestAnimationFrame(()=>{
    const newEntryCard = document.getElementById('kataNewEntryCard');
    if(!newEntryCard) return; // بند (closed) کھاتے میں نیا انٹری فارم نہیں ہوتا
    const rect = newEntryCard.getBoundingClientRect();
    const targetY = window.scrollY + rect.top - 90; // پچھلی انٹری کا آخری حصہ (Bqaya/پرنٹ بٹن) اوپر نظر آنے کے لیے تھوڑی جگہ چھوڑی
    window.scrollTo({top: Math.max(targetY, 0), behavior:'auto'});
  });
}

function kataRenderDetail(name){
  const container = document.getElementById('kataDetailContainer');
  if(!container) return;

  // ہر بار کھاتہ کھلنے/دوبارہ بننے پر ریٹ لسٹ B سے تازہ ترین Items/Weight/
  // Rate کھینچ لیتے ہیں — پہلے یہ صرف اسی وقت تازہ ہوتا تھا جب تبدیلی کے
  // وقت کھاتہ پہلے سے کھلا ہو؛ اگر تبدیلی ریٹ لسٹ ٹیب پر کی گئی ہو اور
  // کھاتہ بعد میں کھولا جائے تو یہ یقینی بناتا ہے کہ پرانا نام/وزن کبھی
  // نظر نہ آئے۔
  if(typeof syncKataItemsFromRateList === 'function') syncKataItemsFromRateList();

  const lastEntry = kataOpenEntries.length ? kataOpenEntries[kataOpenEntries.length-1] : null;
  // اگلی انٹری کا "Sabka" ہمیشہ پچھلی انٹری کے "Bqaya" (Total منفی Jamah —
  // یعنی جو رقم واقعی ابھی تک باقی/واجب الادا ہے) سے چلنا چاہیے، نہ کہ
  // "Total" سے (جو Jamah/ادائیگی کو نظرانداز کر دیتا تھا) — اسی وجہ سے
  // نئی انٹری کا Sabka، پچھلی انٹری کے Bqaya سے مختلف/زیادہ نظر آ رہا تھا
  // (2026-08-23 صارف کی نشاندہی پر ٹھیک کیا گیا)۔
  const prevTotal = lastEntry ? (lastEntry.bqaya || lastEntry.total) : Object.assign({}, (kataOpenCarryForward || {t:0, price:0, profit:0, td:0}), {t: 0, profit: 0});
  // ↑ نئے مہینے کے کھاتے کی پہلی انٹری میں "سابقہ" کے CTN اور Profit ہمیشہ
  // 0 سے شروع ہوں (چاہے carryForward میں کچھ بھی محفوظ ہو) — یہ صرف اسی
  // مہینے کے اعداد و شمار ہیں، رقم/بقایا کی طرح اگلے مہینے آگے نہیں چلتے،
  // صرف Price/Discount ہی اصل بقایا ہیں (2026-09-01، صارف کی درخواست پر)۔
  const prevSaleMahana = lastEntry ? lastEntry.saleMahana : null;
  const prevSalesman = lastEntry ? (lastEntry.salesman || '') : '';
  // ہر آئٹم کا اپنا Sabka CTN/Total CTN (سیلزمین/ربنواز only، Discount کالم
  // کی طرح) — پچھلی محفوظ شدہ انٹری کے اسی آئٹم کے totalT سے چلتا ہے، نئے
  // کھاتے/مہینے کے آغاز پر lastEntry نہ ہونے کی وجہ سے خودکار 0 سے شروع ہو
  // جاتا ہے (موجودہ مہینہ-اختتام/close نظام سے مطابقت رکھتا ہے، الگ سے کوئی
  // نئی rollover منطق درکار نہیں)۔
  // Discount بھی اب اسی طرح "چپکنے والا" ہے (2026-08-22، صارف کی درخواست
  // پر) — ہر نئی انٹری پر خودکار 0 پر ری سیٹ ہونے کی بجائے پچھلی انٹری میں
  // اسی آئٹم پر جو Discount لکھا گیا تھا، وہی نئی انٹری میں پہلے سے بھرا
  // آئے گا — جب تک صارف خود تبدیل نہ کرے۔
  // Weight بھی اب "چپکنے والا" ہے (2026-08-23، صارف کی درخواست پر) — پہلے
  // ہر نئی انٹری میں ریٹ لسٹ کی موجودہ قدر پر ری سیٹ ہو جاتا تھا، چاہے
  // صارف نے پچھلی انٹری میں خود کوئی مختلف Weight ٹائپ کیا ہو۔ اب پچھلی
  // انٹری میں جو Weight لکھا گیا تھا، وہی نئی انٹری میں پہلے سے بھرا آئے
  // گا — جب تک صارف خود تبدیل نہ کرے۔
  // کرایہ بھی اسی طرح "چپکنے والا" ہے (2026-08-27، صارف کی درخواست پر) —
  // ہر الگ کھاتے (Agency میں ہر کارٹن دار) کی اپنی فی کارٹن کرایہ الگ الگ
  // محفوظ رہے، اگلی نئی انٹری میں خودکار وہی نظر آئے، جب تک صارف خود
  // تبدیل نہ کرے۔
  const prevItemData = {};
  KATA_ITEMS.forEach(item=>{
    const v = lastEntry && lastEntry.items && lastEntry.items[item.key];
    prevItemData[item.key] = {totalT: (v && v.totalT) || 0, discount: (v && v.discount) || 0, weight: (v && v.weight != null) ? v.weight : null, krayaRate: (v && v.krayaRate) || 0, commissionRate: (v && v.commissionRate) || 0};
  });

  let html = `<div class="card" style="text-align:center;">${kataDotsMenuHtml([{cls:'kata-close-book-btn', label:'📅 یہ ریکارڈ محفوظ کر کے نیا مہینہ شروع کریں'}, {cls:'kata-book-delete-btn', label:'🗑 یہ کھاتہ حذف کریں'}])}<h2 style="border:none;margin:0;">${kataEscape(name)}${kataOpenClosed ? ' 🔒' : ''}</h2></div>`;

  kataOpenEntries.forEach((entry, i)=>{
    const isLast = i === kataOpenEntries.length - 1;
    html += kataRenderEntryCard(entry, isLast, i);
  });

  // بند/تالے والا کھاتہ اب بھی نئی (پرانی تاریخ والی) انٹری قبول کرتا ہے —
  // اوپر تاریخ کے خانے سے۔ خودکار/دستی مہینہ بندش پر انحصار کیے بغیر صارف
  // خود کنٹرول رکھ سکے (2026-09-01، صارف کی درخواست پر)۔ اب یہ پاس ورڈ سے
  // محفوظ ہے (اسی دن کی بعد کی درخواست پر) — پاس ورڈ کے بغیر نیا فارم نظر
  // ہی نہیں آتا، غلطی سے پرانی مکمل شدہ انٹری چھیڑی نہ جا سکے۔
  const kataClosedFormUnlocked = kataOpenClosed && kataUnlockedClosedBookIds.has(kataOpenId);
  if(kataOpenClosed && !kataClosedFormUnlocked){
    html += `<div class="card" style="text-align:center;">
      <div class="note" style="margin-bottom:8px;">یہ کھاتہ بند ہو چکا ہے — نئی (پرانی تاریخ کی) انٹری شامل کرنے کے لیے پاس ورڈ درکار ہے۔</div>
      <button type="button" id="kataClosedUnlockBtn" class="lock-btn">🔒 نئی انٹری کے لیے پاس ورڈ درج کریں</button>
    </div>`;
  } else {
    if(kataOpenClosed){
      html += '<div class="card"><div class="note" style="text-align:center;">یہ کھاتہ بند ہو چکا ہے — نیچے تاریخ کا خانہ بھر کر پرانی تاریخ کی انٹری اب بھی شامل کی جا سکتی ہے۔</div></div>';
    }
    html += kataRenderNewEntryForm(prevTotal, prevSaleMahana, prevSalesman, kataOpenEntries.length === 0, prevItemData);
  }

  // نئی انٹری کے بلکل نیچے: اگر اسی نام کے پرانے (بند شدہ، پچھلے مہینے کے)
  // کھاتے کا ڈبہ موجود ہو تو وہ یہاں بھی دکھائیں — بالکل اسی طرح جیسے
  // کھاتوں کی فہرست میں دکھتا ہے (آخری انٹری کی تاریخ + نام + 🔒) — تاکہ
  // اسی کھاتے کے اندر سے پرانا/بند کھاتہ کھولا جا سکے (2026-09-01، صارف کی
  // درخواست پر)۔ صرف کھلے (غیر بند) کھاتے پر دکھتا ہے، چونکہ بند کھاتے میں
  // خود کوئی "نئی انٹری" موجود نہیں۔
  let prevClosedBook = null;
  if(!kataOpenClosed){
    const baseName = name.replace(/ - \d{4}-\d{2}$/, '');
    if(baseName !== name){
      const siblingBooks = kataLocalGetBooks();
      prevClosedBook = siblingBooks.find(b => b.name === baseName && b.closed && b.id !== kataOpenId) || null;
    }
  }
  if(prevClosedBook){
    const prevEntries = kataLocalGetEntries(prevClosedBook.id);
    const prevLastEntry = prevEntries.length ? prevEntries[prevEntries.length-1] : null;
    const prevLastEntryDate = prevLastEntry ? kataEntryDateOnly(prevLastEntry.createdAt) : null;
    html += `<div class="card" style="cursor:pointer;text-align:center;" data-kata-prev-closed-book-id="${prevClosedBook.id}" data-kata-prev-closed-book-name="${kataEscape(prevClosedBook.name)}">${prevLastEntryDate ? `<div class="note" style="text-align:center;font-size:11px;margin-bottom:2px;">آخری انٹری: ${prevLastEntryDate.toLocaleDateString('en-GB')}</div>` : ''}<h2 style="border:none;margin:0;font-size:18px;">${kataEscape(prevClosedBook.name)} 🔒</h2></div>`;
  }

  container.innerHTML = html;
  kataApplyIndianFormattingToReadonly(container);
  kataApplyPrintButtonVisibility(container);

  if(!kataOpenClosed || kataClosedFormUnlocked){
    const saveBtn = document.getElementById('kataSaveEntryBtn');
    if(saveBtn) saveBtn.addEventListener('click', ()=> kataSaveEntry(prevTotal, prevSaleMahana, prevItemData));
    kataWireLiveFormulas(prevTotal, prevItemData);
  }
  const closedUnlockBtn = document.getElementById('kataClosedUnlockBtn');
  if(closedUnlockBtn){
    closedUnlockBtn.addEventListener('click', ()=>{
      siteTextPrompt('پاس ورڈ درج کریں', function(pw){
        if(pw === null) return;
        if(pw === KATA_CLOSED_ENTRY_PASSWORD){
          kataUnlockedClosedBookIds.add(kataOpenId);
          kataRenderDetail(kataOpenName);
        } else {
          alert('غلط پاس ورڈ۔');
        }
      });
    });
  }

  const bookDelBtn = container.querySelector('.kata-book-delete-btn');
  if(bookDelBtn) bookDelBtn.addEventListener('click', ()=> kataDeleteWholeBook(name));
  const bookCloseBtn = container.querySelector('.kata-close-book-btn');
  if(bookCloseBtn) bookCloseBtn.addEventListener('click', ()=> kataManualCloseBook(name));

  container.querySelectorAll('.kata-delete-entry-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> kataDeleteEntry());
  });
  container.querySelectorAll('.kata-rename-entry-name-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> kataEditLastEntrySalesman());
  });
  container.querySelectorAll('.kata-print-entry-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> kataPrintEntry(btn));
  });
  container.querySelectorAll('[data-kata-entry-jamah]').forEach(input=>{
    input.addEventListener('input', ()=> kataOnEntryJamahInput(input, container));
    kataWireJamahFormatting(input);
  });
  container.querySelectorAll('[data-kata-entry-jamah-t]').forEach(input=>{
    input.addEventListener('input', ()=> kataOnEntryJamahTInput(input, container));
    kataWireJamahFormatting(input);
  });
  container.querySelectorAll('[data-kata-entry-jamah-profit]').forEach(input=>{
    input.addEventListener('input', ()=> kataOnEntryJamahProfitInput(input, container));
    kataWireJamahFormatting(input);
  });
  container.querySelectorAll('[data-kata-entry-jamah-discount]').forEach(input=>{
    input.addEventListener('input', ()=> kataOnEntryJamahDiscountInput(input, container));
    kataWireJamahFormatting(input);
  });
  const prevClosedBookCard = container.querySelector('[data-kata-prev-closed-book-id]');
  if(prevClosedBookCard){
    prevClosedBookCard.addEventListener('click', ()=>{
      kataLocalOpen(prevClosedBookCard.dataset.kataPrevClosedBookId, prevClosedBookCard.dataset.kataPrevClosedBookName);
      kataScrollToNewEntryBoundary();
    });
  }
}

// پرانی (پہلے سے محفوظ) انٹریوں کے Jamah خانوں میں تبدیلی — صرف اسی
// انٹری کا Bqaya از خود دوبارہ حساب ہوتا ہے (Sabka ہمیشہ Total سے چلتا
// ہے، Jamah سے نہیں، اس لیے یہ کبھی بھی بعد کی انٹریوں کو متاثر نہیں
// کرتا)، پھر مقامی/کلاؤڈ دونوں جگہ محفوظ ہو جاتا ہے۔
let kataEntryJamahSaveTimer = null;
function kataOnEntryJamahInput(input, container){
  const [idxStr, whichStr] = input.dataset.kataEntryJamah.split(':');
  const idx = Number(idxStr), which = Number(whichStr);
  const entry = kataOpenEntries[idx];
  if(!entry) return;
  entry.jamah = entry.jamah || {price:[0,0]};
  entry.jamah.price[which] = kataParseNum(input.value);
  const totPrice = (entry.total && entry.total.price) || 0;
  entry.bqaya = entry.bqaya || {};
  entry.bqaya.price = totPrice - ((entry.jamah.price[0]||0) + (entry.jamah.price[1]||0));
  const bqayaEl = container.querySelector(`[data-kata-entry-bqaya="${idx}"]`);
  if(bqayaEl) bqayaEl.textContent = entry.bqaya.price;
  clearTimeout(kataEntryJamahSaveTimer);
  kataEntryJamahSaveTimer = setTimeout(()=> kataSaveEditedEntry(idx), 500);
}
// اسی طرح CTN والا Jamah بھی — بالکل Price والے Bqaya جیسا۔
function kataOnEntryJamahTInput(input, container){
  const [idxStr, whichStr] = input.dataset.kataEntryJamahT.split(':');
  const idx = Number(idxStr), which = Number(whichStr);
  const entry = kataOpenEntries[idx];
  if(!entry) return;
  entry.jamah = entry.jamah || {price:[0,0]};
  entry.jamah.t = entry.jamah.t || [0,0];
  entry.jamah.t[which] = kataParseNum(input.value);
  const totT = (entry.total && entry.total.t) || 0;
  entry.bqaya = entry.bqaya || {};
  entry.bqaya.t = totT - ((entry.jamah.t[0]||0) + (entry.jamah.t[1]||0));
  const bqayaEl = container.querySelector(`[data-kata-entry-bqaya-t="${idx}"]`);
  if(bqayaEl) bqayaEl.textContent = entry.bqaya.t;
  clearTimeout(kataEntryJamahSaveTimer);
  kataEntryJamahSaveTimer = setTimeout(()=> kataSaveEditedEntry(idx), 500);
}
function kataSaveEditedEntry(idx){
  const entry = kataOpenEntries[idx];
  if(!entry) return;
  if(kataLocalMode){
    kataLocalSaveEntries(kataOpenId, kataOpenEntries);
  } else if(entry.id){
    kataCol().doc(kataOpenId).collection('entries').doc(entry.id).update({
      jamah: entry.jamah,
      bqaya: entry.bqaya,
    }).catch(err=> console.warn('kata entry jamah save failed', err));
  }
}

// اسی طرح Discount والا Jamah بھی — صرف اسی وقت جب یہ کھاتہ Discount دکھاتا
// ہو (سیلزمین/ربنواز)۔ Bqaya Discount اسی انٹری کے Total Discount میں سے

// Captures just the tapped entry's own card as one PDF page and hands it to
// the same native-share pipeline the ریٹ لسٹ share button already uses —
// opens the OS share sheet (WhatsApp, Gmail, any app) directly.
// Takes the CLICKED BUTTON itself (not an id) and walks up to its own
// containing .kata-entry-card — this is the fix for a real bug: the old
// id-based lookup fell back to `document.querySelector('.kata-entry-card')`
// (always the FIRST card) whenever an entry's id was missing/didn't match,
// so printing entry #2 silently printed entry #1 instead. Targeting the
// button's own ancestor card can never point at the wrong entry.
async function kataPrintEntry(btn){
  const card = btn.closest('.kata-entry-card');
  if(!card) return;
  const originalLabel = btn.textContent;
  btn.textContent = '⏳...'; btn.disabled = true;
  const actions = card.querySelector('.kata-entry-actions');
  const prevDisplay = actions ? actions.style.display : '';
  if(actions) actions.style.display = 'none'; // don't capture the print/delete buttons themselves
  // نام کے ساتھ Agency کا ✏️ (نام درست کرنے کا) بٹن بھی پرنٹ/PDF میں کبھی
  // نظر نہ آئے — موبائل اور کمپیوٹر دونوں پرنٹ میں (2026-09-01، صارف کی
  // درخواست پر)۔
  const renameBtn = card.querySelector('.kata-rename-entry-name-btn');
  const renameBtnPrevDisplay = renameBtn ? renameBtn.style.display : '';
  if(renameBtn) renameBtn.style.display = 'none';
  let inputSwaps = [];
  let hiddenPrintCells = [];
  // سیلزمین اور ربنواز دونوں کھاتوں — پرنٹ سے وہی 5 کالمز (Rate، Profit،
  // Discount، D.Total، Sabka CTN) اور ٹوٹلز باکس کے CTN/Discount کالمز
  // ہمیشہ کی طرح غائب رہیں (2026-08-25 کو واپس بحال کیا گیا — صارف نے
  // وضاحت کی کہ کالمز نہیں بدلنے تھے، صرف خانوں کا سائز چھوٹا/کمپیکٹ
  // چاہیے تھا)۔ یہ صرف پرنٹ/PDF پر اثر انداز ہوتا ہے، خود ویب سائٹ پر یہ
  // کالمز ویسے ہی نظر آتے رہیں گے۔
  if(kataInstance === 'salesman' || kataInstance === 'ribnawaz'){
    const itemTable = card.querySelector('.wide-table table');
    if(itemTable){
      [5,7,9,10,11].forEach(pos=>{
        itemTable.querySelectorAll(`tr > *:nth-child(${pos})`).forEach(cell=>{
          hiddenPrintCells.push({cell, prev: cell.style.display});
          cell.style.display = 'none';
        });
        itemTable.querySelectorAll(`colgroup > col:nth-child(${pos})`).forEach(col=>{
          hiddenPrintCells.push({cell: col, prev: col.style.display});
          col.style.display = 'none';
        });
      });
    }
    const totalsTable = card.querySelector('.edit-table:not(.wide-table) table');
    if(totalsTable){
      [2,5].forEach(pos=>{
        totalsTable.querySelectorAll(`tr > *:nth-child(${pos})`).forEach(cell=>{
          hiddenPrintCells.push({cell, prev: cell.style.display});
          cell.style.display = 'none';
        });
      });
    }
  }
  // Agency کھاتہ — "کمیشن" کے دونوں کالم (ریٹ + ٹوٹل) اور "کل کمیشن" باکس
  // پرنٹ/PDF میں کبھی نظر نہ آئیں (صارف کی واضح درخواست، 2026-08-30) — یہ
  // صرف اندرونی/ذاتی ریکارڈ کے لیے ہے، ویب سائٹ پر ہمیشہ کی طرح نظر آتے
  // رہیں گے۔
  if(kataInstance === 'agency'){
    card.querySelectorAll('.kata-commission-col').forEach(el=>{
      hiddenPrintCells.push({cell: el, prev: el.style.display});
      el.style.display = 'none';
    });
  }
  // پہلے یہاں ٹیبل کو مکمل چوڑا (max-content) کر کے کھینچا جاتا تھا کیونکہ
  // موبائل پر چوڑی ٹیبل دیکھنے کے لیے سائیڈ سکرول کرنی پڑتی تھی اور
  // html2canvas صرف نظر آنے والا حصہ کھینچتا تھا۔ اب ٹیبل fixed layout کی
  // وجہ سے پہلے ہی مکمل اسکرین میں فٹ ہے (کوئی سکرول نہیں) — اسی موجودہ
  // حالت میں کھینچنا اب زیادہ درست ہے، ورنہ پرنٹ ویب سائٹ سے مختلف نظر آتا۔
  try{
    card.classList.add('kata-print-tight'); // صرف پرنٹ کے وقت — کیپچر کے بعد نیچے finally میں ہٹا دیا جاتا ہے، ویب سائٹ پر کبھی نظر نہیں آتا
    // صرف "کمپیوٹر پرنٹ" کیپچر کے وقت "BEST" واٹر مارک بھی عارضی طور پر
    // چھپا دیتے ہیں (html2canvas سے پہلے، ورنہ تصویر میں آ جاتا) — موبائل
    // پرنٹ اور ویب سائٹ متاثر نہیں ہوتے (2026-09-01، صارف کی درخواست پر)۔
    if(btn.dataset.printMode === 'computer') card.classList.add('kata-print-no-watermark');
    try{ await document.fonts.ready; } catch(e){ /* proceed anyway */ }
    if(typeof window.measureAndSizeInput === 'function'){
      card.querySelectorAll('.cell-input').forEach(window.measureAndSizeInput);
    }
    // html2canvas خود input خانوں کے اندر کا متن قابلِ اعتماد طریقے سے
    // نہیں کھینچتا (Jamah جیسے خانے پرنٹ میں خالی رہ جاتے تھے، چاہے قدر
    // موجود ہو) — پہلے صرف "value" attribute تازہ کرنے کی کوشش کی تھی، وہ
    // کافی نہیں تھا۔ اب مکمل حل: کھینچنے سے پہلے ہر input کو عارضی طور پر
    // اسی جیسے دکھنے والے ایک <span> سے بدل دیتے ہیں (جس میں براہِ راست
    // متن ہوتا ہے، جو html2canvas ہمیشہ درست کھینچتا ہے)، اور کھینچنے کے
    // بعد اصل input واپس لے آتے ہیں (2026-08-23 صارف کی نشاندہی پر)۔
    card.querySelectorAll('input').forEach(inp=>{
      const span = document.createElement('span');
      span.className = inp.className;
      const inlineStyle = inp.getAttribute('style') || '';
      span.setAttribute('style', inlineStyle + ';display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;');
      span.textContent = inp.value;
      inp.style.display = 'none';
      inp.parentNode.insertBefore(span, inp);
      inputSwaps.push({inp, span});
    });
    const cardRect = card.getBoundingClientRect(); // ویب سائٹ پر خانہ اصل میں کتنا "چھوٹا" نظر آتا ہے، اسی سائز کو پرنٹ کے لیے بنیاد بنائیں گے
    const canvas = await html2canvas(card, {scale:3, backgroundColor:'#F4EFE2', useCORS:true});
    inputSwaps.forEach(({inp, span})=>{ span.remove(); inp.style.display = ''; });
    inputSwaps = [];
    if(typeof jspdf === 'undefined' || !jspdf.jsPDF) throw new Error('jsPDF-not-loaded');
    const { jsPDF } = jspdf;
    const imgData = canvas.toDataURL('image/png');
    // پرنٹر کا پرنٹ ڈائیلاگ عام طور پر ہمیشہ Portrait کاغذ فرض کرتا ہے —
    // پہلے یہاں کھاتے کی چوڑی ٹیبل کے مطابق PDF کا صفحہ بھی چوڑا (landscape)
    // بنایا جاتا تھا، جس کی وجہ سے پرنٹر پر کاغذ الٹی/پسیلی (sideways) نکل
    // رہا تھا۔ اب صفحہ ہمیشہ سیدھا (Portrait، A4) رکھتے ہیں۔
    const pdf = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 22; // صارف کی درخواست (2026-08-26): سائز مزید بڑا کرنے کے لیے مارجن کم کیا (34→22)
    // صارف کی درخواست (2026-08-25): پرنٹ کو زبردستی بڑا کر کے صفحہ بھرنے
    // کی بجائے، بالکل اسی چھوٹے/کمپیکٹ سائز میں رکھیں جیسے ویب سائٹ پر
    // (فون سکرین پر) نظر آتا ہے — اسی لیے html2canvas کی اندرونی 3x
    // ریزولیوشن کو یہاں الٹا (÷3) کر کے کارڈ کے اصل CSS پکسل سائز پر واپس
    // لے آتے ہیں (1 پکسل ≈ 0.75pt)، صفحہ نہیں بھرتے — نیچے خالی جگہ رہے
    // گی، وہی مقصود ہے۔
    const pxToPt = 0.75;
    let drawW = cardRect.width * pxToPt;
    let drawH = cardRect.height * pxToPt;
    // صارف کی درخواست (2026-08-26): چوڑائی مزید بڑھائیں (خانے کچھ چوڑے
    // ہوں)، چاہے لمبائی نیچے کی طرف تھوڑی مزید بڑھ جائے — اب چوڑائی کو
    // پورا صفحہ استعمال کرنے کی بنیاد بنایا ہے۔
    const availW = pageW - margin*2;
    const availH = pageH - margin*2;
    // صارف کی درخواست (2026-08-29): "کمپیوٹر پرنٹ" بٹن کے لیے صفحے کا صرف
    // ایک تہائی (1/3) حصہ استعمال ہو (پہلے 1/2 رکھا گیا تھا، بعد میں 1/3
    // کر دیا گیا) — "موبائل پرنٹ" بٹن پرانی مکمل-صفحہ-بھرنے والی حالت پر
    // ہی قائم رہتا ہے۔
    const isComputerPrint = btn.dataset.printMode === 'computer';
    const printAvailH = isComputerPrint ? (availH / 3) : availH;
    const sizeBoost = 1.12; // صارف کی درخواست (2026-08-26): پورے صفحے کی چوڑائی بھرنے کے بعد بھی مجموعی سائز تھوڑا مزید بڑا کریں
    let safetyScale = (availW / drawW) * sizeBoost;
    if(drawH * safetyScale > printAvailH){
      // لمبی انٹریوں کے لیے حفاظتی حد — تاکہ صفحے کی لمبائی سے تجاوز نہ ہو اور نیچے کا حصہ کٹے نہیں
      safetyScale = printAvailH / drawH;
    }
    drawW *= safetyScale;
    drawH *= safetyScale;
    // صارف کی درخواست (2026-08-26): چھوٹی انٹریوں میں نیچے خالی جگہ بچ
    // جاتی تھی — اب لمبائی کو بھی مطلوبہ اونچائی (مکمل یا نصف صفحہ) تک
    // کھینچ دیتے ہیں (چوڑائی وہی رہتی ہے) تاکہ خالی جگہ نہ رہے۔
    if(drawH < printAvailH){
      drawH = printAvailH;
    }
    pdf.addImage(imgData, 'PNG', (pageW - drawW)/2, margin, drawW, drawH);
    const blob = pdf.output('blob');
    if(!blob) throw new Error('no-blob');
    // دو الگ پرنٹ بٹن (2026-08-29): "کمپیوٹر پرنٹ" بٹن پر ہمیشہ سیدھا
    // براؤزر کا پرنٹ ڈائیلاگ کھلے (چاہے فون سے ہی کیوں نہ کھولا جائے)،
    // اور "موبائل پرنٹ" بٹن پرانی خودکار طرزِ عمل (ڈیوائس چیک کر کے فون پر
    // Share شیٹ، کمپیوٹر پر پرنٹ ڈائیلاگ) پر قائم رہے۔
    if(btn.dataset.printMode === 'computer'){
      printPdfBlob(blob);
    } else {
      await sharePdfDirectly(blob, 'Best Excel Washing powder.pdf', 'کھاتہ انٹری');
    }
  } catch(err){
    alert('PDF بنانے میں مسئلہ ہوا، دوبارہ کوشش کریں۔');
    console.warn(err);
  } finally {
    card.classList.remove('kata-print-tight');
    card.classList.remove('kata-print-no-watermark');
    inputSwaps.forEach(({inp, span})=>{ span.remove(); inp.style.display = ''; }); // اگر html2canvas سے پہلے ہی کوئی خرابی آئی ہو تو بھی inputs واپس آ جائیں
    hiddenPrintCells.forEach(({cell, prev})=>{ cell.style.display = prev; }); // چھپائے گئے کالمز ویب سائٹ پر واپس دکھا دیں
    if(actions) actions.style.display = prevDisplay;
    if(renameBtn) renameBtn.style.display = renameBtnPrevDisplay;
    btn.textContent = originalLabel; btn.disabled = false;
  }
}

// Deletes one saved entry (for fixing a mistaken انٹری). Only ever offered
// on the BOTTOM-MOST entry (see kataRenderEntryCard's isLast param) since
// every entry's Sabka carries forward from the one before it — deleting a
// middle/top entry would break that running-total chain for everything
// after it. Confirms first since this can't be undone.
// Agency کھاتہ — صارف کی درخواست پر (2026-08-28): آخری محفوظ شدہ انٹری کے
// نام میں غلطی درست کرنے کا آپشن (صرف Agency میں، صرف آخری انٹری پر —
// حذف بٹن کی طرح)۔
function kataEditLastEntrySalesman(){
  siteTextPrompt('نیا نام لکھیں', function(newName){
    if(!newName || !newName.trim()) return;
    const trimmed = newName.trim();
    if(kataLocalMode){
      const entries = kataLocalGetEntries(kataOpenId);
      const last = entries[entries.length - 1];
      if(!last) return;
      last.salesman = trimmed;
      kataLocalSaveEntries(kataOpenId, entries);
      kataOpenEntries = entries;
      kataRenderDetail(kataOpenName);
    } else {
      const last = kataOpenEntries[kataOpenEntries.length - 1];
      if(!last || !last.id) return;
      kataCol().doc(kataOpenId).collection('entries').doc(last.id).update({salesman: trimmed}).catch(err=>{
        alert('نام تبدیل کرنے میں مسئلہ ہوا — دوبارہ کوشش کریں۔');
        console.warn(err);
      });
    }
  });
}

async function kataDeleteEntry(){
  if(!confirm('کیا آپ واقعی یہ انٹری حذف کرنا چاہتے ہیں؟ یہ واپس نہیں ہو سکتا۔')) return;
  if(kataLocalMode){
    const entries = kataLocalGetEntries(kataOpenId);
    entries.pop(); // delete is only ever offered on the last entry, so just drop it — no id matching needed (older entries may lack one)
    kataLocalSaveEntries(kataOpenId, entries);
    kataOpenEntries = entries;
    kataRenderDetail(kataOpenName);
  } else {
    const last = kataOpenEntries[kataOpenEntries.length - 1];
    if(!last || !last.id) return;
    try{
      await kataCol().doc(kataOpenId).collection('entries').doc(last.id).delete();
      // Firestore's onSnapshot listener (see kataOpen) picks up the
      // deletion automatically and re-renders — nothing more to do here.
    } catch(err){
      alert('انٹری حذف کرنے میں مسئلہ ہوا — دوبارہ کوشش کریں۔');
      console.warn(err);
    }
  }
}

// موجودہ کھلا کھاتہ صارف کی اپنی مرضی سے فوراً بند کر کے (پرانے مہینے کے
// ریکارڈ کے طور پر ہمیشہ کے لیے محفوظ، مزید پرانی تاریخ کی انٹریز بھی قبول
// کرتا رہتا ہے) اس کا آخری Bqaya نئے کھاتے میں بطور Sabka منتقل کر کے نیا
// مہینہ خود شروع کر دیتا ہے — بالکل وہی کام جو مہینہ خودکار بدلنے پر
// kataCheckMonthRolloverLocal کرتا ہے، بس یہاں صارف کی مرضی سے، فوری طور
// پر (سرف کا ماہانہ حساب کے msManualCloseBook جیسا، صارف کی درخواست
// 2026-09-01 پر کھاتہ میں بھی شامل کیا گیا)۔ ڈیٹا کچھ بھی حذف نہیں ہوتا۔
function kataManualCloseBook(name){
  if(!confirm(`"${name || '(بلا نام)'}" کو اب بند کر کے نیا مہینہ شروع کیا جائے؟ موجودہ ریکارڈ محفوظ رہے گا (دیکھا جا سکے گا، اور چاہیں تو پرانی تاریخ کی مزید انٹری بھی شامل کی جا سکے گی)، اور اسی کا آخری Bqaya نئے کھاتے میں بطور Sabka چلا جائے گا۔`)) return;
  const books = kataLocalGetBooks();
  const book = books.find(b=>b.id===kataOpenId);
  if(!book || book.closed) return;
  const entries = kataLocalGetEntries(book.id);
  const lastEntry = entries.length ? entries[entries.length-1] : null;
  const finalTotal = lastEntry ? (lastEntry.bqaya || lastEntry.total) : (book.carryForward || {t:0, price:0, profit:0, td:0});
  // CTN اور Profit نئے مہینے میں 0 سے شروع — صرف Price/Discount اصل بقایا
  // رقم آگے چلتی ہے (اسی وجہ سے kataCheckMonthRolloverLocal میں بھی، دیکھیں
  // وہاں کا نوٹ)۔
  const carryForward = Object.assign({}, finalTotal, {t: 0, profit: 0});
  book.closed = true;
  const newBook = {
    id: 'k' + Date.now() + Math.random().toString(36).slice(2,7),
    name: (book.name || 'کھاتہ') + ' - ' + kataMonthKey(),
    createdAt: new Date().toISOString(),
    carryForward: carryForward,
  };
  books.push(newBook);
  kataLocalSaveBooks(books);
  kataShowList();
  kataLocalRenderList();
}

// Deletes the WHOLE currently-open کھاتہ (book) and every entry in it — for
// when the wrong book was opened by mistake. Accessible via the "⋮" menu
// in the detail view's header, then returns to the کھاتوں کی فہرست.
async function kataDeleteWholeBook(name){
  if(!confirm(`کیا آپ واقعی "${name || '(بلا نام)'}" کھاتہ مکمل طور پر حذف کرنا چاہتے ہیں؟ اس میں موجود تمام انٹریز بھی حذف ہو جائیں گی — یہ واپس نہیں ہو سکتا۔`)) return;
  if(kataLocalMode){
    const deletedId = kataOpenId;
    const remaining = kataLocalGetBooks().filter(x=>x.id !== deletedId);
    localStorage.setItem(kataLocalBooksKey(), JSON.stringify(remaining));
    if(window.firebaseSyncDeleteBook) window.firebaseSyncDeleteBook(kataLocalBooksKey(), deletedId, remaining);
    localStorage.removeItem(kataLocalEntriesKey(deletedId));
    kataShowList();
    kataLocalRenderList();
  } else {
    try{
      const entriesSnap = await kataCol().doc(kataOpenId).collection('entries').get();
      const batch = window.db.batch();
      entriesSnap.forEach(d=> batch.delete(d.ref));
      batch.delete(kataCol().doc(kataOpenId));
      await batch.commit();
      kataShowList(); // list re-renders itself via the onSnapshot listener
    } catch(err){
      alert('کھاتہ حذف کرنے میں مسئلہ ہوا — دوبارہ کوشش کریں۔');
      console.warn(err);
    }
  }
}

// رنگ کی مستقل یاد رکھنے کی سہولت: کسی خانے کا رنگ اسی انٹری کے ساتھ محفوظ
// ہو جاتا ہے (entry.cellColors) — صفحہ دوبارہ لوڈ ہونے یا فائل اپڈیٹ ہونے
// پر بھی رنگ اسی جگہ لگا رہتا ہے، چونکہ یہ خود انٹری کے ڈیٹا کا حصہ ہے۔
function kataColorStyleFor(cellColors, key){
  return (cellColors && cellColors[key]) ? `background-color:${cellColors[key]};` : '';
}

function kataRenderEntryCard(entry, isLast, idx){
  const showDiscount = kataShowDiscount();
  // Agency کھاتہ — صارف کی درخواست پر (2026-08-22) آئٹم ٹیبل سے Profit اور
  // T.Profit کالم بھی مکمل ہٹا دیے۔ صرف Agency میں، سیلزمین/ربنواز میں یہ
  // کالم ویسے ہی رہیں گے۔
  const agencySimple = kataInstance === 'agency';
  let rows = '';
  let sumT = 0;
  const cc = entry.cellColors || {};
  KATA_ITEMS.forEach((item, idx)=>{
    const v = (entry.items && entry.items[item.key]) || {t:0, price:0};
    if(!v.t && !v.price) return; // skip untouched rows to keep past entries compact
    // Z Net Bill کبھی "Total CTN" باکس میں شمار نہیں ہوتا — نئی انٹری فارم
    // (kataWireLiveFormulas/kataSaveEntry) میں تو یہ پہلے ہی خارج تھا، لیکن
    // یہاں محفوظ شدہ انٹری دکھانے والے sumT میں غلطی سے شامل ہو رہا تھا
    // (2026-09-01، صارف کی نشاندہی پر ٹھیک کیا گیا)۔
    const isZNetSum = item.key === 'znet1' || item.key === 'znet2';
    if(!isZNetSum) sumT += Number(v.t) || 0;
    // Older entries (saved before reference fields became per-row snapshots)
    // won't have v.rate/v.name/v.weight — fall back to today's KATA_ITEMS
    // values for those so old cards still render.
    const rate = (v.rate!=null) ? v.rate : item.rate;
    const prift = (v.prift!=null) ? v.prift : item.prift;
    const priftTotal = (v.priftTotal!=null) ? v.priftTotal : Math.round(prift * (Number(v.t)||0) * 100) / 100;
    const name = (v.name!=null && v.name!=='') ? v.name : item.name;
    const weight = (v.weight!=null) ? v.weight : item.weight;
    const nameColor = 'color:#1a1a1a;'; // Sabka/عام متن جیسا سیاہ — 2026-08-21 سے پہلے سرخ تھا
    const numClass = ' kata-num-readable'; // 2026-08-22: ربنواز/Agency میں بھی وہی چھوٹے 'ڈاٹ جیسے نظر آنے والے' نمبروں کی شکایت — اب تینوں کھاتوں میں لاگو
    const thinClass = ' kata-thin-text';
    const discountCells = showDiscount ? `
      <td style="${kataColorStyleFor(cc, item.key+'-discount')}"><span class="cell-val${numClass}">${v.discount||0}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-discounttotal')}"><span class="cell-val${numClass}">${v.discountTotal||0}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-sabkactn')}"><span class="cell-val${numClass}">${v.sabkaCtn||0}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-totalctn')}"><span class="cell-val${numClass}">${v.totalT||0}</span></td>` : '';
    const priftCells = agencySimple ? '' : `
      <td style="${kataColorStyleFor(cc, item.key+'-prift')}"><span class="cell-val${numClass}">${prift}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-totalprift')}"><span class="cell-val${numClass}">${priftTotal}</span></td>`;
    // Agency کھاتہ — صارف کی درخواست پر (2026-08-27): ہر آئٹم کی اپنی فی
    // کارٹن کرایہ اور ٹوٹل کرایہ (Discount/D.Total کی طرح)۔
    const krayaCells = agencySimple ? `
      <td style="${kataColorStyleFor(cc, item.key+'-krayarate')}" class="kata-krayarate-col"><span class="cell-val${numClass}">${v.krayaRate||0}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-krayatotal')}"><span class="cell-val${numClass}">${v.krayaTotal||0}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-commissionrate')}" class="kata-commission-col"><span class="cell-val${numClass}">${v.commissionRate||0}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-commissiontotal')}" class="kata-commission-col"><span class="cell-val${numClass}">${v.commissionTotal||0}</span></td>` : '';
    rows += `<tr>
      <td style="${kataColorStyleFor(cc, item.key+'-idx')}"><span class="cell-val${numClass}${thinClass}">${(v.idx != null && v.idx !== '') ? kataEscape(v.idx) : (idx+1)}</span></td>
      <td style="text-align:left;padding-left:6px;${nameColor}${kataColorStyleFor(cc, item.key+'-name')}"><span class="cell-val${numClass}${thinClass}">${kataEscape(name)}</span></td>
      <td class="kata-t-cell" style="${kataColorStyleFor(cc, item.key+'-t') || 'background-color:#d9f2d9;'}"><span class="cell-val${numClass}">${v.t}</span>${v.sabkaNote ? `<span style="font-size:6px;color:#8a6d00;margin-right:2px;">(${kataEscape(v.sabkaNote)})</span>` : ''}</td>
      <td style="${kataColorStyleFor(cc, item.key+'-weight')}"><span class="cell-val${numClass}">${kataEscape(kataDisplayWeight(weight))}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-rate')}"><span class="cell-val${numClass}">${rate}</span></td>
      <td style="${kataColorStyleFor(cc, item.key+'-totalrate')}"><span class="cell-val${numClass}">${v.price}</span></td>${priftCells}${krayaCells}${discountCells}
    </tr>`;
  });
  const entryDomId = `kataEntry_${entry.id || Math.random().toString(36).slice(2)}`;
  return `
    <div class="card kata-entry-card" id="${entryDomId}">
      ${isLast ? kataDotsMenuHtml([{cls:'kata-delete-entry-btn', label:'🗑 حذف کریں'}]) : ''}
      <div class="note" style="text-align:center;font-weight:400;">${kataFormatWhen(entry.createdAt)}</div>
      ${entry.salesman ? `<div class="note kata-entry-name-line" style="text-align:center;direction:ltr;unicode-bidi:embed;font-size:20px;font-weight:400;color:var(--maroon-deep);">${kataEscape(entry.salesman)}${(kataInstance === 'agency' && isLast) ? ` <button type="button" class="kata-rename-entry-name-btn" style="font-size:12px;background:none;border:1px solid var(--line);border-radius:4px;padding:1px 5px;cursor:pointer;">✏️</button>` : ''}</div>` : ''}
      <div class="kata-ref-title">Best Excel Washing powder</div>
      <div class="edit-table wide-table kata-ref-style">
        <table dir="ltr">
          <colgroup>${showDiscount
            ? '<col style="width:6%"><col style="width:11%"><col style="width:11%"><col style="width:8%"><col style="width:9%"><col style="width:12%"><col style="width:7%"><col style="width:10%"><col style="width:6%"><col style="width:8%"><col style="width:6%"><col style="width:6%">'
            : agencySimple
            ? '<col style="width:6%"><col style="width:14%"><col style="width:9%"><col style="width:9%"><col style="width:11%"><col style="width:12%"><col class="kata-krayarate-col" style="width:9%"><col style="width:10%"><col class="kata-commission-col" style="width:9%"><col class="kata-commission-col" style="width:11%">'
            : '<col style="width:6%"><col style="width:24%"><col style="width:10%"><col style="width:10%"><col style="width:11%"><col style="width:13%"><col style="width:11%"><col style="width:15%">'}</colgroup>
          <thead><tr><th>#</th><th>Items</th><th>CTN</th><th>Weight (gram)</th><th>Price</th><th>Total Price</th>${agencySimple ? '' : '<th>Profit</th><th>T.Profit</th>'}${agencySimple ? '<th class="kata-krayarate-col">Rent</th><th>T.Rent</th><th class="kata-commission-col">Commission Rate</th><th class="kata-commission-col">Commission</th>' : ''}${showDiscount ? '<th>Discount</th><th>D.Total</th><th>Sabka CTN</th><th>Total CTN</th>' : ''}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${kataInstance === 'salesman' ? `
      <div style="display:flex;margin-top:8px;border:1px solid var(--line);border-radius:3px;overflow:hidden;">
        <div style="flex:1;background:var(--paper-dark);padding:3px 1px;text-align:center;border-right:1px solid var(--line);">
          <div style="font-family:'Courier Prime',monospace;font-size:11px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${sumT}</div>
          <div style="font-size:7px;color:#5b5346;margin-top:1px;">Total CTN</div>
        </div>
        <div style="flex:1;background:var(--paper-dark);padding:3px 1px;text-align:center;border-right:1px solid var(--line);">
          <div style="font-family:'Courier Prime',monospace;font-size:11px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${(entry.today && entry.today.profit) || 0}</div>
          <div style="font-size:7px;color:#5b5346;margin-top:1px;">Total Profit</div>
        </div>
        <div style="flex:1;background:var(--paper-dark);padding:3px 1px;text-align:center;border-right:1px solid var(--line);">
          <div style="font-family:'Courier Prime',monospace;font-size:11px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${(entry.today && entry.today.price) || 0}</div>
          <div style="font-size:7px;color:#5b5346;margin-top:1px;">Total Price</div>
        </div>
        <div style="flex:1;background:var(--paper-dark);padding:3px 1px;text-align:center;border-right:1px solid var(--line);">
          <div style="font-family:'Courier Prime',monospace;font-size:11px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${(Number(entry.weightKg)||0).toFixed(2)}</div>
          <div style="font-size:7px;color:#5b5346;margin-top:1px;">وزن (kg)</div>
        </div>
        <div style="flex:1;background:var(--paper-dark);padding:3px 1px;text-align:center;">
          <div style="font-family:'Courier Prime',monospace;font-size:11px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${((Number(entry.weightKg)||0)/40).toFixed(2)}</div>
          <div style="font-size:7px;color:#5b5346;margin-top:1px;">وزن (من)</div>
        </div>
      </div>` : `
      <div style="display:flex;gap:10px;margin-top:8px;">${kataInstance === 'ribnawaz' ? `
        <div style="flex:1;background:var(--paper-dark);border:1px solid var(--line);border-radius:3px;padding:7px 5px;text-align:center;">
          <div style="font-family:'Courier Prime',monospace;font-size:17px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${entry.kharch||0}</div>
          <div style="font-size:11px;color:#5b5346;margin-top:2px;">خرچہ</div>
        </div>
        <div style="flex:1;background:var(--paper-dark);border:1px solid var(--line);border-radius:3px;padding:7px 5px;text-align:center;">
          <div style="font-family:'Courier Prime',monospace;font-size:17px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${entry.less||0}</div>
          <div style="font-size:11px;color:#5b5346;margin-top:2px;">Less</div>
        </div>` : `
        <div style="flex:1;background:var(--paper-dark);border:1px solid var(--line);border-radius:3px;padding:7px 5px;text-align:center;">
          <div style="font-family:'Courier Prime',monospace;font-size:17px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${entry.kharch||0}</div>
          <div style="font-size:11px;color:#5b5346;margin-top:2px;">Total Rent</div>
        </div>`}
        <div style="flex:1;background:var(--paper-dark);border:1px solid var(--line);border-radius:3px;padding:7px 5px;text-align:center;">
          <div style="font-family:'Courier Prime',monospace;font-size:17px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${sumT}</div>
          <div style="font-size:11px;color:#5b5346;margin-top:2px;">Total CTN</div>
        </div>${kataInstance === 'agency' ? `
        <div class="kata-commission-col" style="flex:1;background:var(--paper-dark);border:1px solid var(--line);border-radius:3px;padding:7px 5px;text-align:center;">
          <div style="font-family:'Courier Prime',monospace;font-size:17px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${kataIndianNumberFormat((entry.bqaya && entry.bqaya.commission) || (entry.total && entry.total.commission) || 0)}</div>
          <div style="font-size:11px;color:#5b5346;margin-top:2px;">Total Commission</div>
        </div>` : ''}
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <div style="flex:1;background:var(--paper-dark);border:1px solid var(--line);border-radius:3px;padding:7px 5px;text-align:center;">
          <div style="font-family:'Courier Prime',monospace;font-size:17px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${(Number(entry.weightKg)||0).toFixed(2)}</div>
          <div style="font-size:11px;color:#5b5346;margin-top:2px;">${kataInstance === 'agency' ? '<span dir="ltr" style="unicode-bidi:isolate;">Total Weight (kg)</span>' : 'کل وزن (کلوگرام)'}</div>
        </div>${kataInstance !== 'agency' ? `
        <div style="flex:1;background:var(--paper-dark);border:1px solid var(--line);border-radius:3px;padding:7px 5px;text-align:center;">
          <div style="font-family:'Courier Prime',monospace;font-size:17px;font-weight:400;color:var(--maroon-deep);direction:ltr;">${((Number(entry.weightKg)||0)/40).toFixed(2)}</div>
          <div style="font-size:11px;color:#5b5346;margin-top:2px;">کل وزن (من)</div>
        </div>` : ''}
      </div>`}
      ${kataTotalsBlockHtml(entry.sabka, entry.today, entry.total, entry.jamah, entry.bqaya, idx)}
      <div class="kata-entry-actions" style="display:flex;gap:6px;margin-top:10px;justify-content:center;">
        <button type="button" class="kata-print-entry-btn kata-print-mobile-btn" style="padding:5px 10px;font-size:11px;border:none;border-radius:4px;color:#fff;background:var(--maroon);cursor:pointer;">🖨 موبائل پرنٹ</button>
        <button type="button" class="kata-print-entry-btn kata-print-computer-btn" data-print-mode="computer" style="padding:5px 10px;font-size:11px;border:none;border-radius:4px;color:#fff;background:var(--maroon);cursor:pointer;">🖨 کمپیوٹر پرنٹ</button>
      </div>
    </div>`;
}

// Renders the "Sabka / Today / Total / Jamah / Jamah / Bqaya" mini-table —
// matches the photographed register page's summary block exactly: three
// value columns (T, Price, T.Prift), but Jamah/Jamah/Bqaya rows only apply
// to the two money columns (Price, T.Prift) — T (piece count) has no
// payment tracking, matching the photo where that column is blank there.
// entryIdx: passed only for already-SAVED entry cards (kataRenderEntryCard)
// so Jamah stays editable there too — user asked to be able to correct the
// Jamah/deposit amount on a past entry, not just while it's brand new.
// Editing a past entry's Jamah only affects its own Bqaya (never other
// entries' Sabka, which always carries from Total, not Jamah), so it's
// always safe to edit, even on a closed کھاتہ.
function kataTotalsBlockHtml(sabka, today, total, jamah, bqaya, entryIdx){
  jamah = jamah || {price:[0,0]};
  bqaya = bqaya || {price:0};
  const showDiscount = kataShowDiscount();
  // Agency کھاتہ — صارف کی درخواست پر (2026-08-22) اس سمری بلاک سے CTN اور
  // Profit کالم مکمل ہٹا دیے، صرف Price رہے گا۔ صرف Agency میں، سیلزمین/
  // ربنواز میں یہ کالم ویسے ہی رہیں گے۔
  const agencySimple = kataInstance === 'agency';
  const jamahDiscount = jamah.discount || [0,0];
  const jamahProfit = jamah.profit || [0,0];
  const jamahT = jamah.t || [0,0];
  const jamahRow = (i)=> entryIdx != null
    ? `<tr><td style="text-align:right;padding-right:6px;">${agencySimple ? 'Cash' : 'Jamah'}</td>${agencySimple ? '' : `<td></td>`}<td><input type="text" inputmode="numeric" class="cell-input" data-kata-entry-jamah="${entryIdx}:${i}" style="border:1px solid var(--line);" value="${kataIndianNumberFormat(jamah.price[i]||0)}"></td>${agencySimple ? '' : `<td><input type="text" inputmode="numeric" class="cell-input" data-kata-entry-jamah-profit="${entryIdx}:${i}" style="border:1px solid var(--line);" value="${kataIndianNumberFormat(jamahProfit[i]||0)}"></td>`}${showDiscount ? `<td><input type="text" inputmode="numeric" class="cell-input" data-kata-entry-jamah-discount="${entryIdx}:${i}" style="border:1px solid var(--line);" value="${kataIndianNumberFormat(jamahDiscount[i]||0)}"></td>` : ''}</tr>`
    : `<tr><td style="text-align:right;padding-right:6px;">${agencySimple ? 'Cash' : 'Jamah'}</td>${agencySimple ? '' : `<td></td>`}<td>${jamah.price[i]||0}</td>${agencySimple ? '' : `<td>${jamahProfit[i]||0}</td>`}${showDiscount ? `<td>${jamahDiscount[i]||0}</td>` : ''}</tr>`;
  const bqayaTCell = entryIdx != null
    ? `<td data-kata-entry-bqaya-t="${entryIdx}">${bqaya.t||0}</td>`
    : `<td>${bqaya.t||0}</td>`;
  const bqayaCell = entryIdx != null
    ? `<td data-kata-entry-bqaya="${entryIdx}">${bqaya.price}</td>`
    : `<td>${bqaya.price}</td>`;
  const bqayaProfitCell = entryIdx != null
    ? `<td data-kata-entry-bqaya-profit="${entryIdx}">${bqaya.profit||0}</td>`
    : `<td>${bqaya.profit||0}</td>`;
  const bqayaDiscountCell = entryIdx != null
    ? `<td data-kata-entry-bqaya-discount="${entryIdx}">${bqaya.discount||0}</td>`
    : `<td>${bqaya.discount||0}</td>`;
  return `
      <div class="edit-table" style="margin-top:8px;">
        <table dir="ltr">
          ${agencySimple ? '<colgroup><col style="width:30%"><col style="width:70%"></colgroup>' : ''}
          <thead><tr><th></th>${agencySimple ? '' : '<th>CTN</th>'}<th>Price</th>${agencySimple ? '' : '<th>Profit</th>'}${showDiscount ? '<th>Discount</th>' : ''}</tr></thead>
          <tbody>
            <tr><td style="text-align:right;padding-right:6px;">${agencySimple ? 'Previous Bill' : 'Sabka'}</td>${agencySimple ? '' : `<td>${sabka.t||0}</td>`}<td>${sabka.price}</td>${agencySimple ? '' : `<td>${sabka.profit||0}</td>`}${showDiscount ? `<td>${sabka.discount||0}</td>` : ''}</tr>
            <tr><td style="text-align:right;padding-right:6px;">${agencySimple ? 'New Bill' : 'Today'}</td>${agencySimple ? '' : `<td>${today.t||0}</td>`}<td>${today.price}</td>${agencySimple ? '' : `<td>${today.profit||0}</td>`}${showDiscount ? `<td>${today.discount||0}</td>` : ''}</tr>
            <tr><td style="text-align:right;padding-right:6px;">Total</td>${agencySimple ? '' : `<td>${total.t||0}</td>`}<td>${total.price}</td>${agencySimple ? '' : `<td>${total.profit||0}</td>`}${showDiscount ? `<td>${total.discount||0}</td>` : ''}</tr>
            ${jamahRow(0)}
            ${agencySimple ? '' : jamahRow(1)}
            <tr><td style="text-align:right;padding-right:6px;">${agencySimple ? 'Remaining Price' : 'Bqaya'}</td>${agencySimple ? '' : bqayaTCell}${bqayaCell}${agencySimple ? '' : bqayaProfitCell}${showDiscount ? bqayaDiscountCell : ''}</tr>
          </tbody>
        </table>
      </div>`;
}

function kataRenderNewEntryForm(prevTotal, prevSaleMahana, prevSalesman, isFirstEntry, prevItemData){
  prevItemData = prevItemData || {};
  let rows = '';
  // یہاں براہِ راست ریٹ لسٹ (packs) سے پڑھتے ہیں — KATA_ITEMS پر انحصار
  // نہیں کرتے، تاکہ کسی بھی وقتی ترتیب (sync کب چلا) کے مسئلے سے قطع نظر
  // ہمیشہ اسی لمحے کی تازہ ترین B لسٹ ہی نظر آئے۔
  const showDiscount = kataShowDiscount();
  const showKraya = kataShowKraya();
  // Agency کھاتہ — صارف کی درخواست پر (2026-08-22) نئی انٹری فارم سے بھی
  // Profit اور T.Profit کالم مکمل ہٹا دیے۔ صرف Agency میں۔
  const agencySimple = kataInstance === 'agency';
  KATA_ITEMS.forEach((item, idx)=>{
    const p = kataFindPack(item.key);
    const liveName = item.name;
    // Z Net Bill کی دونوں قطاریں کسی ریٹ لسٹ پراڈکٹ سے منسلک نہیں — پوری
    // طرح دستی انٹری کے لیے ہیں، اس لیے ان کا Rate اور Profit بھی (باقی
    // آئٹمز کے برعکس، جہاں یہ خودکار/مقررہ ہیں) براہِ راست ٹائپ کیے جا
    // سکتے ہیں۔ اسی لیے Z Net Bill کے تمام خانے (Weight/Rate/Profit/
    // Discount) کبھی "چپکنے والے" نہیں ہوتے — ہر نئی انٹری میں ہمیشہ 0 سے
    // شروع ہوتے ہیں، کسی پچھلی انٹری سے کچھ نہیں لاتے (2026-08-23 صارف کی
    // درخواست پر)۔
    const isZNet = item.key === 'znet1' || item.key === 'znet2';
    // Weight اب "چپکنے والا" ہے — پچھلی انٹری میں صارف نے جو Weight لکھا
    // تھا وہ ریٹ لسٹ کی موجودہ قدر پر ترجیح رکھتا ہے (2026-08-23)۔ Z Net
    // Bill کے لیے یہ سرے سے لاگو نہیں (ہمیشہ خالی)۔
    const stickyWeight = prevItemData[item.key] && prevItemData[item.key].weight;
    const liveWeight = isZNet ? '' : ((stickyWeight != null) ? stickyWeight : (p ? p.tpcs : item.weight));
    const liveRate = isZNet ? 0 : (p ? (Number(p.agencyB) || 0) : item.rate);
    const liveProfitDefault = isZNet ? 0 : item.prift;
    const nameColor = 'color:#1a1a1a;'; // Sabka/عام متن جیسا سیاہ — 2026-08-21 سے پہلے سرخ تھا
    const sabkaCtn = isZNet ? 0 : ((prevItemData[item.key] && prevItemData[item.key].totalT) || 0);
    // Discount اب "چپکنے والا" ہے — پچھلی انٹری میں اسی آئٹم پر جو لکھا گیا
    // تھا وہی یہاں پہلے سے بھرا آئے گا (2026-08-22)۔ Z Net Bill کے لیے
    // ہمیشہ 0۔
    const stickyDiscount = isZNet ? 0 : ((prevItemData[item.key] && prevItemData[item.key].discount) || 0);
    // صارف نے واضح طور پر صرف سیلزمین کھاتہ میں نمبر والے خانے (Rate سے
    // Total CTN تک) بڑے/پڑھنے کے قابل بنانے کو کہا — # اور Items/Weight کی
    // موجودہ سائز (kata-normal-size/kata-smaller-size) کو نہیں چھیڑا۔
    const numClass = ' kata-num-readable'; // 2026-08-22: ربنواز/Agency میں بھی وہی چھوٹے 'ڈاٹ جیسے نظر آنے والے' نمبروں کی شکایت — اب تینوں کھاتوں میں لاگو
    const thinClass = ' kata-thin-text';
    const discountCells = showDiscount ? `
      <td data-color-key="${item.key}-discount"><input type="text" inputmode="decimal" class="cell-input${numClass}" data-kata-field="discount" data-kata-item="${item.key}" style="border:1px solid var(--line);" value="${stickyDiscount}"></td>
      <td data-color-key="${item.key}-discounttotal"><span class="cell-val${numClass}" data-kata-discounttotal="${item.key}">0</span></td>

    const priftCells = agencySimple ? '' : `
      <td data-color-key="${item.key}-prift"><input type="text" inputmode="decimal" class="cell-input${numClass}" data-kata-prift="${item.key}" style="border:1px solid var(--line);" value="${liveProfitDefault}" ${isZNet ? '' : 'disabled'}></td>

    // کارٹن کرایہ (دستی) اور ٹوٹل کرایہ (خودکار = ریٹ × T CTN)۔ پچھلی
    // انٹری کی طرح "چپکنے والا" (Discount کی طرح)۔
    const stickyKrayaRate = isZNet ? 0 : ((prevItemData[item.key] && prevItemData[item.key].krayaRate) || 0);
    const stickyCommissionRate = isZNet ? 0 : ((prevItemData[item.key] && prevItemData[item.key].commissionRate) || 0);
    const krayaCells = agencySimple ? `
      <td data-color-key="${item.key}-krayarate" class="kata-krayarate-col"><input type="text" inputmode="decimal" class="cell-input${numClass}" data-kata-field="krayaRate" data-kata-item="${item.key}" style="border:1px solid var(--line);" value="${stickyKrayaRate}"></td>

      <td data-color-key="${item.key}-commissiontotal" class="kata-commission-col"><span class="cell-val${numClass}" data-kata-commissiontotal="${item.key}">0</span></td>` : '';
    rows += `<tr>
      <td data-color-key="${item.key}-idx" class="cell-val${numClass}${thinClass}" style="${kataInstance === 'salesman' ? 'padding:2px;' : ''}">${

          : (idx+1)
      }</td>
      <td data-color-key="${item.key}-name" style="text-align:left;padding-left:6px;"><input type="text" class="cell-input${numClass}${thinClass}" data-kata-field="name" data-kata-item="${item.key}" style="border:1px solid var(--line);text-align:left;${nameColor}" value="${kataEscape(liveName)}"></td>
      <td data-color-key="${item.key}-t" class="kata-t-cell" style="display:flex;align-items:center;gap:1px;padding:1px;"><input type="number" inputmode="numeric" class="cell-input${numClass}" data-kata-field="t" data-kata-item="${item.key}" data-kata-tctn-order="${idx}" style="border:1px solid var(--line);background-color:#d9f2d9;flex:1;min-width:0;" value="0">${kataInstance === 'salesman' ? `<input type="text" inputmode="numeric" maxlength="2" title="سابقہ (پرانا حصہ) — صرف نوٹ کے لیے" data-kata-field="sabkaNote" data-kata-item="${item.key}" style="width:11px;height:12px;font-size:5px;padding:0;border:1px solid var(--line);text-align:center;box-sizing:border-box;flex-shrink:0;">` : ''}</td>
      <td data-color-key="${item.key}-weight"><input type="text" class="cell-input kata-smaller-size${thinClass}" data-kata-field="weight" data-kata-item="${item.key}" style="border:1px solid var(--line);width:100%;box-sizing:border-box;" value="${kataEscape(kataDisplayWeight(liveWeight))}"></td>
      <td data-color-key="${item.key}-rate"><input type="text" inputmode="decimal" class="cell-input${numClass}" data-kata-rate="${item.key}" style="border:1px solid var(--line);" value="${liveRate}" ${isZNet ? '' : 'disabled'}></td>
      <td data-color-key="${item.key}-totalrate"><span class="cell-val${numClass}" data-kata-totalrate="${item.key}">0</span></td>${priftCells}${krayaCells}${discountCells}

  const nameLabel = kataInstance === 'agency' ? 'Agency name' : 'Salesman name';
  // یہ خانہ اب ہمیشہ اسی کھلے ہوئے کھاتے کے نام (kataOpenName) سے خودکار

}
